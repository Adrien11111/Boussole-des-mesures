const EXTRA2 = {"eco":[["Se fixer pour objectif zéro mort au travail","L’Assurance maladie recense chaque année plus de 700 décès liés à un accident du travail, sans compter les maladies professionnelles. Ses partisans veulent un objectif de prévention contraignant ; ses critiques jugent un « zéro » irréaliste et demandent des mesures concrètes."],["Lutter contre le temps partiel contraint des femmes","Selon l’Insee, environ un quart des femmes salariées travaillent à temps partiel, contre moins d’un homme sur dix, et une part de ce temps partiel est subie. Ses partisans veulent le réduire ; ses critiques évoquent le coût pour les employeurs."],["Instaurer un bouclier douanier pour les productions locales peu polluantes","La politique commerciale relève de l’Union européenne, qui fixe les droits de douane communs. Ses partisans veulent protéger les productions sobres ; ses critiques redoutent des mesures de rétorsion et une hausse des prix."],["Reconnaître aux salariés un droit de reprise et de préemption de leur entreprise","Depuis la loi de 2014, les salariés des entreprises de moins de 250 personnes doivent être informés d’une cession pour pouvoir présenter une offre, sans droit de priorité. Ses partisans veulent un vrai droit de préemption ; ses critiques défendent la liberté du cédant."],["Instaurer une taxe kilométrique aux frontières contre les délocalisations","Le mécanisme européen d’ajustement carbone aux frontières s’applique à certaines importations depuis 2026, mais ne tient pas compte de la distance parcourue. Ses partisans veulent un outil plus large ; ses critiques redoutent des représailles commerciales."],["Pratiquer un protectionnisme écologique avec clause de sauvegarde et prix minimum d’entrée","Les clauses de sauvegarde sont encadrées par l’OMC et par le droit européen. Ses partisans veulent protéger les producteurs et le climat ; ses critiques craignent une hausse des prix et des mesures de rétorsion."]],"eur":[["Renégocier le cadre de l’Organisation mondiale du commerce","L’OMC, créée en 1995, voit son organe d’appel paralysé depuis 2019 faute de nomination de juges. Ses partisans veulent refonder ses règles ; ses critiques défendent un cadre commun et redoutent un recul du libre-échange."]],"edu":[["Créer un service public d’accompagnement du handicap et mettre fin à la mutualisation des AESH","Les accompagnants d’élèves en situation de handicap sont des contractuels souvent à temps partiel, et leur aide est de plus en plus mutualisée entre plusieurs élèves depuis les pôles inclusifs de 2019. Ses partisans veulent un accompagnement individualisé ; ses critiques évoquent le coût."],["Donner plus de place à la nutrition dans les programmes scolaires","L’éducation à l’alimentation figure dans les programmes sans horaire dédié. Ses partisans veulent l’étendre ; ses critiques évoquent la charge des programmes."]],"sec":[["Définir une nouvelle approche face au terrorisme","Depuis 2017, la loi SILT a transposé en droit commun une partie des mesures de l’état d’urgence. Ses partisans veulent mettre l’accent sur la prévention ; ses critiques craignent un affaiblissement de la sécurité."],["Rattacher la lutte antiterroriste au Premier ministre","La coordination du renseignement et de la lutte antiterroriste est aujourd’hui assurée par un coordonnateur placé auprès de la présidence de la République. Ses partisans veulent un contrôle gouvernemental et parlementaire ; ses critiques défendent l’unité de commandement."],["Lutter contre l’impunité sexuelle et contre la requalification judiciaire des viols","Une part des viols est jugée comme délits (agressions sexuelles), ce qu’on appelle la correctionnalisation. Ses partisans veulent y mettre fin ; ses critiques évoquent l’engorgement des cours criminelles."],["Accroître les effectifs et les moyens de la sécurité civile","La France compte environ 250 000 sapeurs-pompiers, dont près de 80 % de volontaires. Ses partisans veulent plus de postes et de moyens ; ses critiques évoquent le coût pour les collectivités."]]};
const INFO = {"eco":{"P":["Le parc social compte environ 5,4 millions de logements, soit à peu près 16 % des résidences principales, et plus de deux millions de ménages attendent un logement social. Cette cadence serait nettement supérieure au rythme actuel de production. Pour ses partisans, elle répond à une pénurie ; pour ses critiques, le foncier, le financement et les capacités des bailleurs et du bâtiment seraient des freins.","Le seuil de pauvreté retenu est celui de l’Insee : 60 % du niveau de vie médian, soit 1 337 € par mois pour une personne seule. Dans le premier budget présenté par LFI, la partie destinée aux jeunes est chiffrée à 9,5 milliards d’euros par an. Ses partisans y voient un moyen d’éradiquer la pauvreté ; ses détracteurs soulignent le coût et l’écart avec des minima actuels comme le RSA, qui y sont bien inférieurs.","La durée légale du travail est déjà de 35 heures par semaine depuis les lois Aubry, mais elle est contournée par des dérogations (heures supplémentaires, forfaits). La mesure vise à rétablir la règle et à passer à 32 heures dans les métiers pénibles. Ses partisans invoquent la santé et le partage du travail ; ses critiques redoutent un surcoût pour les entreprises et les services publics et des difficultés de recrutement.","La réforme de 2023 relevait l’âge légal de 62 à 64 ans ; elle est suspendue jusqu’au 1er janvier 2028 par la loi de financement de la Sécurité sociale pour 2026, qui fige l’âge à 62 ans et 9 mois pour les générations 1964 à 1968. LFI veut revenir à 60 ans avec 40 années de cotisation, en plusieurs étapes. Ses partisans parlent de pénibilité et de justice ; ses critiques, du financement du système et du vieillissement.","Cette « taxe Zucman » imposerait un minimum de 2 % par an sur les patrimoines supérieurs à 100 millions d’euros, ce qui concernerait environ 1 800 foyers. Son promoteur annonce 15 à 25 milliards d’euros de recettes ; d’autres économistes évoquent plutôt 5 milliards, en raison de l’exil fiscal et de l’optimisation. Le sort des entreprises non cotées et le risque constitutionnel font aussi débat.","Le Smic net est d’environ 1 478 € par mois depuis le 1er juin 2026, donc 1 700 € représenteraient une hausse d’environ 15 %. Ses partisans y voient une réponse au pouvoir d’achat ; ses critiques craignent une charge lourde pour les petites entreprises, des effets sur l’emploi peu qualifié et une compression de l’échelle des salaires, qui obligerait à relever aussi les salaires proches."],"O":["L’encadrement des loyers est expérimenté depuis 2019 dans plusieurs grandes agglomérations. LFI propose d’abord un gel, puis un encadrement plus strict. Ses partisans veulent freiner la hausse des loyers ; ses critiques redoutent une baisse de l’offre locative et un moindre entretien du parc.","Une trêve hivernale interdit déjà les expulsions du 1er novembre au 31 mars, et une loi de 2023 a durci les règles contre les impayés et l’occupation illégale. La mesure ferait du relogement une condition permanente. Le débat oppose droit au logement et droit de propriété, ainsi que la capacité de l’État à reloger.","L’idée est proche de la « garantie universelle des loyers » prévue par la loi Alur de 2014 puis abandonnée. Elle existe aujourd’hui sous des formes limitées, comme Visale. Ses partisans y voient une sécurité pour les bailleurs et un accès facilité pour les locataires ; ses critiques s’interrogent sur son coût et sur son financement.","La location de sa résidence principale est limitée à 120 jours par an, et les communes peuvent descendre plus bas, jusqu’à 90 jours depuis une loi de 2024. LFI propose 60 jours. Ses partisans veulent libérer des logements pour les habitants ; ses critiques mettent en avant les revenus complémentaires des propriétaires et le tourisme local.","Une taxe sur les logements vacants existe déjà dans les zones tendues. LFI veut l’alourdir progressivement. Ses partisans y voient un moyen de remettre des logements sur le marché ; ses critiques soulignent que beaucoup de logements vacants le sont pour des raisons de travaux, de succession ou de vétusté.","La loi SRU impose aujourd’hui 25 % de logements sociaux dans les communes urbaines concernées, 20 % dans les territoires moins tendus ; des centaines de communes sont « carencées ». LFI relèverait le seuil à 30 %. Ses partisans défendent la mixité sociale ; ses critiques évoquent le manque de foncier et les réalités locales.","La lutte contre les marchands de sommeil et les logements insalubres repose aujourd’hui sur des services communaux et préfectoraux aux moyens inégaux. Un corps national dédié renforcerait les contrôles. Les critiques demandent quels seraient son coût et ses pouvoirs, notamment sur les petits propriétaires.","Le « permis de louer » existe déjà de manière facultative, dans certaines communes, depuis la loi Alur de 2014. La mesure le rendrait obligatoire partout. Ses partisans y voient un outil contre l’habitat indigne ; ses critiques redoutent une lourdeur administrative et une dissuasion des petits bailleurs.","La France a connu des blocages de prix dans le passé, par exemple dans les années 1980, et plusieurs dispositifs de suivi des marges existent depuis l’inflation de 2022-2023. Ses partisans y voient une protection du pouvoir d’achat ; ses critiques redoutent des pénuries, une distorsion de la concurrence et un effet sur les petits commerçants.","Cette mesure prolonge l’idée d’un « panier » de produits à prix limité, déjà tentée en 2022-2023 sous la forme d’opérations volontaires de la grande distribution. Ses partisans veulent protéger l’accès à une alimentation saine ; ses critiques craignent un effet pervers sur les producteurs si les prix de vente baissent sans compensation.","L’idée d’une quantité vitale gratuite d’eau a été expérimentée dans quelques collectivités, comme Dunkerque. Appliquée à l’énergie, elle supposerait de financer cette gratuité par des tarifs plus élevés pour les gros consommateurs. Ses partisans en font un outil de justice sociale et de sobriété ; ses critiques, une complexité de gestion et un coût important.","En 2026, l’accès régulé à l’électricité nucléaire historique (Arenh) a été remplacé par un nouveau mécanisme, le versement nucléaire universel. LFI veut des tarifs qui reflètent les coûts de production plutôt que les prix de marché européens. Ses partisans veulent découpler le prix du gaz ; ses critiques soulignent le conflit possible avec les règles du marché européen.","Les frais bancaires d’incident sont déjà plafonnés par la loi, à 8 € par opération et 80 € par mois, avec des plafonds plus bas pour les clients fragiles. LFI propose de les plafonner davantage. Les banques peuvent compenser par d’autres frais ; ses partisans y voient une protection des ménages modestes.","Cette idée prolonge l’expérimentation « Territoires zéro chômeur de longue durée », lancée en 2016 et étendue depuis. Ses partisans y voient un moyen d’éliminer le chômage de longue durée en finançant des emplois utiles ; ses critiques s’interrogent sur le coût, la qualité des emplois créés et la concurrence avec les entreprises locales.","Les CDD et l’intérim représentent une part importante des embauches, mais une part plus modeste de l’emploi total. LFI voudrait plafonner leur proportion dans chaque entreprise selon sa taille. Ses partisans veulent stabiliser l’emploi ; ses critiques redoutent une rigidité pour les secteurs saisonniers et les activités à fortes variations.","Il s’agit de la loi El Khomri (2016) et des ordonnances de 2017, qui ont notamment donné plus de place aux accords d’entreprise, créé le comité social et économique et plafonné les indemnités prud’homales. Ses partisans veulent restaurer des protections ; ses critiques soutiennent que ces réformes ont aidé l’embauche.","Les salariés ont aujourd’hui cinq semaines de congés payés, un droit instauré en 1982. Une sixième semaine représenterait un coût de travail supplémentaire. Ses partisans parlent de repos et de qualité de vie ; ses critiques de productivité, de coût pour les entreprises et de continuité dans les services publics.","Le temps partiel est encadré par la loi, avec une durée minimale hebdomadaire de 24 heures sauf dérogations. La mesure ciblerait le temps partiel subi, notamment dans le nettoyage et la grande distribution. Ses partisans soulignent la précarité des horaires fragmentés ; ses critiques, les contraintes d’organisation.","Plusieurs centaines de personnes meurent chaque année d’un accident du travail en France. Le burn-out peut être reconnu comme maladie professionnelle au cas par cas, sous des conditions strictes. Ses partisans veulent une reconnaissance automatique ; ses critiques s’interrogent sur la difficulté de prouver le lien avec le travail.","La réforme de 2023 visait déjà une pension minimale d’environ 85 % du Smic net pour une carrière complète. LFI irait jusqu’à 100 % du Smic. Ses partisans parlent de dignité des retraités modestes ; ses critiques s’interrogent sur le financement et sur l’incitation à cotiser.","La décote réduit la pension de ceux qui partent avant l’âge du taux plein sans avoir tous leurs trimestres. L’âge du taux plein automatique reste fixé à 67 ans. Supprimer la décote coûterait cher, mais ses partisans y voient une injustice pour les carrières hachées, notamment des femmes.","Les plans d’épargne retraite individuels bénéficient d’avantages fiscaux. LFI veut les supprimer pour renforcer la retraite par répartition. Ses partisans défendent un système collectif et solidaire ; ses critiques y voient une atteinte à la liberté d’épargner et un risque pour le niveau de vie à la retraite.","C’est le volet « jeunes » de la garantie d’autonomie, pour ceux qui ne sont plus rattachés au foyer fiscal de leurs parents. La version de 2022 concernait les 18-25 ans en formation, sous conditions de ressources ; les règles de 2027 ne sont pas détaillées. Le coût annoncé est de 9,5 milliards d’euros par an.","Depuis une loi de 2022, les départements doivent accompagner jusqu’à 21 ans les jeunes sortant de l’aide sociale à l’enfance qui n’ont pas de ressources. Porter cet accompagnement à 25 ans coûterait plus cher aux départements. Ses partisans soulignent la précarité de ces jeunes après la majorité.","L’idée renvoie aux « emplois-jeunes » créés en 1997, qui avaient permis d’embaucher plusieurs centaines de milliers de jeunes dans le secteur public et associatif. Ses partisans y voient une première expérience et des services utiles ; ses critiques, un coût budgétaire et un risque de précarité à la sortie.","Le congé de maternité dure aujourd’hui 16 semaines pour un premier enfant, et le congé de paternité environ un mois. LFI propose un congé d’accueil de 20 semaines pour chaque parent. Ses partisans défendent l’égalité entre les parents ; ses critiques soulignent le coût pour la Sécurité sociale et pour les entreprises.","ArcelorMittal est le premier sidérurgiste de France, avec notamment les sites de Dunkerque et de Fos-sur-Mer. Décarboner l’acier exige de lourds investissements, par exemple des fours électriques. Ses partisans veulent garder une industrie stratégique ; ses critiques s’interrogent sur le coût d’une nationalisation et sur la gestion publique.","L’Europe a lancé un plan, le Chips Act, pour relocaliser des capacités de fabrication de semi-conducteurs. Le principal site français est à Crolles, autour de STMicroelectronics. Ses partisans y voient un enjeu de souveraineté ; ses critiques, un projet très coûteux et dépendant de savoir-faire rares.","L’État a renationalisé EDF en 2023 et détient des participations dans plusieurs groupes stratégiques. Les pôles publics proposés iraient plus loin, dans le médicament, l’énergie, la banque. Ses partisans veulent un pilotage par l’intérêt général ; ses critiques s’interrogent sur l’efficacité de la gestion publique et sur les règles de concurrence européennes.","Les pénuries de médicaments et de composants pendant la crise sanitaire ont relancé le débat sur les relocalisations. Une agence dédiée planifierait lesquelles. Ses partisans en attendent plus de souveraineté ; ses critiques redoutent un surcoût pour les consommateurs et les limites du droit de la concurrence.","La loi Hamon de 2014 oblige déjà à informer les salariés d’un projet de cession d’une petite entreprise. Un droit de préemption irait plus loin et favoriserait la reprise en coopérative (Scop). Ses partisans y voient un moyen de sauver des emplois ; ses critiques, une contrainte pour les cédants.","L’Union européenne a mis en place un mécanisme d’ajustement carbone aux frontières, entré en phase définitive en 2026. Les droits de douane relèvent de la compétence de l’Union, et ils doivent respecter les règles de l’OMC. Ses partisans y voient un outil de protection industrielle et climatique ; ses critiques, un risque de représailles.","L’impôt sur le revenu compte aujourd’hui cinq tranches, de 0 % à 45 %. Passer à 14 tranches rendrait le barème plus progressif, surtout pour les hauts revenus. Ses partisans parlent de justice fiscale ; ses critiques redoutent un effet sur l’attractivité et le travail des cadres.","L’ISF a existé, avec une interruption, de 1982 à 2017 ; il a été remplacé en 2018 par un impôt sur la fortune immobilière (IFI). LFI estime son rétablissement à environ 10 milliards d’euros de recettes. Ses partisans y voient de la justice fiscale ; ses détracteurs, un risque d’exil fiscal et un frein à l’investissement.","Depuis 2018, les revenus du capital sont taxés à un taux forfaitaire d’environ 30 %. Sa suppression, estimée par LFI à 9 milliards d’euros de recettes, les soumettrait au barème de l’impôt sur le revenu. Ses partisans veulent taxer le capital comme le travail ; ses critiques craignent un effet sur l’épargne et l’investissement.","En ligne directe, un enfant bénéficie d’un abattement de 100 000 € et le taux peut monter jusqu’à 45 %. LFI propose de plafonner le montant qu’une personne peut recevoir à 12 millions d’euros. Ses partisans défendent l’égalité des chances ; ses critiques mettent en avant le droit de propriété et un risque d’inconstitutionnalité.","Des taxes ciblées existent déjà sur certains biens de luxe. LFI veut en créer une qui frappe les biens ostentatoires comme les yachts et les jets privés. Ses partisans y voient un impôt juste et symbolique ; ses critiques soulignent un rendement modeste et un risque de délocalisation des biens.","En 2022-2023, l’Union européenne a mis en place une contribution exceptionnelle sur les énergéticiens, et la France a voté une surtaxe sur les grandes entreprises en 2025. LFI propose un mécanisme en période de crise. Ses partisans veulent faire contribuer les gagnants des crises ; ses critiques, définir ce qu’est un « superprofit » reste difficile.","Les couples mariés ou pacsés sont imposés ensemble, ce qui peut réduire l’impôt quand les revenus sont inégaux. Remplacer cela par une imposition individuelle et un crédit d’impôt par enfant changerait les gagnants et perdants. Ses partisans parlent d’égalité entre femmes et hommes ; ses critiques redoutent une hausse d’impôt pour certaines familles.","Une loi de 2013 a imposé de filialiser certaines activités spéculatives des banques, mais sans séparation totale entre banque de détail et d’investissement. Une séparation stricte rappelle le Glass-Steagall Act américain, abrogé en 1999. Ses partisans veulent limiter les risques pour les épargnants ; ses critiques, un affaiblissement des banques françaises.","La France applique depuis 2012 une taxe sur les transactions financières, au taux de 0,3 % depuis 2017, sur l’achat d’actions de grandes entreprises. LFI veut l’élargir et la durcir. Ses partisans y voient un moyen de limiter la spéculation ; ses critiques redoutent un déplacement des transactions vers d’autres places financières.","La Banque publique d’investissement (Bpifrance) existe depuis 2012 et la Caisse des dépôts finance des projets publics. LFI veut un pôle bancaire plus large, orienté vers les besoins productifs. Ses partisans veulent orienter le crédit ; ses critiques s’interrogent sur la gestion publique et la concurrence.","La Banque centrale européenne prépare un euro numérique, dont le cadre juridique est en discussion dans l’Union européenne. Le débat porte sur la confidentialité des paiements, le plafond de détention et le rôle des banques. LFI demande un euro public qui respecte la vie privée.","Aujourd’hui, une entreprise peut verser plus de dividendes que son bénéfice de l’année en puisant dans ses réserves. Ses partisans veulent forcer l’investissement et la hausse des salaires ; ses critiques y voient une atteinte à la liberté de gestion et à la rémunération des actionnaires, y compris des épargnants.","Les lois Egalim (2018 et 2021) cherchent à construire les prix à partir des coûts de production, sans prix plancher légal. Un prix plancher est difficile à concilier avec les règles européennes de concurrence. Ses partisans veulent mieux rémunérer les agriculteurs ; ses critiques redoutent un effet sur les prix et les importations.","Des rapports publics ont débattu de l’évolution des marges de l’agroalimentaire et de la distribution pendant l’inflation de 2022-2023. LFI voudrait les encadrer pour plafonner les prix. Ses partisans parlent de pouvoir d’achat ; ses critiques, de distorsions et de pénuries.","La PAC est le plus gros poste du budget européen et verse surtout des aides à l’hectare, ce qui avantage les grandes exploitations. Sa réforme se décide à l’échelle européenne. Ses partisans veulent soutenir les petites fermes et les pratiques durables ; ses critiques, préserver la compétitivité.","Une part importante des agriculteurs partira à la retraite dans la décennie, ce qui pose la question de la reprise des fermes. Les Safer régulent déjà une partie des ventes de terres. Une réforme agraire irait plus loin pour faciliter l’installation. Le débat porte sur la propriété et sur le coût.","La loi Egalim fixe un objectif de 50 % de produits durables et de qualité, dont 20 % de bio, en restauration collective. Une préférence locale dans la commande publique se heurte aux règles européennes. Ses partisans défendent les circuits courts ; ses critiques, un surcoût et un risque juridique.","La loi sur le devoir de vigilance de 2017 oblige déjà les très grandes entreprises à prévenir les risques liés à leurs filiales et sous-traitants. La mesure étendrait la responsabilité des donneurs d’ordre. Ses partisans veulent mettre fin à la sous-traitance en cascade ; ses critiques, un risque juridique pour les entreprises."]},"ins":{"P":["Le référendum d’initiative partagée (2008) exige le soutien d’un cinquième des parlementaires puis d’environ 10 % des électeurs, un seuil jamais atteint. Un vrai RIC, tel que le réclamaient les « gilets jaunes », permettrait de proposer, d’abroger ou de révoquer. Ses partisans y voient plus de démocratie directe ; ses critiques redoutent des décisions émotionnelles et des atteintes aux droits des minorités.","La Ve République date de 1958 et a été révisée une vingtaine de fois. Une Assemblée constituante élue réécrirait les règles du pouvoir (rôle du président, du Parlement, droits). Ses partisans dénoncent un régime trop présidentiel ; ses critiques s’inquiètent d’une période d’instabilité et de l’issue incertaine du processus.","Les députés sont élus au scrutin majoritaire à deux tours dans 577 circonscriptions. La proportionnelle n’a été utilisée qu’en 1986. Ses partisans veulent une Assemblée qui reflète les voix ; ses critiques craignent des coalitions fragiles et la perte du lien avec un élu local.","Le 49.3 permet au gouvernement de faire adopter un texte sans vote, sauf si une motion de censure est votée. Depuis 2008, il est limité aux textes budgétaires et à un autre texte par session. Ses partisans dénoncent un passage en force ; ses défenseurs y voient un outil contre le blocage dans une Assemblée sans majorité.","Une grande partie de la presse, de la télévision privée et de l’édition appartient à quelques groupes industriels. Une commission d’enquête du Sénat a étudié cette concentration en 2021-2022. Ses partisans veulent protéger l’indépendance des rédactions ; ses critiques parlent d’atteinte à la propriété et à la liberté d’entreprendre.","La loi Claeys-Leonetti (2016) autorise une sédation profonde jusqu’au décès pour certains malades en fin de vie, mais pas l’aide active à mourir. Le sujet a fait l’objet de débats parlementaires récents. Ses partisans défendent un droit à l’autonomie ; ses opposants soulignent les risques de pressions sur les personnes vulnérables."],"O":["L’âge du vote est de 18 ans depuis 1974, abaissé de 21 ans. Plusieurs pays, comme l’Autriche ou Malte, autorisent le vote à 16 ans. Ses partisans y voient une meilleure intégration des jeunes ; ses critiques estiment que la maturité politique est inégale à cet âge.","Le vote est obligatoire en Belgique ou au Luxembourg, avec des sanctions. En France, le vote blanc est comptabilisé à part depuis 2014 mais n’entre pas dans les suffrages exprimés. Ses partisans espèrent une plus forte participation ; ses critiques y voient une atteinte à la liberté.","Il faut aujourd’hui 500 parrainages d’élus pour se présenter à la présidentielle, rendus publics par le Conseil constitutionnel. Des parrainages citoyens élargiraient l’accès au scrutin. Ses partisans veulent éviter que des candidats soient écartés ; ses critiques redoutent une multiplication des candidatures.","L’Assemblée dispose d’une procédure de pétitions, mais un seuil de signatures n’entraîne pas un débat obligatoire en séance. Ses partisans y voient une voie directe de la citoyenneté ; ses critiques s’inquiètent d’une surcharge de l’ordre du jour parlementaire.","Un projet de révision constitutionnelle peut être adopté par le Parlement réuni en Congrès, sans référendum, à la majorité des trois cinquièmes. Un référendum est déjà exigé pour l’adhésion d’un nouvel État à l’UE. Ses partisans veulent redonner la parole au peuple ; ses critiques redoutent un blocage.","Depuis 2017, un parlementaire ne peut plus cumuler son mandat avec une fonction exécutive locale. LFI veut un non-cumul plus strict. Ses partisans y voient un gage de disponibilité des élus ; ses critiques regrettent la perte du lien avec le terrain.","Un registre des représentants d’intérêts, tenu par la Haute Autorité pour la transparence de la vie publique, existe depuis la loi Sapin 2 (2016). Interdire les lobbyistes au Parlement irait plus loin. Ses partisans veulent limiter les influences ; ses critiques soulignent que le lobbying est aussi une source d’information.","Un agent public qui part dans le privé est soumis à un contrôle déontologique pour trois ans, par la Haute Autorité pour la transparence de la vie publique. Dix ans serait beaucoup plus long. Ses partisans veulent éviter les conflits d’intérêts ; ses critiques redoutent une dissuasion des carrières mixtes.","La loi de 1977 interdit de publier des sondages la veille et le jour du scrutin, et une commission en contrôle les méthodes. Ses partisans craignent leur effet sur le vote ; ses critiques y voient une information utile et une atteinte à la liberté de la presse.","Les règles françaises de concentration datent de 1986 et ont été complétées depuis, mais elles distinguent selon les supports (télévision, radio, presse). Les unifier modifierait les seuils. Ses partisans visent le pluralisme ; ses critiques redoutent une régulation lourde.","Depuis 2013, c’est l’Arcom, autorité indépendante, qui nomme les présidents de l’audiovisuel public ; avant cela, c’est le chef de l’État qui les choisissait directement. Ses partisans veulent réduire l’influence de l’exécutif ; ses critiques craignent une politisation par la majorité parlementaire.","La redevance audiovisuelle a été supprimée en 2022 et remplacée par une part de la TVA. LFI veut une contribution dédiée, universelle et progressive. Ses partisans y voient une garantie d’indépendance ; ses critiques, une nouvelle taxe.","Le règlement européen sur l’IA interdit en principe l’identification biométrique à distance en temps réel dans l’espace public, avec des exceptions pour les enquêtes. Des algorithmes de vidéosurveillance ont été expérimentés pour les Jeux olympiques de 2024. Le débat oppose sécurité et libertés.","La police judiciaire agit sous la direction de la justice pour ses enquêtes, mais ses services dépendent de l’Intérieur. Ses partisans veulent garantir son indépendance ; ses critiques soulignent le risque de perdre un lien étroit avec l’ordre public.","Les cours criminelles départementales, créées en 2019 et généralisées en 2023, jugent sans jurés populaires certains crimes. Ses partisans défendent la place des citoyens dans la justice ; ses critiques mettent en avant la lenteur des procès d’assises.","L’aide juridictionnelle existe pour les ménages modestes. Le divorce par consentement mutuel se fait depuis 2017 par acte d’avocat, sans juge. Rendre gratuites les procédures courantes augmenterait le coût pour l’État. Ses partisans parlent d’accès à la justice ; ses critiques, de coût et de risque de surcharge des tribunaux.","La France compte environ 35 000 communes. Les communes nouvelles sont encouragées depuis 2015, en principe de manière volontaire. Ses partisans défendent la proximité et l’identité locale ; ses critiques mettent en avant les économies d’échelle.","Les 13 régions métropolitaines actuelles existent depuis 2016, après des fusions. Des éco-régions suivraient des bassins écologiques. Ses partisans veulent mieux gérer l’eau et les écosystèmes ; ses critiques redoutent un nouveau découpage coûteux et une complexité administrative.","La Convention citoyenne pour le climat (2019-2020) a servi de précédent à des assemblées de citoyens tirés au sort. Ses partisans y voient un débat plus éclairé sur l’aménagement ; ses critiques s’interrogent sur leur légitimité face aux élus.","Un processus sur l’autonomie de la Corse est en cours depuis 2022-2024, avec une révision de la Constitution à l’étude. Le débat porte sur le degré d’autonomie, sur la langue et sur le statut de résident.","Trois référendums (2018, 2020, 2021) ont rejeté l’indépendance, le dernier étant boycotté par une partie des indépendantistes. Des émeutes ont éclaté en mai 2024. Les discussions portent sur un nouveau statut. Ses partisans défendent le droit à l’autodétermination ; ses critiques, les risques d’instabilité.","Le régime local d’Alsace-Moselle, hérité de l’annexion allemande, fait rémunérer par l’État les ministres des cultes catholique, protestant et israélite. Ses partisans voient une exception à la laïcité ; ses défenseurs y voient un héritage historique et local.","La loi de 1905 sépare l’Église et l’État, mais ne règle pas la présence d’élus aux cérémonies. Ses partisans veulent renforcer la neutralité des représentants de l’État ; ses critiques y voient une atteinte à la liberté de religion et un excès de rigueur.","La Charte de l’environnement de 2004 fait déjà partie du bloc de constitutionnalité. Un projet d’inscrire la préservation de l’environnement à l’article 1er a échoué en 2021. Ses partisans veulent un cadre contraignant ; ses critiques, un risque de blocage juridique.","Des débats ont eu lieu ces dernières années sur l’accès des autorités aux messageries chiffrées pour lutter contre la criminalité. Ses partisans protègent la vie privée ; ses critiques soulignent les besoins des enquêtes."]},"clim":{"P":["Le glyphosate a été réautorisé dans l’Union européenne en 2023 pour dix ans. La réintroduction d’un néonicotinoïde par la loi Duplomb a été censurée par le Conseil constitutionnel en 2025. Ses partisans veulent protéger la santé et la biodiversité ; ses critiques mettent en avant les difficultés des agriculteurs à se passer de ces produits face à leurs concurrents.","L’objectif européen est de réduire de 55 % les émissions d’ici 2030 par rapport à 1990, et la France vise la neutralité carbone en 2050. Le texte ne précise pas l’année de référence. Ses partisans parlent d’urgence climatique ; ses critiques s’inquiètent du coût et du rythme de la transition.","La SNCF est devenue une société anonyme à capitaux publics en 2020. Le transport de voyageurs est ouvert à la concurrence, sous l’impulsion de l’Union européenne. Ses partisans veulent un service public unifié ; ses critiques mettent en avant la qualité et les prix permis par la concurrence.","Le nucléaire produit environ les deux tiers de l’électricité française, les renouvelables un quart. LFI vise le tout renouvelable à l’horizon 2060. Ses partisans parlent de sécurité et de sobriété ; ses critiques évoquent l’intermittence, le stockage et les coûts.","La France exploite 57 réacteurs, et un programme de six nouveaux EPR2 est prévu. Fermer le parc exigerait de remplacer une production importante. Ses partisans invoquent les risques et les déchets ; ses critiques, la production bas carbone et l’indépendance énergétique.","Le rythme actuel des rénovations d’ampleur est nettement inférieur à cet objectif, malgré les aides comme MaPrimeRénov’. Ses partisans y voient un moyen de réduire les factures et les émissions ; ses critiques soulignent le coût et la pénurie d’artisans."],"O":["Les retenues d’eau destinées à l’irrigation sont au cœur de conflits depuis les affrontements de Sainte-Soline en 2023. Ses partisans parlent de partage de l’eau ; ses critiques, des besoins de l’agriculture face à la sécheresse.","Paris a repris la distribution de l’eau en régie publique en 2010, et d’autres villes ont suivi. D’autres communes restent déléguées à des groupes privés. Ses partisans veulent un contrôle citoyen ; ses critiques mettent en avant le savoir-faire des opérateurs.","Dunkerque offre depuis 2012 les premiers mètres cubes d’eau aux habitants. Ses partisans y voient un droit à l’eau ; ses critiques, un coût supporté par d’autres usagers.","Environ un litre d’eau sur cinq se perd dans les canalisations françaises, selon les chiffres officiels du plan Eau de 2023. Ses partisans veulent investir ; ses critiques soulignent le poids pour les collectivités.","L’Office français de la biodiversité, créé en 2020, assure une part des contrôles. Tripler les effectifs coûterait cher ; ses partisans y voient une condition de l’application du droit, ses critiques une charge sur les agriculteurs et les entreprises.","Les coupes rases sont courantes en forêt de production, et un débat oppose gestion économique et préservation de la biodiversité. Ses partisans parlent de sols et de paysages ; ses critiques, de filière bois.","La stratégie nationale vise 10 % du territoire en protection forte en 2030. Laisser 25 % de la forêt en évolution libre irait bien plus loin. Ses partisans invoquent la biodiversité ; ses critiques, les besoins en bois.","Le règlement européen sur la restauration de la nature, adopté en 2024, impose des plans nationaux. Ses partisans veulent l’appliquer pleinement ; ses critiques redoutent des contraintes pour l’agriculture et les propriétaires.","La France affiche un objectif de 30 % de protection, mais la protection forte reste faible et des pratiques comme le chalutage persistent dans certaines zones. Ses partisans veulent l’appliquer réellement ; ses critiques mettent en avant les pêcheurs.","Les nouvelles techniques génomiques sont l’objet de discussions dans l’Union européenne pour assouplir les règles. Ses partisans parlent de précaution ; ses critiques y voient un outil pour l’agriculture et le climat.","Le droit européen exclut les variétés végétales du brevet mais autorise certaines inventions biotechnologiques. Ses partisans défendent le vivant comme bien commun ; ses critiques, l’innovation.","L’Union européenne a conclu des accords de pêche avec des pays africains comme le Sénégal ou la Mauritanie. Ses partisans dénoncent la concurrence avec les pêcheurs locaux ; ses défenseurs mettent en avant les revenus pour ces pays.","Les 12 milles marins correspondent aux eaux territoriales. Ses partisans visent la protection des petits pêcheurs ; ses critiques soulignent les besoins de certaines flottes.","Un objectif voisin figure déjà dans la planification énergétique officielle, et peu de parcs sont en service. Ses partisans parlent d’énergie propre ; ses critiques, de coût, de paysage et d’impact sur la pêche.","Des mesures agroenvironnementales (MAEC) existent déjà dans la politique agricole commune. Ses partisans veulent sécuriser la transition ; ses critiques, un coût budgétaire.","L’agriculture a perdu une grande partie de ses actifs depuis plusieurs décennies. Ses partisans veulent inverser la tendance par des pratiques plus intensives en main-d’œuvre ; ses critiques s’inquiètent du coût du travail et des prix.","La loi Egalim de 2018 interdit déjà, depuis 2022, la production et l’exportation de pesticides interdits dans l’Union. Ses partisans veulent en garantir l’application ; ses critiques soulignent les contournements possibles.","La loi Climat de 2021 interdit déjà les vols quand une alternative en train de moins de deux heures et demie existe. Ses partisans veulent étendre la règle ; ses critiques redoutent un impact pour les territoires mal desservis.","Un plan vélo national existe depuis 2018 et a été mis à jour en 2023. Ses partisans veulent plus d’investissements ; ses critiques estiment que les moyens budgétaires sont limités.","Les SUV sont taxés au poids dans le malus automobile. À Paris, les habitants ont voté en 2024 pour tripler le stationnement des véhicules lourds. Ses partisans parlent de sécurité et d’émissions ; ses critiques, de liberté de choix des familles.","Les prix des billets de train varient selon la demande (yield management). Ses partisans veulent un tarif plus lisible et moins cher ; ses critiques soulignent le coût pour la SNCF.","Plusieurs milliards d’euros d’avantages fiscaux dits défavorables à l’environnement subsistent en France. Ses partisans veulent y mettre fin ; ses critiques soulignent l’impact sur certains secteurs (transport, agriculture, pêche).","Les barrages hydroélectriques sont concédés, et la Commission européenne demande leur mise en concurrence. Ses partisans défendent un bien public ; ses critiques mettent en avant les règles européennes.","Les chaudières au fioul sont interdites à l’installation depuis 2022, et les pompes à chaleur progressent. Ses partisans parlent de climat ; ses critiques, du coût d’installation pour les ménages.","Depuis la loi Climat, les logements très énergivores (étiquette G) sont progressivement interdits à la location. Ses partisans veulent une application réelle ; ses critiques redoutent des propriétaires qui retirent leurs biens du marché.","Il existe déjà un droit au logement opposable. Un droit à la protection contre la chaleur obligerait les propriétaires à adapter les bâtiments. Ses partisans invoquent la santé lors des canicules ; ses critiques, le coût des travaux.","La consommation de viande est au cœur de débats sur le climat, la santé et l’élevage. Ses partisans parlent d’émissions et de santé ; ses critiques défendent les éleveurs et la liberté du consommateur.","Une loi de 2021 interdit déjà la construction de nouveaux bâtiments d’élevage de poules en cage en France. Ses partisans veulent aller plus loin ; ses critiques mettent en avant les coûts pour les éleveurs.","La loi AGEC de 2020 fixe l’objectif de la fin des plastiques à usage unique d’ici 2040, avec des interdictions progressives. Ses partisans veulent un rythme plus rapide ; ses critiques soulignent les contraintes pour les industriels.","Des expérimentations de consigne pour le réemploi du verre existent dans certaines régions. Ses partisans y voient un moyen de réduire les déchets ; ses critiques, un coût logistique."]},"eur":{"P":["La France a quitté le commandement intégré de l’OTAN en 1966 sous de Gaulle et l’a rejoint en 2009 sous Nicolas Sarkozy. Ses partisans défendent l’indépendance stratégique ; ses critiques soulignent le rôle de l’alliance dans la défense européenne, surtout depuis la guerre en Ukraine.","L’accord d’association entre l’UE et Israël comporte une clause de respect des droits de l’homme. Des débats ont lieu dans l’Union sur son application. Ses partisans invoquent le droit international ; ses critiques mettent en avant le dialogue et les intérêts de sécurité.","Depuis l’invasion de 2022, les pays européens divergent sur les conditions d’une négociation. Ses partisans veulent privilégier la diplomatie ; ses critiques estiment que la Russie n’est pas prête à négocier sans pression.","L’article 123 du traité sur le fonctionnement de l’UE interdit le financement direct des États par la BCE, qui a pourtant acheté de la dette sur le marché secondaire. Un changement exige l’unanimité des 27. Ses partisans veulent soutenir les États ; ses critiques redoutent l’inflation.","LFI a utilisé les expressions « plan A » et « plan B » pour décrire une renégociation des traités, puis une désobéissance ou une sortie en cas d’échec. Ses partisans défendent la souveraineté ; ses critiques redoutent une crise avec les partenaires européens.","La règle des 3 % date du traité de Maastricht. Les règles ont été réformées en 2024 et la France est en procédure de déficit excessif depuis la même année. Ses partisans veulent investir ; ses critiques s’inquiètent de la dette."],"O":["Le contexte récent est celui de tensions et de conflits au Moyen-Orient. Ses partisans veulent éviter l’escalade ; ses critiques soulignent les engagements de sécurité de la France et de ses alliés.","L’accord UE-Mercosur a été conclu politiquement fin 2024, mais sa ratification suscite une forte opposition du monde agricole en France. Ses partisans parlent d’agriculture et d’environnement ; ses défenseurs mettent en avant les débouchés industriels.","L’OMC encadre le commerce mondial, et son organe d’appel est bloqué depuis 2019. Ses partisans veulent une réforme sociale et écologique ; ses critiques redoutent un affaiblissement des règles communes.","Au sommet de La Haye en 2025, les membres de l’OTAN se sont engagés à atteindre 5 % du PIB d’ici 2035, dont 3,5 % pour la défense au sens strict. Ses partisans invoquent le coût et la dépendance aux États-Unis ; ses critiques, les menaces sur l’Europe.","Le Groenland est un territoire danois associé à l’UE, sans en être membre. L’article 42.7 du traité prévoit une assistance mutuelle entre États membres. Ses partisans veulent clarifier la protection ; ses critiques y voient un engagement militaire élargi.","Des alliances comme l’AUKUS (États-Unis, Royaume-Uni, Australie) ont rebattu les cartes dans la région, et la France a perdu un contrat de sous-marins en 2021. Ses partisans défendent la non-alignement ; ses critiques, la présence française dans le Pacifique.","L’Union européenne prépare une constellation de satellites, IRIS², pour réduire sa dépendance. Ses partisans parlent de souveraineté ; ses critiques, du coût et des retards.","La France est l’un des principaux exportateurs d’armes dans le monde, selon l’institut Sipri. Ses partisans veulent un contrôle plus strict ; ses critiques soulignent les emplois et la base industrielle de défense.","La CPI a émis des mandats contre des dirigeants russes et israéliens. La France a évoqué des immunités possibles pour certains. Ses partisans défendent l’application du droit international ; ses critiques, les contraintes diplomatiques.","Un embargo sur les armes à destination d’Israël est demandé par certaines organisations ; d’autres États en ont adopté. Ses partisans invoquent le droit international ; ses critiques, la sécurité d’Israël et les relations diplomatiques.","L’OSCE, héritière de la conférence d’Helsinki de 1975, réunit 57 États. Ses partisans y voient un cadre de sécurité commun avec la Russie ; ses critiques doutent de son efficacité depuis l’invasion de l’Ukraine.","Des pays émergents, notamment les BRICS, discutent de moyens de paiement alternatifs au dollar. Ses partisans veulent rééquilibrer le système financier ; ses critiques soulignent la complexité d’une monnaie commune.","Le mécanisme européen d’ajustement carbone aux frontières taxe l’intensité carbone, pas la distance. Une taxe kilométrique poserait des questions de compatibilité avec le droit de l’OMC et le marché unique. Ses partisans parlent d’écologie ; ses critiques, de représailles.","Les décisions fiscales de l’Union exigent l’unanimité des 27, ce qui permet à un État de bloquer. Ses partisans veulent lutter contre l’évasion fiscale ; ses critiques défendent la souveraineté fiscale nationale.","La PAC est le plus gros poste du budget européen et verse surtout des aides à l’hectare. Ses partisans veulent soutenir les petites fermes et l’agroécologie ; ses critiques, préserver la compétitivité.","La Cour de justice de l’UE affirme la primauté du droit européen, tandis que le Conseil d’État et le Conseil constitutionnel placent la Constitution au sommet. Ses partisans veulent protéger les normes françaises ; ses critiques redoutent un conflit juridique avec l’Union.","Les aides d’État sont encadrées par l’article 107 du traité européen pour protéger la concurrence. Ses partisans veulent soutenir l’industrie et des services publics ; ses critiques défendent la concurrence.","L’article 88-5 de la Constitution prévoit un référendum pour l’adhésion d’un nouvel État, sauf majorité des trois cinquièmes du Parlement. Ses partisans veulent consulter le peuple ; ses critiques, éviter des blocages.","L’Union dispose depuis 2019 d’une réserve de moyens de lutte contre les incendies (rescEU). Ses partisans veulent une force permanente en Méditerranée ; ses critiques soulignent le coût et la coordination.","L’objectif de 0,7 % du revenu national brut date de 1970. La France reste nettement en dessous, et l’aide a baissé récemment. Ses partisans parlent de solidarité ; ses critiques, de contraintes budgétaires."]},"san":{"P":["Les pénuries de médicaments, notamment d’antibiotiques en 2022-2023, ont relancé le débat sur la dépendance aux fabricants étrangers. Ses partisans veulent une production publique pour garantir l’accès aux soins ; ses critiques mettent en avant le coût et le risque de doublonner l’industrie privée.","La T2A, introduite entre 2004 et 2008, paie les hôpitaux selon le nombre d’actes. Les financements ont déjà été partiellement modifiés avec des dotations. Ses partisans dénoncent une logique de rentabilité ; ses critiques redoutent une baisse de l’efficacité et des délais d’attente.","Plusieurs millions de Français n’ont pas de médecin traitant, et la liberté d’installation est un principe pour les médecins libéraux. Une proposition de régulation a été discutée au Parlement en 2025. Ses partisans veulent lutter contre les déserts médicaux ; ses critiques craignent de décourager les vocations.","L’usage reste interdit en France, avec une amende forfaitaire de 200 euros depuis 2020. Une expérimentation de cannabis médical a eu lieu de 2021 à 2024. Le Canada et l’Allemagne l’ont légalisé. Ses partisans veulent casser les trafics ; ses critiques redoutent des effets sur la santé et l’usage des jeunes.","L’Assurance maladie rembourse une partie des soins, le reste étant couvert par les mutuelles ou les assurances, auxquelles la grande majorité des Français adhère. Intégrer les complémentaires à la Sécurité sociale a déjà été proposé sous le nom de « grande Sécu ». Ses partisans parlent d’égalité d’accès ; ses critiques, du coût pour l’État.","Les maisons de retraite se répartissent entre secteur public, associatif et privé lucratif. Le scandale du groupe Orpea en 2022 a mis en lumière les failles du contrôle. Ses partisans veulent plus de places publiques ; ses critiques s’interrogent sur le financement et le recrutement."],"O":["Les punaises de lit ont fait l’objet d’une forte attention médiatique en 2023. Ses partisans veulent un plan national et des services publics locaux ; ses critiques estiment que les entreprises spécialisées et les propriétaires peuvent y répondre.","Les règles internationales (accord ADPIC) permettent déjà des licences obligatoires en cas d’urgence sanitaire. Pendant la pandémie, une levée temporaire des brevets sur les vaccins a été débattue à l’OMC. Ses partisans veulent un accès universel ; ses critiques redoutent un frein à l’innovation.","Le chlordécone, pesticide utilisé dans les bananeraies des Antilles jusqu’en 1993, a pollué durablement les sols. Une enquête pénale a abouti à un non-lieu en 2023. Ses partisans exigent une réparation complète ; ses critiques s’interrogent sur les modalités et le coût.","Les médecins du secteur 2 peuvent facturer au-delà des tarifs de la Sécurité sociale. Des députés ont proposé en 2025 de mieux les encadrer. Ses partisans parlent d’accès aux soins ; ses critiques redoutent un départ de médecins vers le secteur non conventionné.","La liberté de recourir à l’IVG a été inscrite dans la Constitution en 2024, et le délai a été porté à 14 semaines en 2022. Les médecins disposent d’une clause de conscience générale en plus d’une clause spécifique à l’IVG. Ses partisans veulent lever les obstacles ; ses critiques défendent la liberté de conscience.","Le Haut Conseil à l’égalité a publié en 2018 un rapport sur les violences obstétricales et gynécologiques. Ses partisans veulent une reconnaissance légale ; ses critiques s’interrogent sur la définition et sur le risque de judiciarisation des soins.","Certains traitements hormonaux de la ménopause sont déjà remboursés, d’autres non. Ses partisans parlent de santé des femmes ; ses critiques, de coût et de risques selon les profils.","Depuis 2024, les protections périodiques sont gratuites en pharmacie pour les personnes de moins de 26 ans et certaines bénéficiaires. Ses partisans veulent étendre à tous ; ses critiques soulignent le coût.","La loi de bioéthique de 2021 a ouvert la PMA aux couples de femmes et aux femmes seules. Les délais d’attente ];

  DATA[t.id].O.forEach(function (txt, k) { M.push({ id: M.length, no: NUM[M.length], theme: t.id, text: txt, phare: false, info: INFO[t.id].O[k] }); });

THEMES.forEach(function (t) {

function idsFor(mode) {
  var order = {};
  THEMES.forEach(function (t, k) { order[t.id] = k; });
  return M.filter(function (m) { return mode === "full" || m.phare; })
    .sort(function (a, b) { return (order[a.theme] - order[b.theme]) || (a.no - b.no) || (a.id - b.id); })
    .map(function (m) { return m.id; });
}
function rated(v) { return v !== undefined && v !== null && v !== 2; }
function score(ids, answers) {
  var s = 0, n = 0;
  ids.forEach(function (id) { var v = answers[id]; if (rated(v)) { s += SCALE[v].w; n++; } });
  return n ? { pct: Math.round(s / n), n: n } : { pct: null, n: 0 };
}
function agreeShare(ids, answers) {
  var a = 0, n = 0;
  ids.forEach(function (id) { var v = answers[id]; if (rated(v)) { n++; if (v >= 4) a++; } });
  return n ? { pct: Math.round(100 * a / n), n: n } : { pct: null, n: 0 };
}
function counts(ids, answers) {
  var c = [0, 0, 0, 0, 0, 0], skipped = 0;
  ids.forEach(function (id) { var v = answers[id]; if (v === undefined || v === null) skipped++; else c[v]++; });
  return { c: c, skipped: skipped };
}
function similarity(a, b) {
  var d = 0, n = 0;
  for (var id = 0; id < M.length; id++) {
    if (rated(a[id]) && rated(b[id])) { d += Math.abs(SCALE[a[id]].w - SCALE[b[id]].w); n++; }
  }
  return n ? { pct: Math.round(100 - d / n), n: n } : { pct: null, n: 0 };
}
function toB64(str) {
  var bytes = new TextEncoder().encode(str), bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function encodeCode(name, answers, comments) {
  var r = "", c = {};
  for (var id = 0; id < M.length; id++) {
    r += (answers[id] === undefined || answers[id] === null) ? "-" : String(answers[id]);
    if (comments[id]) c[id] = comments[id];
  }
  return "BM1." + toB64(JSON.stringify({ n: name, r: r, c: c }));
}
function decodeCode(code) {
  code = String(code || "").trim().replace(/\s+/g, "");
  if (code.indexOf("BM1.") !== 0) throw new Error("Ce code n’est pas reconnu. Il doit commencer par BM1.");
  var o;
  try { o = JSON.parse(fromB64(code.slice(4))); } catch (e) { throw new Error("Ce code est incomplet ou abîmé. Copie-le en entier."); }
  if (!o || typeof o.r !== "string" || !/^[0-5-]*$/.test(o.r) || o.r.length > 5000) throw new Error("Ce code est incomplet ou abîmé. Copie-le en entier.");
  var answers = {}, comments = {};
  for (var i = 0; i < o.r.length && i < M.length; i++) { if (o.r[i] !== "-") answers[i] = Number(o.r[i]); }
  if (o.c && typeof o.c === "object") {
    Object.keys(o.c).forEach(function (k) {
      var id = Number(k);
      if (id >= 0 && id < M.length && typeof o.c[k] === "string") comments[id] = o.c[k].slice(0, 500);
    });
  }
  return { name: (typeof o.n === "string" && o.n.trim() ? o.n.trim().slice(0, 40) : "Sans nom"), answers: answers, comments: comments };
}

var KEY = "boussole-mesures-v1";
var S = { theme: "auto", openInfo: false, name: "", mode: "short", view: "home", answers: {}, comments: {}, pos: { short: 0, full: 0 }, others: [], cmpWith: 0 };
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o && typeof o === "object") {
      S.name = typeof o.name === "string" ? o.name : "";
      S.theme = o.theme === "light" || o.theme === "dark" ? o.theme : "auto";
      S.openInfo = o.openInfo === true;
      S.mode = o.mode === "full" ? "full" : "short";
      S.answers = o.answers || {};
      S.comments = o.comments || {};
      S.pos = o.pos || S.pos;
      S.others = Array.isArray(o.others) ? o.others : [];
    }
  } catch (e) { /* stockage indisponible : l’outil marche sans mémoire */ }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ theme: S.theme, openInfo: S.openInfo, name: S.name, mode: S.mode, answers: S.answers, comments: S.comments, pos: S.pos, others: S.others }));
  } catch (e) { /* ignoré */ }
}

var THEME_LABEL = { auto: "Thème : auto", light: "Thème : clair", dark: "Thème : sombre" };
function applyTheme() {
  var r = document.documentElement;
  if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
  document.querySelectorAll("[data-act=theme]").forEach(function (b) { b.textContent = THEME_LABEL[S.theme]; });

// Sépare le contexte, l’avis des partisans et celui des critiques
function splitInfo(s) {
  var pf = s.match(/^(.*?)\s*Pour ses partisans, (.*?)\s*;\s*pour ses critiques, (.*)$/);
  if (pf) return { ctx: pf[1].trim(), pro: "Pour ses partisans, " + pf[2].replace(/[.\s]+$/, "") + ".", con: "Pour ses critiques, " + pf[3] };
  var k = s.search(/Ses partisans /);
  if (k < 0) {
    var kc = s.search(/Ses (?:critiques|défenseurs|opposants|détracteurs) /);
    if (kc < 0) return null;
    return { ctx: s.slice(0, kc).trim(), pro: "", con: s.slice(kc) };
  }
  var rest = s.slice(k), mm = rest.match(/^(.*?)\s*[;,]\s*(ses (?:critiques|défenseurs|opposants|détracteurs)\b.*)$/);
  if (!mm) return null;
  var pro = mm[1].replace(/[.\s]+$/, "") + ".", con = mm[2];
  // forme elliptique : « ses critiques, d’un … » → on rétablit le verbe
  var el = con.match(/^(ses (?:critiques|défenseurs|opposants|détracteurs)), (.*)$/);
  if (el) {
    var vb = pro.match(/^Ses partisans (parlent|y voient)\b/), obj = el[2];
    con = el[1] + " " + (vb ? vb[1] : /^(?:d’|de |du |des |d')/.test(obj) ? "parlent" : "mettent en avant") + " " + obj;
  }
  con = con.charAt(0).toUpperCase() + con.slice(1);
  return { ctx: s.slice(0, k).trim(), pro: pro, con: con };
}
function infoHtml(s) {
  var p = splitInfo(s);
  if (!p) return "<p>" + esc(s) + "</p>";
  return (p.ctx ? "<p>" + esc(p.ctx) + "</p>" : "") +
    '<table class="pc"><thead><tr><th scope="col">Partisans de la mesure</th><th scope="col">Critiques de la mesure</th></tr></thead><tbody><tr>' +
    '<td data-label="Partisans de la mesure">' + (p.pro ? esc(p.pro) : "Aucun argument de ce côté n’est résumé ici.") + '</td><td data-label="Critiques de la mesure">' + esc(p.con) + "</td></tr></tbody></table>";
}
