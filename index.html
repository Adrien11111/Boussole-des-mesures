ques dans les services publics","Les espaces France Services, créés en 2020, offrent un accueil de proximité. Ses partisans veulent des guichets avec du personnel ; ses critiques évoquent le coût."],["Développer des services publics itinérants pour desservir les communes les plus isolées","Des bus France Services existent déjà. Ses partisans veulent les multiplier ; ses critiques évoquent le coût et la fréquence."],["Renforcer les dotations de l’État aux collectivités en tenant compte de leurs inégalités","La péréquation vise à corriger les écarts de richesse entre collectivités. Ses partisans veulent l’accroître ; ses critiques évoquent le coût."],["Instaurer un moratoire sur la fermeture des écoles, maternités, bureaux de poste et gares","Les fermetures de services publics nourrissent le sentiment d’abandon dans les territoires. Ses partisans veulent un gel ; ses critiques évoquent les contraintes de gestion et de sécurité."],["Garantir une présence postale et des services bancaires accessibles dans toutes les collectivités","La Poste a une mission légale d’aménagement du territoire, avec des points de contact dans la plupart des communes. Ses partisans veulent la renforcer ; ses critiques évoquent le coût."],["Engager un plan pluriannuel pour les services publics outre-mer, fondé sur les propositions des mouvements sociaux locaux","La loi de 2017 sur l’égalité réelle outre-mer a fixé des objectifs de rattrapage. Ses partisans veulent un plan co-construit ; ses critiques évoquent le coût."],["Mettre en œuvre un plan de réparation pour la Kanaky-Nouvelle-Calédonie","Les tensions en Nouvelle-Calédonie ont causé des violences en 2024 et un lourd bilan économique. Ses partisans veulent un plan de réparation ; ses critiques évoquent le coût."],["Instaurer 50 % de recrutements locaux dans tous les corps de la fonction publique","Les emplois publics outre-mer sont souvent pourvus par des agents de l’Hexagone. Ses partisans veulent favoriser les locaux ; ses critiques redoutent une rupture d’égalité d’accès."],["Aligner les prestations sociales et le droit du travail de Mayotte sur ceux de l’Hexagone","Mayotte est un département depuis 2011, avec des minima sociaux inférieurs. Ses partisans veulent une égalité des droits ; ses critiques évoquent le coût."],["Indemniser les victimes des essais nucléaires et reconnaître leurs dommages environnementaux, notamment en Polynésie","La France a mené des essais nucléaires en Algérie et en Polynésie entre 1960 et 1996. La loi Morin de 2010 a créé un dispositif d’indemnisation, jugé restrictif. Ses partisans veulent l’élargir ; ses critiques évoquent le coût."],["Inscrire dans la Constitution que l’eau est un commun et garantir le droit à l’eau salubre","Le droit à l’eau est reconnu dans la loi depuis 2006. Ses partisans veulent un rang constitutionnel ; ses critiques estiment le cadre légal suffisant."],["Porter la dépense publique culturelle à 1 % du PIB chaque année","La dépense publique culturelle représente aujourd’hui environ 1 % du PIB selon les estimations. Ses partisans veulent atteindre cet objectif ; ses critiques évoquent le coût."],["Adopter une loi contre les monopoles privés dans la création et la diffusion artistiques","Plusieurs groupes dominent la musique, le spectacle vivant ou le livre. Ses partisans veulent un cadre anti-concentration ; ses critiques défendent l’économie de marché."],["Relancer les grands travaux culturels pour corriger les inégalités territoriales d’équipements","Les grands équipements culturels sont concentrés dans quelques métropoles. Ses partisans veulent rééquilibrer ; ses critiques évoquent le coût de fonctionnement."],["Garantir des financements pérennes aux structures et associations culturelles","Les subventions aux associations culturelles ont été réduites dans plusieurs collectivités. Ses partisans veulent des financements stables ; ses critiques évoquent le budget."],["Étendre la gratuité aux musées et bibliothèques et encadrer les tarifs abusifs des lieux privés","Les musées nationaux sont gratuits pour les moins de 26 ans résidents de l’Union européenne. Ses partisans veulent une gratuité plus large ; ses critiques évoquent le financement des institutions."],["Faire de l’audiovisuel public le premier financeur du cinéma et créer une médiathèque en ligne gratuite","Canal+ et France Télévisions investissent dans le cinéma français. Ses partisans veulent confier le rôle principal au service public ; ses critiques évoquent le coût."],["Lancer un plan pour la diversité et l’indépendance de l’édition, et renforcer le CNL","Le Centre national du livre soutient l’édition et les librairies. Ses partisans veulent plus de moyens ; ses critiques notent la concentration du secteur."],["Créer un centre national du jeu vidéo et renforcer la formation publique dans ce domaine","Le jeu vidéo est un secteur dynamique en France, soutenu par un crédit d’impôt. Ses partisans veulent un centre dédié ; ses critiques évoquent le coût."],["Garantir aux joueurs la propriété et l’accès durable aux jeux achetés, physiques comme numériques","Une campagne européenne a réclamé que les éditeurs ne rendent pas injouables les jeux achetés. Ses partisans veulent un droit à la conservation ; ses critiques évoquent la contrainte pour les éditeurs."],["Supprimer les avantages fiscaux du mécénat culturel et limiter l’emprise des grandes fortunes sur la culture","La loi de 2003 permet de déduire 60 % des dons aux œuvres et organismes d’intérêt général. Ses partisans veulent supprimer cet avantage ; ses critiques soulignent son rôle dans le financement de la culture."],["Lutter contre les discriminations et les violences dans les arts et la culture","Le mouvement #MeToo a révélé des violences dans le cinéma et le spectacle. Ses partisans veulent des mesures de prévention ; ses critiques demandent de respecter la présomption d’innocence."],["Instituer un « domaine public commun » financé par une redevance sur l’usage commercial des œuvres tombées dans le domaine public","Les œuvres du domaine public sont libres d’usage. Ses partisans veulent un financement de la création ; ses critiques redoutent une atteinte au libre accès."],["Mettre en place de véritables droits sociaux pour les artistes-auteurs","Les artistes-auteurs ont une protection sociale souvent plus faible que les salariés. Ses partisans veulent un statut plus protecteur ; ses critiques évoquent le coût."],["Encadrer les IA génératives culturelles et instaurer une rémunération équitable des créateurs","Le règlement européen sur l’IA impose des obligations de transparence sur les données d’entraînement. Ses partisans veulent une rémunération des créateurs ; ses critiques redoutent un frein à l’innovation."],["Favoriser la gratuité des activités sportives, en priorité pour les plus pauvres","Le Pass’Sport donne une aide aux jeunes de familles modestes. Ses partisans veulent une gratuité plus large ; ses critiques évoquent le coût."],["Renforcer le financement du sport amateur par une taxe sur les retransmissions et une taxe sur les transferts","Une taxe de 5 % sur les droits de retransmission sportive existe depuis 2000. Ses partisans veulent l’élargir ; ses critiques redoutent un effet sur les clubs professionnels."],["Interdire toute multipropriété dans le sport professionnel","Plusieurs fonds possèdent plusieurs clubs de football en Europe. Ses partisans dénoncent un risque de conflit d’intérêts ; ses critiques évoquent la liberté d’investissement."],["Démocratiser la gestion des fédérations sportives et valoriser le bénévolat","Une loi de 2022 a cherché à démocratiser les fédérations. Ses partisans veulent aller plus loin ; ses critiques évoquent l’autonomie du mouvement sportif."],["Développer le sport féminin et instaurer la parité dans la retransmission des grands événements","La loi de 2022 a imposé de retransmettre des compétitions féminines. Ses partisans veulent la parité ; ses critiques évoquent l’audience."],["Renforcer l’accessibilité des équipements sportifs pour les personnes handicapées","De nombreux équipements restent difficiles d’accès. Ses partisans veulent un plan de mise aux normes ; ses critiques évoquent le coût."],["Renforcer les conseillers techniques et sportifs sur l’ensemble du territoire","Les conseillers techniques sportifs encadrent les fédérations et ont vu leur statut évoluer. Ses partisans veulent plus de postes ; ses critiques évoquent le budget."],["Lancer un plan d’urgence pour construire et rénover les équipements sportifs de proximité","Un plan de 5 000 équipements de proximité a été annoncé en 2022. Ses partisans veulent un effort plus soutenu ; ses critiques évoquent le coût."],["Mettre fin à la criminalisation des supporters et aux expérimentations sécuritaires comme la reconnaissance faciale","Les interdictions de stade et la surveillance des supporters font l’objet de critiques. Ses partisans veulent un cadre moins répressif ; ses critiques évoquent la sécurité."],["Réguler les paris sportifs en interdisant leur publicité","L’Autorité nationale des jeux encadre les paris en ligne et la publicité. Ses partisans parlent de santé publique ; ses critiques évoquent le marché légal face aux sites illégaux."],["Organiser un plan de formation et de sensibilisation contre les violences sexistes, racistes et LGBTIphobes dans le sport, et refuser les tests de féminité","World Athletics a instauré en 2025 un test génétique de féminité pour certaines compétitions. Ses partisans le jugent discriminatoire ; ses défenseurs invoquent l’équité sportive."],["Renforcer le CNES pour qu’il redevienne le maître d’œuvre de la politique spatiale française","Le CNES est l’agence spatiale française, qui pilote ses programmes avec l’Agence spatiale européenne. Ses partisans veulent un rôle accru ; ses critiques évoquent la coopération européenne."],["Maintenir un accès libre aux données météorologiques et d’observation de la Terre fournies par les services européens","Le programme Copernicus fournit gratuitement de nombreuses données. Ses partisans veulent garantir cet accès ; ses critiques évoquent le financement."],["Renforcer le Centre spatial guyanais pour en faire un avant-poste souverain","Le Centre spatial guyanais de Kourou accueille les lancements d’Ariane et de Vega. Ses partisans veulent en faire un pôle autonome ; ses critiques évoquent le coût."],["Garantir un droit d’accès minimal et gratuit à Internet","Le haut débit fait partie du service universel des communications électroniques. Ses partisans veulent un accès gratuit de base ; ses critiques évoquent le financement."],["Achever le déploiement de la fibre sur l’ensemble du territoire","Le plan France Très Haut Débit vise la fibre pour tous les foyers d’ici 2025-2026, avec des zones rurales encore en retard. Ses partisans veulent finir le chantier ; ses critiques évoquent le coût."],["Publier systématiquement en données ouvertes les informations détenues par les collectivités","La loi pour une République numérique de 2016 impose l’ouverture de nombreuses données publiques. Ses partisans veulent l’étendre ; ses critiques évoquent la charge pour les petites communes."],["Préserver les guichets physiques et les formulaires papier malgré la dématérialisation","La dématérialisation des démarches laisse en difficulté une partie des usagers, selon le Défenseur des droits. Ses partisans veulent garantir une alternative ; ses critiques évoquent le coût."],["Garantir à chacun la possibilité de parler à un interlocuteur humain, dans le public comme dans le privé","Les services client automatisés se généralisent. Ses partisans veulent un droit à un contact humain ; ses critiques évoquent le coût pour les entreprises."],["Créer une autorité dédiée à l’accessibilité numérique, dotée de pouvoirs de sanction","Les sites publics doivent être accessibles aux personnes handicapées depuis 2005, avec peu de contrôle. Ses partisans veulent des sanctions ; ses critiques évoquent la charge pour les structures."],["Faire de la lutte contre les fuites de données une priorité, avec formation et encadrement des transferts","Les fuites de données se multiplient, y compris dans des organismes publics. Ses partisans veulent renforcer la prévention ; ses critiques évoquent le coût."],["Refuser que le seul consentement justifie la collecte massive de données personnelles","Le RGPD repose en grande partie sur le consentement, souvent donné sans lecture. Ses partisans veulent des limites plus strictes ; ses critiques redoutent un frein à l’innovation."],["Donner à la CNIL les moyens de faire appliquer les exigences de sécurité du RGPD","La CNIL contrôle l’application du RGPD avec un budget limité. Ses partisans veulent plus de moyens ; ses critiques évoquent le coût."],["Protéger la neutralité du net","La neutralité du net interdit de favoriser certains contenus et est protégée par un règlement européen de 2015. Ses partisans veulent la garantir ; ses critiques évoquent la gestion des réseaux."],["Bâtir un cloud public formé de centres de données publics interconnectés","L’État utilise en partie des services cloud privés, souvent américains. Ses partisans veulent un cloud souverain ; ses critiques évoquent le coût et la compétence technique."],["Fonder une agence publique pour piloter le développement stratégique des logiciels libres","L’État soutient déjà des logiciels libres via des services interministériels. Ses partisans veulent une agence dédiée ; ses critiques évoquent le coût."],["Généraliser les logiciels libres dans les administrations et l’Éducation nationale, avec interopérabilité","Certaines administrations utilisent déjà des logiciels libres, comme la gendarmerie. Ses partisans y voient une souveraineté ; ses critiques redoutent la migration."],["Offrir aux citoyens et aux entreprises des services en ligne hébergés en France selon le droit français","Beaucoup de services numériques sont hébergés hors de l’Union européenne. Ses partisans veulent protéger les données ; ses critiques évoquent la compétitivité."],["Développer progressivement une offre publique de services numériques essentiels, comme un moteur de recherche","Un moteur de recherche européen a été évoqué sans succès, comme le projet Qwant. Ses partisans veulent une alternative publique ; ses critiques évoquent la difficulté technique."],["Rejeter le contrôle privé et discrétionnaire des contenus exercé par les grandes plateformes","La modération sur les grandes plateformes dépend de leurs règles internes. Ses partisans veulent un cadre démocratique ; ses critiques craignent des atteintes à la liberté d’expression."],["Héberger les données des services publics et des entreprises essentielles sur des serveurs publics en France","La doctrine « cloud au centre » de l’État impose des conditions de sécurité. Ses partisans veulent un hébergement public ; ses critiques évoquent les capacités."],["Créer une mission nationale sur l’IA orientée vers les besoins sociaux et écologiques","Une commission de l’IA a été installée en 2023 pour conseiller le gouvernement. Ses partisans veulent une orientation publique ; ses critiques évoquent l’efficacité."],["Développer de petits modèles d’IA spécialisés et sobres pour la planification écologique, la santé, le droit ou la culture","Les grands modèles consomment beaucoup d’énergie. Ses partisans veulent des IA frugales ; ses critiques redoutent un retard face aux géants."],["Ouvrir des concertations pour concevoir des IA qui assistent les travailleurs plutôt que de les surveiller ou de les remplacer","L’IA pose des questions sur le travail et la surveillance. Ses partisans veulent une co-construction avec les salariés ; ses critiques évoquent la lenteur."],["Faire relever par défaut les données publiques numériques d’un domaine public, stockées sur des solutions 100 % publiques","Les données publiques sont souvent hébergées chez des prestataires privés. Ses partisans veulent un contrôle public ; ses critiques évoquent le coût."],["Créer une autorité nationale de l’IA délivrant une autorisation de mise sur le marché aux systèmes à haut risque","Le règlement européen sur l’IA classe les systèmes à risque et impose des obligations. Ses partisans veulent une autorisation préalable ; ses critiques redoutent un frein."],["Interdire les systèmes d’IA conçus pour simuler une relation affective avec l’utilisateur","Des applications de compagnon virtuel se développent. Ses partisans évoquent la dépendance ; ses critiques défendent la liberté des utilisateurs."],["Obliger les fournisseurs d’IA à détecter et corriger leurs biais discriminatoires","Des systèmes d’IA ont reproduit des biais de genre ou d’origine. Ses partisans veulent une obligation de résultat ; ses critiques évoquent la difficulté technique."],["Imposer de signaler toute intervention d’une IA sur des textes ou des images","Le règlement européen sur l’IA impose d’étiqueter certains contenus générés. Ses partisans veulent un étiquetage généralisé ; ses critiques évoquent la difficulté de contrôle."],["Interdire certains usages de l’IA et du big data, comme l’identification biométrique ou la police prédictive","Le règlement européen interdit certains usages, avec des exceptions sécuritaires. Ses partisans veulent une interdiction plus large ; ses critiques évoquent la sécurité."],["Garantir l’individualisation des droits et automatiser le versement des prestations sociales","Le non-recours concerne une part importante des aides. Ses partisans veulent un versement automatique ; ses critiques évoquent la fiabilité des données."],["Combattre le non-recours aux droits par la simplification des démarches et la réouverture des accueils physiques","Selon plusieurs études, un tiers environ des personnes éligibles ne demandent pas le RSA. Ses partisans veulent simplifier ; ses critiques évoquent le coût."],["Interdire la notation des allocataires de prestations sociales","La CAF utilise un score de risque pour cibler ses contrôles, critiqué par des associations. Ses partisans dénoncent une discrimination ; ses défenseurs évoquent la lutte contre la fraude."],["Faire élire les administrateurs de la Sécurité sociale par les assurés, avec pouvoir de lever les cotisations","Les élections à la Sécurité sociale ont été supprimées en 1983. Ses partisans veulent une gestion démocratique ; ses critiques défendent la gestion paritaire."],["Instaurer une Sécurité sociale funéraire, avec versement automatisé du capital-décès et salles municipales gratuites","Un capital-décès existe déjà mais les obsèques coûtent en moyenne plus de 4 000 euros. Ses partisans veulent une prise en charge ; ses critiques évoquent le coût."],["Créer dans chaque entreprise une commission de contrôle salariée sur l’égalité femmes-hommes","L’index d’égalité professionnelle existe depuis 2019. Ses partisans veulent un contrôle par les salariés ; ses critiques évoquent la charge administrative."],["Imposer la parité femmes-hommes dans les institutions politiques, économiques, administrations, syndicats et associations","La parité s’impose déjà dans certains conseils d’administration et listes électorales. Ses partisans veulent l’étendre ; ses critiques défendent le mérite et la liberté d’organisation."],["Adopter une loi intégrale contre les violences sexistes et sexuelles et allouer 3 milliards d’euros aux associations","Des associations demandent une loi-cadre inspirée du modèle espagnol et un budget de 2,6 à 3 milliards d’euros. Ses partisans veulent s’y engager ; ses critiques évoquent le coût."],["Garantir une budgétisation transparente qui prend en compte le genre","Un « jaune budgétaire » sur l’égalité est publié chaque année. Ses partisans veulent une analyse plus poussée ; ses critiques évoquent la complexité."],["Mettre fin au harcèlement sexiste dans l’espace public par la prévention et un urbanisme féministe","Le harcèlement de rue est sanctionné depuis 2018. Ses partisans veulent agir aussi sur l’aménagement ; ses critiques évoquent le coût."],["Adapter le monde du travail aux violences conjugales et renforcer les obligations des employeurs","Des congés pour violences conjugales existent dans certains pays et entreprises. Ses partisans veulent une obligation générale ; ses critiques évoquent la charge pour les employeurs."],["Intégrer la lutte contre les discours masculinistes aux politiques numériques et à l’éducation à l’école","Des influenceurs masculinistes touchent des adolescents en ligne. Ses partisans veulent agir dès l’école ; ses critiques redoutent un excès de contrôle."],["Créer un fonds dédié au dédommagement des enfants de victimes de féminicides","Les orphelins de féminicides sont soutenus par des aides sociales et un statut de pupille de la Nation. Ses partisans veulent un fonds dédié ; ses critiques évoquent le coût."],["Soutenir les permanences et dispositifs itinérants d’aide aux femmes victimes de violences, notamment en zones rurales","Les zones rurales manquent souvent d’associations d’aide. Ses partisans veulent des dispositifs mobiles ; ses critiques évoquent le coût."],["Lutter contre les mouvements anti-choix qui entravent la santé sexuelle et reproductive et l’avortement","Le délit d’entrave à l’IVG existe depuis 1993. Ses partisans veulent des moyens accrus ; ses critiques défendent la liberté d’expression."],["Abolir la prostitution et renforcer l’accompagnement social, sanitaire, juridique et professionnel des personnes concernées","La loi de 2016 pénalise l’achat d’actes sexuels. Ses partisans veulent l’appliquer pleinement ; ses critiques défendent la réglementation du métier."],["Renforcer le planning familial et pérenniser les financements des associations féministes et LGBTI","Les associations dépendent de subventions annuelles. Ses partisans veulent des financements stables ; ses critiques évoquent le budget."],["Créer un véritable service public de la petite enfance","La loi de 2023 a fait des communes les autorités organisatrices de l’accueil du jeune enfant. Ses partisans veulent un service public complet ; ses critiques évoquent le coût."],["Planifier l’ouverture progressive de 500 000 places d’accueil pour les jeunes enfants","La France manque de plusieurs centaines de milliers de places d’accueil selon la Cour des comptes. Ses partisans veulent un plan chiffré ; ses critiques évoquent le coût."],["Rendre gratuites les crèches publiques","Les crèches publiques appliquent un barème selon les revenus. Ses partisans veulent la gratuité ; ses critiques évoquent le coût pour les collectivités."],["Implanter des centres de PMI et des lieux ressources pour les parents, dotés de moyens accrus","Les centres de PMI ont fermé dans de nombreux départements. Ses partisans veulent les relancer ; ses critiques évoquent le coût."],["Geler les ouvertures de places dans les crèches privées lucratives et interdire leurs aides publiques","Des crèches privées lucratives ont été mises en cause dans le livre Les Ogres de 2024. Ses partisans veulent un secteur non lucratif ; ses critiques défendent la diversité de l’offre."],["Garantir à chaque jeune enfant une place adaptée, avec effectifs réduits et espace extérieur végétalisé","Les taux d’encadrement en crèche sont réglementés. Ses partisans veulent des normes plus ambitieuses ; ses critiques évoquent le coût."],["Répondre à la pénurie de professionnelles par des hausses de salaires, des moyens accrus et des carrières valorisées","Le secteur de la petite enfance manque de personnel. Ses partisans veulent des salaires plus élevés ; ses critiques évoquent le coût."],["Renforcer la formation initiale et continue des professionnelles de la petite enfance","Les qualifications varient selon les métiers de la petite enfance. Ses partisans veulent plus de formation ; ses critiques évoquent le coût."],["Inscrire dans la Constitution la non-marchandisation du corps humain et le droit de disposer de soi","Le Code civil interdit déjà de faire du corps humain un objet de commerce. Ses partisans veulent un rang constitutionnel ; ses critiques redoutent des effets juridiques imprévus."],["Soutenir l’inscription de l’IVG et de la contraception dans la Charte européenne, avec un accès gratuit","La France a inscrit la liberté de recourir à l’IVG dans sa Constitution en 2024. Ses partisans veulent l’étendre à l’Europe ; ses critiques défendent la compétence nationale."],["Rendre libre et gratuite la modification de l’état civil pour changer de sexe, et tendre vers la fin de la mention du sexe","Depuis 2016, le changement de sexe à l’état civil se fait devant le tribunal sans condition médicale. Ses partisans veulent une procédure simplifiée ; ses critiques défendent la stabilité de l’état civil."],["Faire de la reconnaissance le principe par défaut de la filiation, refuser la GPA et placer l’intérêt de l’enfant en premier","La gestation pour autrui est interdite en France. Ses partisans veulent consolider ce principe tout en reconnaissant les liens de filiation ; ses critiques réclament son encadrement."],["Donner davantage de moyens au Défenseur des droits","Le Défenseur des droits traite des dizaines de milliers de réclamations par an. Ses partisans veulent plus de moyens ; ses critiques évoquent le budget."],["Lancer un plan contre les violences sexuelles faites aux enfants, fondé sur les préconisations de la Ciivise","La commission Ciivise a rendu en 2023 un rapport avec 82 préconisations. Ses partisans veulent les appliquer ; ses critiques évoquent le coût."],["Inscrire la Convention internationale des droits de l’enfant dans la Constitution et créer un Code de l’enfance","La Convention de 1989 a été ratifiée par la France en 1990. Ses partisans veulent un rang constitutionnel ; ses critiques estiment le cadre actuel suffisant."],["Faire pratiquer la démocratie aux enfants dans leurs établissements et prendre en compte leur parole","Les conseils de vie collégienne et lycéenne existent déjà. Ses partisans veulent les renforcer ; ses critiques évoquent l’autorité des adultes."],["Lutter contre les logiques « no kids » qui excluent les enfants de l’espace public, des transports et des lieux de vacances","Certains établissements refusent les enfants. Ses partisans y voient une discrimination ; ses critiques défendent la liberté des commerces."],["Recentraliser la protection de l’enfance et augmenter significativement ses moyens","La protection de l’enfance est gérée par les départements depuis 1983. Ses partisans veulent un pilotage national ; ses critiques défendent la proximité."],["Mettre fin aux lieux de placement indignes (hôtels, campings, Airbnb) par un plan pluriannuel de recrutement et d’ouvertures de places","Des enfants placés sont hébergés à l’hôtel, une pratique interdite par la loi de 2022 sauf exceptions. Ses partisans veulent y mettre fin ; ses critiques évoquent le coût."],["Créer un contrôleur général indépendant des lieux de placement","Un contrôleur existe pour les lieux de privation de liberté. Ses partisans veulent le même pour la protection de l’enfance ; ses critiques évoquent le coût."],["Engager un plan de rattrapage pour la protection des droits fondamentaux des enfants d’Outre-mer","Les enfants d’Outre-mer sont plus exposés à la pauvreté. Ses partisans veulent un plan ciblé ; ses critiques évoquent le coût."],["Mener des campagnes massives de prévention des violences et négligences faites aux enfants, et renforcer les dispositifs d’alerte","Le numéro 119 permet de signaler des enfants en danger. Ses partisans veulent plus de prévention ; ses critiques évoquent l’efficacité."],["Créer un office pour l’autonomie des jeunes afin d’unifier des politiques jeunesse éparpillées entre 28 administrations","Les politiques de jeunesse sont dispersées entre de nombreux acteurs. Ses partisans veulent un pilotage unique ; ses critiques redoutent une nouvelle structure."],["Revenir sur la loi ELAN pour imposer 100 % de logements accessibles dans le neuf et financer l’adaptation de l’ancien","La loi ELAN de 2018 a limité l’exigence à 20 % de logements accessibles dans le neuf. Ses partisans veulent un retour à la règle de 100 % ; ses critiques évoquent le coût."],["Sensibiliser aux discriminations dans l’Éducation nationale, de la maternelle au lycée, ainsi que dans le supérieur et la formation professionnelle","Des actions contre les discriminations existent déjà en milieu scolaire. Ses partisans veulent les généraliser ; ses critiques évoquent la neutralité."],["Décloisonner l’Éducation nationale et le secteur médico-social","L’école inclusive repose sur des accompagnants et des établissements spécialisés. Ses partisans veulent une meilleure coordination ; ses critiques évoquent la complexité."],["Rendre accessibles aux élèves en situation de handicap les locaux et les transports scolaires et périscolaires","De nombreux établissements restent partiellement inaccessibles. Ses partisans veulent un plan de mise aux normes ; ses critiques évoquent le coût."],["Adapter services publics, procédures et documents administratifs aux handicaps, et généraliser ces dispositions au privé","Le format facile à lire et à comprendre est encore peu répandu. Ses partisans veulent l’étendre ; ses critiques évoquent la charge pour les entreprises."],["Viser le « zéro obstacle », permettre aux préfets de se substituer aux maires et imposer un plan d’accessibilité des transports","La loi de 2005 prévoyait l’accessibilité en 2015, reportée par des agendas. Ses partisans veulent un respect strict ; ses critiques évoquent le coût local."],["Lancer un plan pour éradiquer les violences à l’encontre des personnes LGBTI","Les actes anti-LGBT recensés par SOS Homophobie ont augmenté ces dernières années. Ses partisans veulent un plan national ; ses critiques évoquent l’efficacité."],["Faire appliquer l’interdiction des thérapies de conversion en ciblant ceux qui en font la promotion","Une loi de 2022 interdit les thérapies de conversion. Ses partisans veulent mieux la faire appliquer ; ses critiques évoquent les difficultés de preuve."],["Former le personnel médical à l’accueil des personnes trans et intersexes","Certaines personnes trans rapportent des refus de soins. Ses partisans veulent une formation ; ses critiques évoquent le coût."],["Interdire et sanctionner les interventions médicales non consenties sur les enfants intersexes, avec enquêtes indépendantes","La loi de bioéthique de 2021 a encadré ces interventions sans les interdire. Ses partisans veulent une interdiction ; ses critiques défendent l’avis médical."],["Créer un statut « famille monoparentale » ouvrant des réductions tarifaires, sur le modèle de la famille nombreuse","Les familles monoparentales sont plus exposées à la pauvreté. Ses partisans veulent un statut dédié ; ses critiques évoquent le coût."],["Créer une nouvelle forme d’adoption sociale ouvrant à un partenariat social","L’adoption simple et le mandat d’éducation quotidienne existent déjà. Ses partisans veulent reconnaître d’autres liens ; ses critiques évoquent la complexité."],["Accorder aux salariés un congé de proche aidant et un congé parentalité pour soutenir un ami","Le congé de proche aidant existe, limité à la famille. Ses partisans veulent l’étendre à l’entourage ; ses critiques évoquent la charge pour les employeurs."],["Donner un statut légal au baptême civil","Le baptême civil, ou républicain, n’a pas de valeur juridique. Ses partisans veulent le reconnaître ; ses critiques évoquent la neutralité de l’État."],["Reconnaître un statut de beau-parent, sous conditions d’intérêt supérieur de l’enfant et de participation éducative","Un projet de loi de 2014 sur le statut du beau-parent n’a pas abouti. Ses partisans veulent encadrer ces situations ; ses critiques évoquent le risque pour les parents."],["Mettre fin à la privatisation des espaces communs et redéployer des espaces de gratuité dans les communes","Les places publiques sont de plus en plus occupées par des terrasses et des commerces. Ses partisans veulent des espaces gratuits ; ses critiques défendent l’activité commerciale."],["Créer des formations agréées par l’État contre l’isolement social","L’isolement concerne une part importante des Français selon la Fondation de France. Ses partisans veulent des formations dédiées ; ses critiques évoquent le coût."],["Lancer un plan de lutte contre l’islamophobie, l’antisémitisme et le racisme, doté d’un milliard d’euros","Plusieurs plans nationaux de lutte contre le racisme se sont succédé depuis les années 2000. Ses partisans veulent un budget bien plus important ; ses critiques évoquent le coût."],["Créer un commissariat à l’égalité doté d’un observatoire des discriminations","Le Défenseur des droits est l’autorité de référence sur les discriminations. Ses partisans veulent un commissariat dédié ; ses critiques redoutent un doublon."],["Généraliser les campagnes de testing, avec sanctions en cas de pratiques discriminatoires avérées","Le testing est reconnu comme preuve en droit pénal depuis 2006. Ses partisans veulent l’étendre ; ses critiques évoquent le risque de provocation."],["Expérimenter les dossiers anonymes pour l’accès à l’emploi, au logement et aux études supérieures","Le CV anonyme est prévu par la loi de 2006 mais rarement appliqué. Ses partisans veulent l’expérimenter ; ses critiques évoquent son efficacité."],["Créer un organisme indépendant contre le complotisme et les haines en ligne, placé sous l’égide de l’Arcom","L’Arcom régule déjà les plateformes en ligne. Ses partisans veulent un organisme spécialisé ; ses critiques redoutent une atteinte à la liberté d’expression."],["Établir des règles contre les biais discriminatoires des IA et des technologies médicales, sur les données d’entraînement et les tests","Des dispositifs comme l’oxymètre de pouls ont montré des biais selon la couleur de peau. Ses partisans veulent des règles strictes ; ses critiques évoquent la complexité."],["Reconnaître officiellement le traumatisme psychique lié au vécu raciste, avec prise en charge et réparation intégrale","Le traumatisme lié au racisme est étudié en recherche mais n’a pas de statut juridique. Ses partisans veulent une reconnaissance ; ses critiques évoquent la difficulté de définition."],["Abroger les mesures de la loi « contre le séparatisme » et le contrat d’engagement républicain","La loi de 2021 confortant le respect des principes de la République impose un contrat aux associations subventionnées. Ses partisans dénoncent une restriction des libertés ; ses défenseurs invoquent la lutte contre l’islamisme."],["Instaurer le 4 février comme jour férié national en mémoire des victimes de l’esclavage","La France commémore l’abolition de l’esclavage le 10 mai. Le 4 février 1794 correspond à la première abolition. Ses partisans veulent un jour férié ; ses critiques évoquent le coût."],["Développer la recherche et les programmes scolaires sur l’histoire de l’esclavage, de la colonisation et de l’immigration","Ces sujets figurent déjà dans les programmes d’histoire. Ses partisans veulent une place plus grande ; ses critiques évoquent la charge des programmes."],["Ouvrir les archives sur les guerres de décolonisation et examiner les demandes de restitution de biens culturels","Une loi de 2023 encadre la restitution de biens culturels issus de spoliations. Ses partisans veulent l’élargir ; ses critiques évoquent la conservation des collections."],["Reconnaître le massacre du 17 octobre 1961 comme crime d’État, lors d’une journée nationale de commémoration","Le président Macron a reconnu en 2021 des crimes commis cette nuit-là. Ses partisans veulent la qualification de crime d’État ; ses critiques défendent une approche historienne."],["Instaurer le 2 août comme journée de commémoration du génocide des Roms, Manouches, Sinti, Gitans, Yéniches et Voyageurs","Le 2 août 1944 vit la liquidation du camp des Tsiganes à Auschwitz-Birkenau. Ses partisans veulent une journée nationale ; ses critiques évoquent le calendrier mémoriel."],["Créer une commission d’enquête sur le massacre de tirailleurs à Thiaroye le 1er décembre 1944","Des tirailleurs sénégalais ont été tués à Thiaroye en 1944. La France a reconnu un massacre en 2024. Ses partisans veulent une enquête ; ses critiques évoquent les archives déjà ouvertes."],["Former massivement les fonctionnaires au contact du public à reconnaître et combattre toutes les formes de racisme","Des formations à la lutte contre les discriminations existent pour certains agents. Ses partisans veulent les généraliser ; ses critiques évoquent le coût."],["Créer un référent discriminations dans chaque hôpital et développer l’interprétariat médical public","L’interprétariat médical est surtout assuré par des associations. Ses partisans veulent un service public ; ses critiques évoquent le coût."],["Présenter chaque année au Parlement la stratégie industrielle de l’État, avec débat et vote","La politique industrielle est présentée par des plans gouvernementaux, sans vote annuel. Ses partisans veulent un contrôle parlementaire ; ses critiques évoquent la souplesse."],["Faire adopter un plan de sortie des dépendances numériques pour les administrations, collectivités et entreprises publiques","L’État dépend de services numériques étrangers pour de nombreux usages. Ses partisans veulent une sortie progressive ; ses critiques évoquent le coût et le délai."],["Créer un haut-commissariat dédié à la condition animale","La politique du bien-être animal relève d’un ministère. Ses partisans veulent un haut-commissariat ; ses critiques évoquent l’utilité d’une structure de plus."],["Interdire le commerce de la fourrure et l’élevage d’animaux, même domestiques, à cette fin","L’élevage de visons pour la fourrure est interdit en France depuis 2021, et la fin des élevages est actée. Ses partisans veulent un interdit complet ; ses critiques évoquent l’emploi."],["Bannir l’usage d’animaux à des fins scientifiques au profit de méthodes non animales","L’expérimentation animale est encadrée par la règle des trois R : remplacer, réduire, raffiner. Ses partisans veulent un abandon ; ses critiques soulignent le besoin pour la recherche médicale."],["Interdire les pratiques de chasse, de pêche et de loisirs cruelles pour les animaux, comme la corrida ou la chasse à courre","La corrida est autorisée dans certaines régions par tradition locale. Ses partisans veulent l’interdire ; ses critiques défendent le patrimoine culturel."],["Remplacer les zoos fermés par des sanctuaires, lieux de découverte, de préservation et de recherche","La loi de 2021 interdit les spectacles de cétacés et d’animaux sauvages itinérants. Ses partisans veulent aller plus loin ; ses critiques évoquent la conservation."],["Réduire la publicité dans l’espace public, interdire les prospectus dans les boîtes aux lettres et les panneaux numériques","Les prospectus papier sont autorisés par défaut dans les boîtes aux lettres, sauf autocollant Stop Pub. Ses partisans veulent un régime plus strict ; ses critiques évoquent l’emploi dans l’affichage."],["Proscrire la publicité des produits et services les plus émetteurs de GES et générateurs de déchets","La publicité pour les énergies fossiles est interdite depuis la loi Climat de 2021. Ses partisans veulent l’élargir ; ses critiques défendent la liberté commerciale."],["Diminuer le temps de publicité à la télévision","La publicité à la télévision est plafonnée à 12 minutes par heure. Ses partisans veulent réduire ce temps ; ses critiques évoquent le financement des chaînes."],["Engager à l’ONU des négociations pour un traité encadrant les usages de l’intelligence artificielle","Plusieurs initiatives internationales existent sur l’IA, comme le Pacte numérique mondial de l’ONU. Ses partisans veulent un traité ; ses critiques évoquent la difficulté d’un accord."],["Créer une chaîne de télévision méditerranéenne multilingue, diffusée des deux rives et sur Internet, sur le modèle d’Arte","Arte est une chaîne culturelle franco-allemande créée en 1992. Ses partisans veulent un équivalent méditerranéen ; ses critiques évoquent le coût."],["Défendre l’usage du français dans les institutions internationales","Le français est langue officielle de l’ONU et de l’Union européenne mais perd du terrain face à l’anglais. Ses partisans veulent des mesures actives ; ses critiques évoquent le pragmatisme."],["Créer une académie de la Francophonie, ouverte aux évolutions et à la créolisation de la langue","L’Académie française est l’institution officielle de référence de la langue. Ses partisans veulent une instance plus ouverte ; ses critiques défendent l’existant."],["Renforcer les médias audiovisuels francophones","TV5 Monde et France Médias Monde diffusent en français à l’international. Ses partisans veulent plus de moyens ; ses critiques évoquent le budget."],["Renforcer l’Assemblée parlementaire de la Francophonie (APF)","L’APF réunit des parlementaires de nombreux pays francophones. Ses partisans veulent lui donner plus de poids ; ses critiques évoquent son influence limitée."],["Recréer des espaces d’expression culturelle francophones, comme les scènes nationales","Les scènes nationales sont un label du ministère de la Culture en France. Ses partisans veulent l’exporter ; ses critiques évoquent le coût."],["Renforcer le réseau des Instituts français et des Alliances françaises","Ces réseaux diffusent la langue et la culture française à l’étranger. Ses partisans veulent plus de moyens ; ses critiques évoquent le budget."],["Empêcher que le droit de propriété privée prime sur la protection de l’eau, de l’air, de l’alimentation, du vivant, de la forêt, de la santé et de l’énergie","Le droit de propriété est protégé par la Constitution depuis 1789. Ses partisans veulent le subordonner aux biens communs ; ses critiques défendent sa valeur."],["Créer un Défenseur des biens communs chargé de publier un rapport annuel sur leur état","Plusieurs autorités indépendantes existent pour les droits et l’environnement. Ses partisans veulent un nouveau rôle dédié ; ses critiques évoquent un doublon."],["Inscrire dans la Constitution de la 6e République la liste des biens communs et services essentiels à gérer collectivement","Le préambule de 1946 mentionne déjà que les services publics nationaux doivent devenir propriété de la collectivité. Ses partisans veulent une liste précise ; ses critiques évoquent la rigidité."],["Redonner moyens et pouvoir aux associations citoyennes et à l’éducation populaire, avec des conventions pluriannuelles plutôt que des appels à projets","Les associations dépendent de plus en plus d’appels à projets annuels. Ses partisans veulent des financements stables ; ses critiques évoquent le contrôle des fonds publics."],["Garantir les libertés associatives","La liberté d’association est protégée par la loi de 1901. Ses partisans dénoncent des restrictions récentes ; ses critiques évoquent la lutte contre l’extrémisme."],["Reconnaître et valoriser le bénévolat comme force d’émancipation, d’éducation populaire et d’expérimentation collective","Le compte d’engagement citoyen reconnaît certaines activités bénévoles. Ses partisans veulent une reconnaissance plus large ; ses critiques évoquent le coût."],["Créer une autorité éthique indépendante pour contrôler les conflits d’intérêts et prévenir la corruption des dirigeants européens","L’Union européenne a créé en 2024 un organisme d’éthique interinstitutionnel. Ses partisans veulent une autorité plus indépendante ; ses critiques jugent le cadre actuel suffisant."],["Appliquer la clause de la nation la plus favorisée pour harmoniser par le haut les droits des femmes","Cette clause existe en droit commercial. Ses partisans veulent l’appliquer aux droits des femmes en Europe ; ses critiques évoquent les compétences nationales."],["Garantir le droit à l’avortement partout dans l’Union européenne","Les législations sur l’avortement varient fortement selon les pays de l’Union, comme Malte ou la Pologne. Ses partisans veulent un droit européen ; ses critiques défendent la compétence des États."]],"clim":[["Doter la justice pénale environnementale de moyens efficaces, sanctionner les pollutions industrielles et appliquer le principe pollueur-payeur","Des pôles judiciaires spécialisés existent depuis 2020. Ses partisans veulent plus de magistrats et de sanctions ; ses critiques redoutent une pénalisation excessive des entreprises."],["Instaurer des Défenseurs de la nature au niveau communal, chargés de l’eau, de l’air, des forêts et des sols","Des collectivités ont expérimenté des représentants de la nature, mais aucun statut légal n’existe en France. Ses partisans veulent donner une voix aux écosystèmes ; ses critiques s’interrogent sur la légitimité juridique."],["Freiner l’étalement urbain en rapprochant lieux de vie et lieux d’emploi","La loi Climat de 2021 fixe l’objectif de zéro artificialisation nette, assoupli depuis. Ses partisans veulent limiter la consommation de terres ; ses critiques défendent la liberté de construire."],["Adapter villes et terres cultivées au réchauffement, en désimperméabilisant les sols et en créant îlots et corridors de fraîcheur","De nombreuses villes végétalisent leurs espaces pour lutter contre la chaleur. Ses partisans veulent généraliser ces mesures ; ses critiques évoquent leur coût et la pression foncière."],["Renforcer les moyens de l’ingénierie territoriale pour aider les collectivités à planifier une écologie régénérative","Les petites communes manquent d’ingénieurs pour monter leurs projets. Ses partisans veulent un appui de l’État ; ses critiques évoquent le coût."],["Réviser les plans de prévention des inondations et créer un fonds de relocalisation des constructions menacées","Le fonds Barnier finance déjà certaines relocalisations. Ses partisans veulent un dispositif plus large ; ses critiques soulignent les difficultés sociales de ces déplacements."],["Indemniser les victimes de pollutions et soutenir les lanceurs d’alerte par un fonds alimenté par les activités polluantes","La loi de 2022 a renforcé la protection des lanceurs d’alerte. Ses partisans veulent un fonds de réparation ; ses critiques évoquent le coût pour les entreprises."],["Redonner à l’État et aux collectivités les moyens de surveiller, contrôler, sanctionner et réguler le marché","Les effectifs de contrôle ont diminué dans plusieurs administrations. Ses partisans veulent les restaurer ; ses critiques évoquent le coût."],["Annuler l’affaiblissement des normes environnementales et de la participation publique, dont les dérogations accordées par les préfets","Les préfets disposent depuis 2017 d’un pouvoir de dérogation à certaines normes. Ses partisans y voient un recul ; ses défenseurs, une simplification utile."],["Établir un plan d’urgence de dépollution, en priorité en Guadeloupe et Martinique touchées par le chlordécone","Le chlordécone reste présent dans les sols pour des siècles. Ses partisans veulent un plan massif ; ses critiques soulignent les difficultés techniques de dépollution."],["Créer une autorité indépendante de sûreté des risques industriels, recruter des inspecteurs ICPE et durcir les sanctions","L’incendie de l’usine Lubrizol à Rouen en 2019 a relancé le débat sur les contrôles. Ses partisans veulent une autorité dédiée ; ses critiques soulignent le coût."],["Créer un centre national de régénération du charbon actif pour détruire les PFAS dans l’eau","Le charbon actif sert à filtrer les PFAS, qu’il faut ensuite traiter. Ses partisans veulent une filière publique ; ses critiques s’interrogent sur son coût."],["Reconnaître en Guadeloupe et Martinique une crise sanitaire et écologique liée à l’eau et au chlordécone","Les coupures d’eau sont fréquentes en Guadeloupe depuis des années. Ses partisans veulent une reconnaissance officielle ; ses critiques soulignent que les moyens comptent davantage."],["Inscrire une « règle bleue » : ne pas prélever, transformer ni polluer le cycle de l’eau au-delà de sa capacité de renouvellement","Cette règle appliquerait à l’eau un principe de limite écologique. Ses partisans veulent l’inscrire dans le droit ; ses critiques soulignent la difficulté de la mesurer."],["Créer un haut-commissariat à l’eau doté d’une instance scientifique indépendante","La gestion de l’eau relève de plusieurs institutions, dont les agences de l’eau. Ses partisans veulent un pilotage unifié ; ses critiques redoutent une couche administrative supplémentaire."],["Garantir l’accès à l’eau en mettant fin aux coupures illégales et en installant fontaines et sanitaires publics gratuits","Les coupures d’eau pour impayés sont interdites en résidence principale depuis 2013. Ses partisans veulent faire respecter la loi ; ses critiques évoquent le coût pour les communes."],["Organiser la sortie des PFAS en interdisant la fabrication, l’importation et la vente des produits qui en contiennent","Une loi de 2025 interdit les PFAS dans certains produits à partir de 2026, comme les cosmétiques et les vêtements. Ses partisans veulent une interdiction générale ; ses critiques évoquent les usages industriels indispensables."],["Interdire l’installation de panneaux solaires et d’éoliennes qui exigent des coupes rases","Certaines installations nécessitent de défricher. Ses partisans veulent protéger les forêts ; ses critiques craignent un frein aux énergies renouvelables."],["Intégrer les objectifs climatiques et de biodiversité dans les politiques forestières","La forêt française absorbe du carbone, mais s’adapte difficilement au réchauffement. Ses partisans veulent mieux planifier ; ses critiques évoquent la filière bois."],["Augmenter les moyens de l’ONF et stopper sa privatisation, y compris pour l’accueil du public","L’Office national des forêts a perdu des effectifs au fil des années. Ses partisans veulent un service public renforcé ; ses critiques soulignent le coût."],["Renforcer les moyens humains et matériels de lutte contre les feux de forêt","Les incendies de 2022 en Gironde ont été parmi les plus étendus depuis longtemps. Ses partisans veulent plus de moyens ; ses critiques évoquent le coût."],["Accroître la part des forêts publiques par le droit de préemption et réhabiliter les communs forestiers","Environ les trois quarts de la forêt française appartiennent à des propriétaires privés. Ses partisans veulent étendre le public ; ses critiques défendent la propriété privée."],["Conditionner les aides publiques à une gestion forestière adaptée au climat et favorable au stockage de carbone","Des aides publiques existent pour le reboisement et la gestion. Ses partisans veulent y mettre des conditions ; ses critiques évoquent les contraintes pour les propriétaires."],["Limiter la taille des engins forestiers et interdire le dessouchage pour protéger les sols","Les engins lourds tassent les sols. Ses partisans veulent protéger les sols ; ses critiques soulignent le surcoût."],["Privilégier la régénération naturelle et la diversité des essences et des âges pour rendre les forêts résilientes","Les plantations d’une seule essence sont plus vulnérables aux sécheresses et aux parasites. Ses partisans veulent diversifier ; ses critiques évoquent la rentabilité."],["Rétablir un maillage de scieries et d’entreprises de transformation du bois, en circuits courts","Une grande partie du bois est exportée brute puis réimportée transformée. Ses partisans veulent relocaliser la transformation ; ses critiques soulignent la rentabilité."],["Stopper les projets industriels de bois-énergie et hiérarchiser les usages : bois d’œuvre d’abord, énergie en dernier recours","Le bois-énergie est encouragé pour remplacer les fossiles. Ses partisans veulent privilégier les usages durables ; ses critiques mettent en avant sa place dans la transition."],["Bannir de la commande publique et privée les produits liés à la déforestation","Un règlement européen contre la déforestation importée a été reporté plusieurs fois. Ses partisans veulent l’appliquer ; ses critiques évoquent le coût pour les filières."],["Lancer un programme international de dépollution des mers, d’abord en Méditerranée et outre-mer","La Méditerranée est l’une des mers les plus touchées par les plastiques. Ses partisans veulent un programme de dépollution ; ses critiques soulignent le coût et l’efficacité."],["Lutter contre la pêche illégale, empêcher le retour de la pêche électrique et bannir les engins destructeurs","La pêche électrique est interdite dans l’Union européenne depuis 2021. Ses partisans veulent un contrôle renforcé ; ses critiques soulignent les moyens de surveillance."],["Allouer quotas et subventions de pêche selon des critères sociaux et environnementaux, et renforcer le lien avec le territoire","Les quotas sont fixés au niveau européen puis répartis entre navires. Ses partisans veulent favoriser la pêche artisanale ; ses critiques soulignent les droits acquis."],["Décréter un moratoire sur les fermes-usines de saumons et favoriser une aquaculture soutenable","Les élevages intensifs de saumons posent des questions de pollution et de bien-être animal. Ses partisans veulent un moratoire ; ses critiques évoquent les emplois."],["Mettre en place un plan contre les marées de sargasses aux Antilles et agir à la source au niveau international","Les sargasses échouent sur les côtes antillaises depuis 2011 et dégagent des gaz toxiques. Ses partisans veulent un plan massif ; ses critiques soulignent la difficulté d’agir à la source."],["Défendre un moratoire sur les forages en Méditerranée et sur l’exploitation minière des grands fonds","La France soutient un moratoire sur l’exploitation des grands fonds. Ses partisans parlent de précaution ; ses critiques évoquent l’accès aux métaux critiques."],["Interdire les prélèvements massifs de sable marin et combattre leur extraction illicite","Le sable est la deuxième ressource la plus exploitée au monde après l’eau. Ses partisans veulent protéger les littoraux ; ses critiques soulignent les besoins du BTP."],["Lutter contre l’acidification des océans et les zones mortes, en commençant par une alliance pour la Méditerranée","L’acidification résulte surtout des émissions de CO2. Ses partisans veulent une coopération régionale ; ses critiques soulignent la portée limitée d’une alliance."],["Poursuivre une planification maritime intégrée conciliant production d’énergie, usages de la mer et biodiversité","La France a adopté des documents stratégiques de façade pour organiser les usages de la mer. Ses partisans veulent les renforcer ; ses critiques évoquent les conflits d’usage."],["Élaborer un plan de décarbonation de la marine marchande et faire de la France le leader de la propulsion vélique","Des entreprises françaises développent des cargos à voile. Ses partisans y voient une filière d’avenir ; ses critiques soulignent son coût et ses limites techniques."],["Refuser le canal Seine-Nord au profit du développement du port du Havre","Le canal Seine-Nord Europe, d’environ 107 kilomètres, doit relier la Seine au nord de l’Europe au début des années 2030. Ses partisans le jugent coûteux et nuisible ; ses défenseurs y voient un report modal vers le fluvial."],["Planifier la bifurcation écologique de l’industrie spatiale","L’industrie spatiale produit des émissions et des débris. Ses partisans veulent l’aligner sur les objectifs climatiques ; ses critiques soulignent son intérêt scientifique et stratégique."],["Réduire l’impact écologique du numérique : obsolescence, écoconception et indice carbone pour le web","La loi de 2021 vise à réduire l’empreinte environnementale du numérique. Ses partisans veulent aller plus loin ; ses critiques évoquent la charge pour les entreprises."],["Décréter un moratoire sur les centres de données non souverains, sans participation publique","L’État veut au contraire accélérer l’implantation de grands centres de données. Ses partisans parlent de souveraineté et de consommation d’énergie ; ses critiques évoquent l’emploi et la compétitivité."],["Améliorer l’efficacité énergétique et hydrique des centres de données et soumettre leur construction à autorisation","Les centres de données consomment de l’électricité et de l’eau pour le refroidissement. Ses partisans veulent un encadrement ; ses critiques redoutent un frein à l’investissement."],["Instaurer un moratoire sur les grands projets nuisibles et les réévaluer à l’aune de la « règle verte »","La règle verte consiste à ne pas prélever plus que la nature ne peut renouveler. Ses partisans veulent suspendre des projets contestés ; ses critiques redoutent un blocage de l’investissement."],["Adopter des lois-cadres de planification écologique et démocratique, coordonnant échelons national et local","Un secrétariat général à la planification écologique a été créé en 2022 auprès du Premier ministre. Ses partisans veulent une loi plus contraignante ; ses critiques défendent la souplesse."],["Donner à l’État et à ses opérateurs (Cerema, ONF, OFB, Météo-France) les moyens de mener cette planification","Ces opérateurs ont connu des baisses d’effectifs. Ses partisans veulent les renforcer ; ses critiques évoquent le coût."],["Créer un conseil à la planification écologique chargé de l’organiser","Un conseil de planification écologique réunit déjà des ministres et des acteurs. Ses partisans veulent une instance plus indépendante ; ses critiques parlent de doublon."],["Imposer aux entreprises une comptabilité carbone certifiée, d’abord dans les secteurs les plus polluants, avec une trajectoire de baisse","Des obligations de reporting existent déjà pour les grandes entreprises, avec la directive européenne CSRD. Ses partisans veulent des trajectoires contraignantes ; ses critiques évoquent la charge administrative."],["Créer un crime climatique de dissimulation et de tromperie sur les émissions des entreprises","La loi sanctionne déjà les allégations environnementales trompeuses. Ses partisans veulent un délit spécifique ; ses critiques redoutent l’insécurité juridique."],["Inscrire dans les comptes publics un diagnostic régulier de l’état des écosystèmes, chiffrant le coût de leur restauration","Il s’agit d’une comptabilité écologique de l’État. Ses partisans veulent mesurer le patrimoine naturel ; ses critiques soulignent la difficulté de valoriser les écosystèmes."],["Confier à l’Insee un outil de suivi en temps réel des données économiques et environnementales, fondé sur satellites et mesures de terrain","L’Insee publie des données environnementales, mais avec un décalage. Ses partisans veulent un suivi plus rapide ; ses critiques évoquent le coût et la fiabilité."],["Mettre en place une logistique verte : sortir des flux tendus, privilégier le train et le fluvial, mutualiser le dernier kilomètre","Le transport de marchandises se fait à environ 90 % par la route. Ses partisans veulent un report vers le rail ; ses critiques soulignent la compétitivité des entreprises."],["Faire des outre-mer des territoires pilotes de la planification écologique, en circuits courts, autonomie énergétique et biodiversité","Les outre-mer dépendent fortement des importations. Ses partisans en font des laboratoires ; ses critiques demandent de ne pas oublier leurs besoins de développement."],["Viser l’autosuffisance alimentaire grâce à l’agriculture paysanne écologique et aux filières locales","La France est autosuffisante en céréales mais importe environ la moitié des fruits et légumes qu’elle consomme. Ses partisans veulent relocaliser ; ses critiques soulignent le commerce et les prix."],["Sauver les trésors de biodiversité ultramarins en renforçant les moyens d’étude et de protection des espèces","Les outre-mer abritent la grande majorité de la biodiversité française. Ses partisans veulent plus de moyens ; ses critiques évoquent les priorités budgétaires."],["Promouvoir des plans d’autonomie énergétique","Un objectif d’autonomie énergétique des outre-mer est fixé à 2030 par la loi de 2015. Ses partisans veulent l’accélérer ; ses critiques soulignent les retards."],["Renforcer la résilience des outre-mer face aux risques naturels majeurs, de la prévention à la réparation","Le cyclone Chido a dévasté Mayotte en décembre 2024. Ses partisans veulent investir dans la prévention ; ses critiques évoquent le coût."],["Faciliter les analyses des sols des jardins créoles pour soutenir les pratiques agroécologiques existantes","Les jardins créoles sont concernés par la pollution au chlordécone. Ses partisans veulent des analyses gratuites ; ses critiques évoquent les moyens."],["Engager un plan de transports collectifs outre-mer, sur le modèle du tram-train de La Réunion","Plusieurs projets de transport collectif en outre-mer ont été retardés ou abandonnés. Ses partisans veulent un plan national ; ses critiques évoquent le coût."],["Lutter contre la pêche illégale dans les eaux territoriales françaises","La Guyane subit une pêche illégale importante venue des pays voisins. Ses partisans veulent des moyens de surveillance ; ses critiques soulignent l’ampleur de l’espace à contrôler."],["Planifier la conception de modèles de voitures électriques légères et abordables","Un leasing social pour les ménages modestes a été lancé en 2024. Ses partisans veulent une filière de petits véhicules ; ses critiques soulignent la concurrence internationale."],["Relancer l’observation spatiale de la Terre pour le climat, sous la responsabilité du CNES","Le CNES contribue à plusieurs missions d’observation du climat. Ses partisans veulent amplifier ce rôle ; ses critiques évoquent le budget."],["Engager un plan global de rénovation des infrastructures pour les adapter au changement climatique","Un plan national d’adaptation au changement climatique a été présenté en 2025. Ses partisans veulent un effort plus massif ; ses critiques évoquent le coût."],["Lancer un plan de dépollution de la Méditerranée, des façades maritimes et des fonds marins de plusieurs océans","Ce plan élargit la dépollution des mers à l’échelle internationale. Ses partisans veulent un effort global ; ses critiques soulignent le coût et la portée limitée."],["Lancer de grands travaux ferroviaires et rouvrir lignes et gares fermées depuis trente ans","Des milliers de kilomètres de petites lignes ont été fermés depuis des décennies. Ses partisans veulent les rouvrir ; ses critiques évoquent le coût et la fréquentation."],["Investir dans l’efficacité et la sobriété énergétiques ainsi que dans les projets innovants, dont les énergies marines","L’efficacité énergétique est l’un des piliers de la stratégie nationale. Ses partisans veulent y consacrer davantage ; ses critiques soulignent la maturité de certaines technologies."],["Accélérer la modernisation et l’enfouissement du réseau à haute tension","RTE prévoit d’investir massivement dans le réseau pour accueillir les énergies renouvelables. Ses partisans veulent l’accélérer ; ses critiques évoquent le coût de l’enfouissement."],["Réaliser un diagnostic national des ouvrages d’art (ponts, viaducs, digues, barrages) et les consolider","L’effondrement du pont de Gênes en 2018 a relancé l’attention sur les ponts. Ses partisans veulent un recensement complet ; ses critiques évoquent le coût."],["Reconstruire durablement les capacités productives du secteur bois, au plus près des massifs forestiers","La filière bois française est fragmentée et exporte du bois brut. Ses partisans veulent la relocaliser ; ses critiques évoquent la compétitivité."],["Planifier des filières d’écoconstruction biosourcée et géosourcée, avec quotas dans la commande publique","La réglementation environnementale RE2020 favorise déjà les matériaux biosourcés. Ses partisans veulent des quotas ; ses critiques évoquent le coût et les assurances."],["Planifier l’installation de solutions de rafraîchissement dans hôpitaux, EHPAD, écoles et espaces publics","Les vagues de chaleur de l’été exposent les publics fragiles. Ses partisans veulent anticiper ; ses critiques évoquent le coût et l’énergie."],["Imposer la gratuité de lieux refuges rafraîchis lors des alertes canicule","Des villes ouvrent déjà des lieux rafraîchis lors des canicules. Ses partisans veulent une obligation ; ses critiques évoquent la charge pour les communes."],["Planifier une stratégie nationale de sobriété métallique, adaptée à l’intérêt général","La transition énergétique consomme beaucoup de métaux. Ses partisans veulent réduire les besoins ; ses critiques soulignent la nécessité d’accéder à ces ressources."],["Garantir coûte que coûte l’accès à l’eau courante potable pour tous les habitants d’outre-mer","Des coupures prolongées touchent Mayotte et la Guadeloupe. Ses partisans veulent un engagement de l’État ; ses critiques soulignent les compétences locales."],["Rétablir une eau de bonne qualité et en volume suffisant là où le service public de l’eau défaille outre-mer","Les réseaux d’eau de plusieurs territoires sont vétustes. Ses partisans veulent une reprise en main ; ses critiques évoquent la gestion locale."],["Remplacer en urgence les canalisations d’eau et d’assainissement, notamment en Guadeloupe, grâce à un financement de l’État","Les pertes dans le réseau guadeloupéen sont très élevées. Ses partisans veulent un financement de l’État ; ses critiques évoquent le coût."],["Adopter la régie comme mode de gestion de l’eau, avec sanctions contre les délégataires défaillants","Plusieurs collectivités d’outre-mer ont connu des litiges avec leurs délégataires. Ses partisans veulent la régie ; ses critiques défendent le savoir-faire privé."],["En cas de pénurie, déclencher un plan ORSEC-eau de distribution de bouteilles, avec prix plafonnés","Des distributions de bouteilles ont eu lieu à Mayotte et en Guadeloupe lors de crises. Ses partisans veulent un plan automatique ; ses critiques évoquent la logistique."],["Mettre en œuvre un plan d’urgence pour la crise de l’eau à Mayotte","Mayotte souffre de sécheresses et de coupures depuis 2023, aggravées par le cyclone Chido. Ses partisans veulent un plan d’urgence ; ses critiques soulignent les difficultés structurelles."],["Créer un pôle public des transports et de la mobilité","Les transports sont partagés entre l’État, les régions et les entreprises. Ses partisans veulent un pilotage unifié ; ses critiques évoquent une administration lourde."],["Relier le pays par des transports publics interconnectés : trains, bus urbains et interurbains, vélos","L’intermodalité reste un point faible de nombreux territoires. Ses partisans veulent un réseau cohérent ; ses critiques évoquent le coût."],["Stopper la suppression des lignes du quotidien, en rouvrir, accroître fréquences et tarifs accessibles, et maintenir les guichets","Les trains du quotidien dépendent des régions. Ses partisans veulent plus de lignes ; ses critiques évoquent le coût et les usages."],["Revenir sur la liquidation de Fret SNCF, imposée par la Commission européenne et les gouvernements Macron","Fret SNCF a été scindée fin 2024 après une procédure européenne sur des aides jugées illégales. Ses partisans dénoncent un démantèlement ; ses défenseurs invoquent le respect des règles de concurrence."],["Développer massivement le fret ferroviaire, dont le wagon isolé, et imposer le raccordement des plateformes logistiques au rail","Le fret ferroviaire représente une faible part du transport de marchandises. Ses partisans veulent le développer ; ses critiques soulignent les coûts et la flexibilité."],["Développer les transports à la demande hors des zones denses","Des services de transport à la demande existent dans des communes rurales. Ses partisans veulent les généraliser ; ses critiques évoquent le coût."],["Diffuser des voitures électriques légères et abordables via la commande publique et le leasing social","Un leasing social a été ouvert en 2024 aux ménages modestes, avec une offre limitée. Ses partisans veulent l’étendre ; ses critiques évoquent le coût budgétaire."],["Suspendre les ZFE dans leur conception actuelle, jugée inégalitaire et trop tolérante envers les SUV","Les zones à faibles émissions restreignent la circulation des véhicules polluants. Leur maintien a été débattu au Parlement en 2025. Ses partisans critiquent leur impact social ; ses défenseurs, la qualité de l’air."],["Garantir le droit à la mobilité dans les territoires peu desservis, grâce aux garages solidaires et à une aide à la réparation","Des garages solidaires proposent des réparations à prix réduit. Ses partisans veulent les soutenir ; ses critiques évoquent le coût."],["Adopter un plan de développement du ferroutage et du report modal, y compris cabotage, fluvial et dirigeables","Le ferroutage consiste à transporter des camions sur des trains. Ses partisans veulent le développer ; ses critiques évoquent les infrastructures nécessaires."],["Interdire les vols de nuit entre 23 h et 6 h et réduire les créneaux de décollage restants","Plusieurs aéroports, comme Orly, ont déjà un couvre-feu nocturne. Ses partisans veulent l’étendre pour la santé des riverains ; ses critiques évoquent l’économie."],["Mettre fin au projet d’enfouissement des déchets nucléaires et poursuivre la recherche d’un traitement à long terme","Le projet Cigéo, près de Bure dans la Meuse, doit stocker les déchets les plus radioactifs. Ses partisans contestent son choix ; ses défenseurs y voient une solution sûre à long terme."],["Planifier le déploiement de technologies de stockage d’énergie pour un système 100 % renouvelable","Le stockage est indispensable pour compenser l’intermittence. Ses partisans veulent un plan ; ses critiques s’interrogent sur les technologies et leurs coûts."],["Revenir sur les hausses abusives du prix du gaz","Les prix du gaz ont fortement augmenté depuis 2021. Ses partisans veulent un contrôle ; ses critiques soulignent les prix mondiaux."],["Privilégier les sources d’énergie adaptées aux territoires et refuser la méthanisation à outrance","La méthanisation produit du biogaz à partir de déchets organiques, avec des conflits locaux. Ses partisans veulent l’encadrer ; ses défenseurs y voient un revenu pour les agriculteurs."],["Abroger la fusion de l’ASN et de l’IRSN et garantir leurs moyens respectifs","La fusion de l’autorité de sûreté nucléaire et de l’institut d’expertise a été décidée en 2024. Ses partisans craignent une perte d’indépendance ; ses défenseurs, une simplification."],["Créer un service public de la rénovation énergétique, prioritaire contre la précarité énergétique","France Rénov’ est le réseau public d’information, créé en 2022. Ses partisans veulent un service plus intégré ; ses critiques s’interrogent sur son coût."],["Conditionner les labels écologiques à des résultats énergétiques concrets et vérifiés, pour le neuf comme l’ancien","Les labels reposent parfois sur des moyens plutôt que des résultats. Ses partisans veulent des mesures réelles ; ses critiques évoquent la complexité."],["Se doter des moyens de la rénovation : formations aux métiers et « guichet unique » public pour les propriétaires","Un accompagnateur Rénov’ est obligatoire pour certaines aides depuis 2024. Ses partisans veulent un guichet unique ; ses critiques évoquent la lourdeur."],["Réduire l’impact des travaux grâce à l’écoconstruction en matériaux biosourcés et géosourcés","Ces matériaux émettent moins de carbone que le béton. Ses partisans veulent les généraliser ; ses critiques évoquent le coût et les normes."],["Optimiser les usages de l’énergie dans le tertiaire, par exemple par l’extinction nocturne et des éclairages LED obligatoires","Une règle impose déjà d’éteindre les enseignes et vitrines la nuit. Ses partisans veulent l’étendre ; ses critiques évoquent la sécurité et le coût."],["Interdire les fermes-usines","La notion d’élevage industriel est débattue, et les seuils d’autorisation ont été assouplis en 2025. Ses partisans veulent les interdire ; ses critiques défendent la compétitivité."],["Limiter la durée du transport des animaux vivants, puis mettre fin progressivement à leur exportation","L’Union européenne révise ses règles sur le transport des animaux. Ses partisans parlent de bien-être animal ; ses critiques évoquent les filières d’exportation."],["Définir de nouvelles normes d’élevage : accès à l’extérieur, pâturage, densité et surface minimale","Les normes d’élevage sont fixées en partie au niveau européen. Ses partisans veulent les renforcer ; ses critiques évoquent le coût."],["Instaurer un moratoire sur les élevages de saumons et interdire préventivement celui des céphalopodes","Un projet d’élevage de poulpes aux Canaries a suscité des critiques. Ses partisans veulent anticiper ; ses critiques évoquent l’innovation."],["Créer un service public du réemploi, avec formations aux métiers de la réparation","Un bonus réparation existe depuis 2022. Ses partisans veulent un service public ; ses critiques soulignent le rôle des acteurs privés."],["Implanter des mines urbaines, recycleries et ateliers de réparation dans tout le pays","Le recyclage des métaux contenus dans les déchets électroniques est encore limité. Ses partisans veulent un maillage ; ses critiques évoquent le coût."],["Abolir l’obsolescence programmée et allonger les garanties légales des produits","L’obsolescence programmée est un délit depuis 2015 et la garantie légale est de deux ans. Ses partisans veulent l’appliquer et l’allonger ; ses critiques évoquent le coût pour les fabricants."],["Rendre obligatoires le réemploi, le compostage et le recyclage, dans cet ordre, et financer les filières de substitution","Le tri des biodéchets est obligatoire depuis 2024. Ses partisans veulent aller plus loin ; ses critiques évoquent les coûts de collecte."],["Imposer l’écoconception et enseigner le low-tech dans les écoles publiques d’ingénieurs et de design","Le low-tech désigne des technologies simples et durables. Ses partisans veulent l’enseigner ; ses critiques s’interrogent sur sa place dans les cursus."],["Généraliser un indice de durabilité, encadrer le prix des pièces de rechange et interdire les produits peu durables","Un indice de réparabilité existe depuis 2021 et un indice de durabilité est en cours de mise en place. Ses partisans veulent l’étendre ; ses critiques évoquent la charge pour les entreprises."],["Interdire les mentions trompeuses comme « neutre en carbone »","La loi Climat de 2021 encadre déjà cette mention. Ses partisans veulent l’interdire ; ses critiques soulignent le rôle de la compensation."],["Décréter un moratoire sur les nouveaux incinérateurs et lutter contre leurs pollutions, dont les PFAS","Les incinérateurs traitent une partie des déchets non recyclables. Ses partisans veulent un moratoire ; ses critiques soulignent les capacités de traitement nécessaires."],["Réorganiser les filières de responsabilité élargie du producteur en donnant la priorité à la réduction des déchets","Les filières de responsabilité élargie financent la gestion des déchets de plusieurs produits. Ses partisans veulent privilégier la prévention ; ses critiques évoquent la complexité."],["Protéger le foncier agricole, forestier et naturel pour atteindre le zéro artificialisation nette","La loi Climat fixe l’objectif de zéro artificialisation nette en 2050, assoupli depuis. Ses partisans veulent un cadre strict ; ses critiques défendent la liberté communale."],["Développer les circuits courts pour réduire transports et suremballages","Les circuits courts progressent mais restent minoritaires. Ses partisans veulent les encourager ; ses critiques évoquent les prix."],["Réformer la FAO pour favoriser souveraineté alimentaire, régulation des marchés et conversion écologique","La FAO est l’agence de l’ONU pour l’alimentation et l’agriculture. Ses partisans veulent une réorientation ; ses critiques soulignent la difficulté de réformer une organisation internationale."],["Promouvoir, sous l’égide de l’ONU, une force d’intervention et de sécurité écologique","L’idée de « casques verts » a été avancée à plusieurs reprises. Ses partisans veulent une réponse internationale aux catastrophes ; ses critiques évoquent la souveraineté des États."],["Reconnaître le crime d’écocide","La loi Climat de 2021 a créé un délit d’écocide limité aux pollutions graves et intentionnelles. Ses partisans veulent un crime plus large ; ses critiques redoutent l’insécurité juridique."],["Faire de l’eau, de sa protection et de son accès pour tous une priorité de la politique internationale française","L’accès à l’eau est reconnu comme droit humain par l’ONU depuis 2010. Ses partisans veulent en faire une priorité ; ses critiques soulignent les moyens de l’aide."],["Soutenir la création d’un tribunal international de justice climatique et environnementale","La Cour internationale de justice a rendu en 2025 un avis sur les obligations climatiques des États. Ses partisans veulent un tribunal dédié ; ses critiques soulignent la souveraineté des États."],["Relancer et faire aboutir les négociations sur un traité international contre les plastiques","Les négociations n’avaient pas abouti à un accord à la fin 2025. Ses partisans veulent un traité contraignant ; ses critiques soulignent les divergences entre États producteurs."],["Soutenir un traité de non-prolifération des énergies fossiles","Des États insulaires du Pacifique portent cette proposition. Ses partisans veulent organiser la sortie des fossiles ; ses critiques soulignent les besoins énergétiques."],["Faire des pôles Arctique et Antarctique des biens communs de l’humanité, protégés des activités militaires et du pillage","Le traité sur l’Antarctique de 1959 interdit les activités militaires. L’Arctique est géré par ses États riverains. Ses partisans veulent étendre la protection ; ses critiques évoquent la souveraineté."],["Répondre aux bouleversements climatiques par des transferts de technologies, la coopération multilatérale et le soutien aux initiatives locales","Les pays du Sud réclament des financements pour s’adapter. Ses partisans veulent des transferts ; ses critiques évoquent les coûts et la propriété intellectuelle."],["Créer une structure commune de lutte contre les pollutions et de dépollution de la Méditerranée","La convention de Barcelone existe depuis 1976 pour protéger la Méditerranée. Ses partisans veulent une structure plus opérationnelle ; ses critiques soulignent les divergences entre États."],["Étendre à la Méditerranée les normes écologiques de la mer Baltique, notamment sur les émissions du trafic maritime","La Méditerranée est devenue une zone de contrôle des émissions de soufre en 2025. Ses partisans veulent aller plus loin ; ses critiques évoquent le coût pour le transport maritime."],["Garantir un accès respectueux à la nature en rétablissant le plein accès aux sentiers balisés","Certains sentiers sont fermés pour des raisons de sécurité ou de conservation. Ses partisans veulent garantir l’accès ; ses critiques soulignent la protection des milieux."],["Créer des banques de désinvestissement pour regrouper les actifs nocifs et absorber les pertes liées à leur arrêt","Ces structures s’inspirent des banques de défaisance. Ses partisans veulent organiser la sortie des actifs fossiles ; ses critiques redoutent un coût pour l’argent public."],["Pénaliser la détention d’actifs financiers qui aggravent le changement climatique, et renchérir le crédit des entreprises contraires à l’accord de Paris","Des règles européennes demandent déjà des informations sur les risques climatiques. Ses partisans veulent des sanctions financières ; ses critiques redoutent un effet sur l’investissement."]],"eur":[["Renforcer la coopération internationale contre le trafic de bois, l’orpaillage et les mines illégales qui détruisent les forêts","L’orpaillage illégal touche notamment la Guyane et le bassin amazonien. Ses partisans veulent une action concertée avec les pays voisins ; ses critiques soulignent la difficulté de contrôler de vastes zones forestières."],["Soutenir les accords sur les biens communs planétaires : traité sur la haute mer, moratoire sur les grands fonds marins et traité contr
