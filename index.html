var COLORS = ["var(--s0)", "var(--s1)", "var(--muted)", "var(--s3)", "var(--s4)", "var(--s5)"];
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function themeName(id) { return THEMES.filter(function (t) { return t.id === id; })[0].name; }
function pill(v) {
  if (v === undefined || v === null) return '<span class="pill" data-v="x">Passée</span>';
  return '<span class="pill" data-v="' + v + '">' + SCALE[v].label + "</span>";
}
function pctText(p) { return p === null ? "—" : p + " %"; }
var app = document.getElementById("app");
var logo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z" fill="currentColor"/></svg>';

function header() {
  var v = S.view;
  return '<div class="topbar"><button class="brand" data-act="home">' + logo + 'Boussole des mesures</button>' +
    '<nav class="nav" aria-label="Navigation">' +
    '<button class="chip" data-act="goquiz"' + (v === "quiz" ? ' aria-current="page"' : "") + ">Noter</button>" +
    '<button class="chip" data-act="goreport"' + (v === "report" ? ' aria-current="page"' : "") + ">Mon rapport</button>" +
    '<button class="chip" data-act="gocompare"' + (v === "compare" ? ' aria-current="page"' : "") + ">Comparer</button>" +
    '<button class="chip" data-act="theme" aria-label="Changer le thème (auto, clair, sombre)">' + THEME_LABEL[S.theme] + "</button></nav></div>";
}
function footer() {
  return '<div class="foot"><p>Cet outil contient les ' + M.length + ' mesures listées par votons-2027.fr (dont ' + idsFor("short").length + ' « phares »), reformulées en une phrase. Le site officiel annonce 1 069 mesures : il compte à part les « mesures clés » placées en tête de chaque section du livre, dont la plupart reprennent une puce déjà présente ici, et son décompte puce par puce n’est pas publié ; l’écart de 35 n’a donc pas pu être rattaché à des mesures précises. Les textes officiels font foi : <a href="https://melenchon2027.fr/programme/livre" target="_blank" rel="noopener">programme « L’Avenir en commun », édition 2027</a>.</p>' +
    "<p>Outil personnel pour comparer des opinions entre proches : ce n’est ni un sondage ni une consigne de vote. Tes réponses restent dans ton navigateur ; elles ne sont partagées que si tu envoies ton code.</p></div>";
}

/* ============ VUES ============ */
function viewHome() {
  var nShort = idsFor("short").length, nFull = idsFor("full").length;
  var answered = Object.keys(S.answers).length;
  var resume = answered > 0
    ? '<div class="card"><div class="row between"><div><h3>Reprendre où tu t’es arrêté</h3><p class="muted small tnum">' + answered + " mesures déjà notées</p></div>" +
      '<div class="row"><button class="btn" data-act="goquiz">Continuer</button><button class="btn ghost" data-act="goreport">Voir mon rapport</button></div></div></div>'
    : "";
  return header() +
    '<div class="hero"><h1>Que penses-tu des mesures ?</h1><p>Note chaque mesure du programme « L’Avenir en commun » selon ton propre avis. À la fin, tu obtiens ton pourcentage d’accord, un rapport détaillé, et tu peux comparer avec tes proches.</p></div>' +
    resume +
    '<div class="card"><label class="field" for="name">Ton prénom (il apparaîtra dans ton code de partage)<input type="text" id="name" maxlength="40" autocomplete="given-name" value="' + esc(S.name) + '" placeholder="Par exemple : Adrien"></label></div>' +
    '<div class="modes">' +
    '<button class="mode" data-act="start" data-mode="short"><span class="theme-tag">Version courte</span><span class="big tnum">' + nShort + '</span><span>mesures phares, 6 par thème</span><span class="muted small">Environ 10 minutes</span><span class="go">Commencer →</span></button>' +
    '<button class="mode" data-act="start" data-mode="full"><span class="theme-tag">Version complète</span><span class="big tnum">' + nFull + '</span><span>mesures sur 8 thèmes</span><span class="muted small">Environ 45 minutes, tu peux t’arrêter et reprendre</span><span class="go">Commencer →</span></button></div>' +
    footer();
}

function viewQuiz() {
  var ids = idsFor(S.mode);
  var i = Math.min(Math.max(S.pos[S.mode] || 0, 0), ids.length - 1);
  S.pos[S.mode] = i;
  var m = M[ids[i]], cur = S.answers[m.id];
  var done = ids.filter(function (id) { return S.answers[id] !== undefined; }).length;
  var opts = RAIL.map(function (v, k) {
    return '<button class="opt" data-act="answer" data-v="' + v + '" aria-pressed="' + (cur === v) + '"><span>' + SCALE[v].label + '</span><span class="key">touche ' + (k + 1) + "</span></button>";
  }).join("");
  var last = i === ids.length - 1;
  return header() +
    '<div class="card">' +
    '<div class="row between"><span class="muted small tnum">Mesure ' + (i + 1) + " sur " + ids.length + " · " + done + " notées · version " + (S.mode === "full" ? "complète" : "courte") + "</span>" +
    '<button class="btn ghost" data-act="goreport">Voir le rapport</button></div>' +
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + ids.length + '" aria-valuenow="' + (i + 1) + '"><i style="width:' + Math.round(100 * (i + 1) / ids.length) + '%"></i></div>' +
    '<div><span class="theme-tag">' + esc(themeName(m.theme)) + '</span><span class="numtag" title="Numéro de la mesure dans le programme (votons-2027.fr)">n° ' + m.no + "</span>" + (m.phare ? '<span class="phare">Mesure phare</span>' : "") + "</div>" +
    '<p class="measure" id="measure">' + esc(m.text) + "</p>" +
    '<details class="more"' + (S.openInfo ? " open" : "") + '><summary>En savoir plus</summary>' + infoHtml(m.info) + '<p class="small muted">Contexte rédigé par Claude à partir de sources publiques, de façon volontairement neutre : à vérifier avant de s’en servir comme référence.</p></details>' +
    '<div class="infobar"><button class="tog" data-act="openinfo" aria-pressed="' + S.openInfo + '">« En savoir plus » ouvert par défaut</button></div>' +
    '<div class="rail" role="group" aria-labelledby="measure">' + opts + "</div>" +
    '<button class="noopinion" data-act="answer" data-v="2" aria-pressed="' + (cur === 2) + '">Sans avis <span class="small">(touche 0)</span></button>' +
    '<label class="field" for="comment">Commentaire (facultatif)<textarea id="comment" maxlength="500" placeholder="Pourquoi cet avis ? Une nuance, une condition, une question…">' + esc(S.comments[m.id] || "") + "</textarea></label>" +
    '<div class="row between"><button class="btn ghost" data-act="prev"' + (i === 0 ? " disabled" : "") + ">← Précédente</button>" +
    '<button class="btn" data-act="next">' + (last ? "Voir mon rapport" : (cur === undefined ? "Passer →" : "Suivante →")) + "</button></div></div>";
}

function bar(label, p, n) {
  return '<div class="barrow"><span class="name">' + esc(label) + ' <span class="muted small tnum">(' + n + " notée" + (n > 1 ? "s" : "") + ')</span></span><div class="track"><i style="width:' + (p === null ? 0 : p) + '%"></i></div><span class="val tnum">' + pctText(p) + "</span></div>";
}

function reportText() {
  var ids = idsFor(S.mode), sc = score(ids, S.answers), ag = agreeShare(ids, S.answers), c = counts(ids, S.answers).c;
  var L = [];
  L.push("Boussole des mesures — rapport de " + (S.name || "moi") + " (version " + (S.mode === "full" ? "complète" : "courte") + ")");
  L.push("Accord global : " + pctText(sc.pct) + " sur " + sc.n + " mesures notées");
  L.push("Mesures approuvées (d’accord ou plutôt d’accord) : " + pctText(ag.pct));
  L.push("");
  SCALE.forEach(function (s) { L.push("- " + s.label + " : " + c[s.v]); });
  L.push("");
  L.push("Par thème :");
  THEMES.forEach(function (t) {
    var tids = ids.filter(function (id) { return M[id].theme === t.id; }), r = score(tids, S.answers);
    L.push("- " + t.name + " : " + pctText(r.pct) + " (" + r.n + " notées)");
  });
  var withC = ids.filter(function (id) { return S.comments[id]; });
  if (withC.length) {
    L.push(""); L.push("Commentaires :");
    withC.forEach(function (id) { L.push("- " + themeName(M[id].theme) + " n° " + M[id].no + " : " + M[id].text + " [" + (S.answers[id] === undefined ? "passée" : SCALE[S.answers[id]].label) + "] : " + S.comments[id]); });
  }
  return L.join("\n");
}

function viewReport() {
  var ids = idsFor(S.mode), sc = score(ids, S.answers), ag = agreeShare(ids, S.answers), cn = counts(ids, S.answers);
  if (sc.n === 0) {
    return header() + '<div class="card"><h2>Ton rapport apparaîtra ici</h2><p class="muted">Note au moins une mesure (autrement que « Sans avis ») pour obtenir ton pourcentage d’accord.</p><div class="row"><button class="btn" data-act="goquiz">Commencer à noter</button></div></div>' + footer();
  }
  var arc = 251.3, filled = (sc.pct / 100) * arc;
  var gauge = '<div class="gauge"><svg viewBox="0 0 200 112" role="img" aria-label="Accord global : ' + sc.pct + ' pour cent">' +
    '<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>' +
    '<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--s5)" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + filled.toFixed(1) + " " + arc + '"/></svg>' +
    '<div class="num tnum">' + sc.pct + ' %</div><p class="cap">d’accord avec les idées, sur ' + sc.n + " mesure" + (sc.n > 1 ? "s" : "") + " notée" + (sc.n > 1 ? "s" : "") + "</p></div>";
  var stack = '<div class="stack" role="img" aria-label="Répartition des réponses">' + SCALE.map(function (s) {
    var w = ids.length ? 100 * cn.c[s.v] / ids.length : 0;
    return '<span style="width:' + w + "%;background:" + COLORS[s.v] + '" title="' + s.label + " : " + cn.c[s.v] + '"></span>';
  }).join("") + "</div>";
  var legend = '<div class="legend">' + SCALE.map(function (s) { return '<span class="tnum"><i style="background:' + COLORS[s.v] + '"></i>' + s.label + " · " + cn.c[s.v] + "</span>"; }).join("") +
    '<span class="tnum"><i style="background:var(--line)"></i>Passées · ' + cn.skipped + "</span></div>";
  var themes = THEMES.map(function (t) {
    var tids = ids.filter(function (id) { return M[id].theme === t.id; }), r = score(tids, S.answers);
    return bar(t.name, r.pct, r.n);
  }).join("");
  var pharesBlock = "";
  if (S.mode === "full") {
    var pids = ids.filter(function (id) { return M[id].phare; }), oids = ids.filter(function (id) { return !M[id].phare; });
    var rp = score(pids, S.answers), ro = score(oids, S.answers);
    pharesBlock = '<div class="card"><h2>Mesures phares et autres mesures</h2><div class="bars">' + bar("Mesures phares", rp.pct, rp.n) + bar("Autres mesures", ro.pct, ro.n) + "</div></div>";
  }
  var ratedIds = ids.filter(function (id) { return rated(S.answers[id]); });
  var top = ratedIds.slice().sort(function (a, b) { return SCALE[S.answers[b]].w - SCALE[S.answers[a]].w; });
  var yes = top.filter(function (id) { return S.answers[id] === 5; }).slice(0, 5);
  var no = top.slice().reverse().filter(function (id) { return S.answers[id] === 0; }).slice(0, 5);
  function li(id) { return "<li>" + pill(S.answers[id]) + '<span><span class="muted small tnum">' + esc(themeName(M[id].theme)) + " n° " + M[id].no + " · </span>" + esc(M[id].text) + "</span></li>"; }
  var comm = ids.filter(function (id) { return S.comments[id]; });
  var commHtml = comm.length
    ? '<ul class="list">' + comm.map(function (id) { return "<li><div class=\"row\">" + pill(S.answers[id]) + '<span class="muted small">' + esc(themeName(M[id].theme)) + " n° " + M[id].no + "</span></div><span>" + esc(M[id].text) + '</span><span class="quote">' + esc(S.comments[id]) + "</span></li>"; }).join("") + "</ul>"
    : '<p class="muted">Tu n’as laissé aucun commentaire.</p>';
  var unfinished = cn.skipped > 0
    ? '<p class="small muted">Il reste ' + cn.skipped + " mesure" + (cn.skipped > 1 ? "s" : "") + " non notée" + (cn.skipped > 1 ? "s" : "") + ' dans cette version. <button class="btn ghost" data-act="goquiz" style="padding:4px 10px">Continuer à noter</button></p>'
    : "";
  var mod = S.mode === "full" ? "short" : "full";
  return header() +
    '<div class="card"><div class="row between"><div><h2>Rapport de ' + esc(S.name || "ton opinion") + '</h2><p class="muted small">Version ' + (S.mode === "full" ? "complète" : "courte") + "</p></div>" +
    '<button class="btn ghost" data-act="switchmode" data-mode="' + mod + '">Passer à la version ' + (mod === "full" ? "complète" : "courte") + "</button></div>" +
    gauge +
    '<p class="small muted" style="text-align:center">Calcul : d’accord = 100 %, plutôt d’accord = 75 %, neutre = 50 %, plutôt pas d’accord = 25 %, pas d’accord = 0 %. « Sans avis » et les mesures passées ne comptent pas.</p>' +
    '<div class="row" style="justify-content:center"><span class="simbig tnum">' + pctText(ag.pct) + '</span><span class="muted">des mesures notées reçoivent un accord (d’accord ou plutôt d’accord)</span></div>' +
    unfinished + "</div>" +
    '<div class="card"><h2>Répartition de tes réponses</h2>' + stack + legend + "</div>" +
    '<div class="card"><h2>Accord par thème</h2><div class="bars">' + themes + "</div></div>" +
    pharesBlock +
    '<div class="card"><h2>Tes accords les plus nets</h2>' + (yes.length ? '<ul class="list">' + yes.map(li).join("") + "</ul>" : '<p class="muted">Aucune mesure notée « D’accord » pour l’instant.</p>') + "</div>" +
    '<div class="card"><h2>Tes désaccords les plus nets</h2>' + (no.length ? '<ul class="list">' + no.map(li).join("") + "</ul>" : '<p class="muted">Aucune mesure notée « Pas d’accord » pour l’instant.</p>') + "</div>" +
    '<div class="card"><h2>Tes commentaires</h2>' + commHtml + "</div>" +
    '<div class="card"><h2>Partager et conserver</h2><p class="muted small">Copie ton code et envoie-le à tes proches : ils le collent dans l’onglet « Comparer ».</p>' +
    '<textarea class="codebox" id="mycode" readonly aria-label="Ton code de partage">' + esc(encodeCode(S.name || "Moi", S.answers, S.comments)) + "</textarea>" +
    '<div class="row"><button class="btn" data-act="copycode">Copier mon code</button><button class="btn ghost" data-act="copyreport">Copier le rapport en texte</button><button class="btn ghost" data-act="gocompare">Comparer avec des proches</button></div>' +
    '<p class="small muted" id="copymsg" role="status"></p>' +
    '<div class="row"><button class="btn ghost" data-act="reset" id="resetbtn">Effacer mes réponses</button></div></div>' +
    footer();
}

function peopleList() {
  var me = { name: S.name || "Moi", answers: S.answers, comments: S.comments, me: true };
  return [me].concat(S.others.map(function (o) {
    var d = decodeCode(o.code); d.code = o.code; return d;
  }));
}

function viewCompare() {
  var mine = encodeCode(S.name || "Moi", S.answers, S.comments);
  var ppl;
  try { ppl = peopleList(); } catch (e) { S.others = []; ppl = peopleList(); }
  var others = ppl.slice(1);
  var list = others.length
    ? others.map(function (p, k) { var nn = Object.keys(p.answers).length; return '<div class="who"><span><strong>' + esc(p.name) + '</strong> <span class="muted small tnum">' + nn + " mesures notées</span></span><button class=\"btn ghost\" data-act=\"removeother\" data-k=\"" + k + '">Retirer</button></div>'; }).join("")
    : '<p class="muted">Personne n’a encore été ajouté.</p>';
  var intro = '<div class="card"><h2>Comparer avec tes proches</h2><p class="muted">Chacun note de son côté, puis envoie son code (onglet « Mon rapport »). Colle ici les codes reçus : la comparaison se fait sur les mesures notées par les deux personnes.</p>' +
    '<label class="field" for="yourcode">Ton code<textarea class="codebox" id="yourcode" readonly>' + esc(mine) + "</textarea></label>" +
    '<div class="row"><button class="btn ghost" data-act="copycode2">Copier mon code</button><span class="small muted" id="copymsg" role="status"></span></div>' +
    '<label class="field" for="othercode">Code d’un proche<textarea class="codebox" id="othercode" placeholder="Colle ici un code qui commence par BM1."></textarea></label>' +
    '<div class="row"><button class="btn" data-act="addother">Ajouter cette personne</button><span class="error small" id="adderr" role="alert"></span></div>' +
    '<div class="bars" style="gap:8px">' + list + "</div></div>";
  if (!others.length) return header() + intro + footer();

  var sel = Math.min(S.cmpWith || 0, others.length - 1), other = others[sel];
  var simRows = others.map(function (p) {
    var s = similarity(S.answers, p.answers);
    return '<div class="barrow"><span class="name">' + esc(S.name || "Moi") + " et " + esc(p.name) + ' <span class="muted small tnum">(' + s.n + " mesures notées par les deux)</span></span><div class=\"track\"><i style=\"width:" + (s.pct === null ? 0 : s.pct) + '%"></i></div><span class="val tnum">' + pctText(s.pct) + "</span></div>";
  }).join("");
  var matrix = "";
  if (ppl.length > 2) {
    matrix = '<div class="card"><h2>Tous les duos</h2><div class="tablewrap"><table><thead><tr><th></th>' + ppl.map(function (p) { return "<th class=\"n\">" + esc(p.name) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      ppl.map(function (a, i) {
        return "<tr><th>" + esc(a.name) + "</th>" + ppl.map(function (b, j) { return "<td class=\"n\">" + (i === j ? "—" : pctText(similarity(a.answers, b.answers).pct)) + "</td>"; }).join("") + "</tr>";
      }).join("") + "</tbody></table></div></div>";
  }
  var themeRows = THEMES.map(function (t) {
    var tids = M.filter(function (m) { return m.theme === t.id; }).map(function (m) { return m.id; });
    return "<tr><th>" + esc(t.name) + "</th>" + ppl.map(function (p) { var r = score(tids, p.answers); return '<td class="n">' + pctText(r.pct) + "</td>"; }).join("") + "</tr>";
  }).join("");
  var overall = "<tr><th>Accord global</th>" + ppl.map(function (p) { var r = score(M.map(function (m) { return m.id; }), p.answers); return '<td class="n"><strong>' + pctText(r.pct) + "</strong></td>"; }).join("") + "</tr>";
  var themeTable = '<div class="card"><h2>Accord par thème, personne par personne</h2><div class="tablewrap"><table><thead><tr><th></th>' + ppl.map(function (p) { return '<th class="n">' + esc(p.name) + "</th>"; }).join("") + "</tr></thead><tbody>" + overall + themeRows + "</tbody></table></div></div>";

  var common = [];
  for (var id = 0; id < M.length; id++) { if (rated(S.answers[id]) && rated(other.answers[id])) common.push(id); }
  function diff(id) { return Math.abs(SCALE[S.answers[id]].w - SCALE[other.answers[id]].w); }
  var apart = common.filter(function (id) { return diff(id) >= 50; }).sort(function (a, b) { return diff(b) - diff(a); }).slice(0, 8);
  var together = common.filter(function (id) { return diff(id) === 0 && S.answers[id] !== 3; }).slice(0, 6);
  function row(id) {
    var cm = S.comments[id], co = other.comments[id];
    return "<li><span><span class=\"muted small tnum\">" + esc(themeName(M[id].theme)) + " n° " + M[id].no + " · </span>" + esc(M[id].text) + '</span><div class="row"><span class="small muted">' + esc(S.name || "Moi") + "</span>" + pill(S.answers[id]) + '<span class="small muted">' + esc(other.name) + "</span>" + pill(other.answers[id]) + "</div>" +
      (cm ? '<span class="quote">' + esc(S.name || "Moi") + " : " + esc(cm) + "</span>" : "") +
      (co ? '<span class="quote">' + esc(other.name) + " : " + esc(co) + "</span>" : "") + "</li>";
  }
  var picker = others.length > 1
    ? '<label class="field" for="cmpsel">Comparer en détail avec<select id="cmpsel">' + others.map(function (p, k) { return '<option value="' + k + '"' + (k === sel ? " selected" : "") + ">" + esc(p.name) + "</option>"; }).join("") + "</select></label>"
    : "";
  return header() + intro +
    '<div class="card"><h2>Proximité d’avis</h2><p class="muted small">100 % = mêmes réponses partout ; chaque cran d’écart (par exemple « D’accord » contre « Plutôt d’accord ») retire 25 points sur la mesure.</p><div class="bars">' + simRows + "</div></div>" +
    matrix + themeTable +
    '<div class="card"><h2>Détail : ' + esc(S.name || "Moi") + " et " + esc(other.name) + "</h2>" + picker +
    "<h3>Là où vous divergez le plus</h3>" + (apart.length ? '<ul class="list">' + apart.map(row).join("") + "</ul>" : '<p class="muted">Aucun écart important sur les ' + common.length + " mesures notées par vous deux.</p>") +
    "<h3>Là où vous êtes d’accord</h3>" + (together.length ? '<ul class="list">' + together.map(row).join("") + "</ul>" : '<p class="muted">Pas encore de réponse identique et tranchée.</p>') + "</div>" +
    footer();
}

function render() {
  app.innerHTML = S.view === "quiz" ? viewQuiz() : S.view === "report" ? viewReport() : S.view === "compare" ? viewCompare() : viewHome();
  window.scrollTo(0, 0);
}

/* ============ ACTIONS ============ */
function setAnswer(v) {
  var ids = idsFor(S.mode), id = ids[S.pos[S.mode]];
  if (S.answers[id] === v) delete S.answers[id]; else S.answers[id] = v;
  save();
  var cur = S.answers[id];
  app.querySelectorAll("[data-act=answer]").forEach(function (b) { b.setAttribute("aria-pressed", String(cur === Number(b.getAttribute("data-v")))); });
  var nx = app.querySelector("[data-act=next]");
  if (nx) nx.textContent = S.pos[S.mode] === ids.length - 1 ? "Voir mon rapport" : (cur === undefined ? "Passer →" : "Suivante →");
}
function step(d) {
  var ids = idsFor(S.mode), p = S.pos[S.mode] + d;
  if (p >= ids.length) { S.view = "report"; save(); render(); return; }
  S.pos[S.mode] = Math.max(0, p); save(); render();
}
function copyText(text, msgEl, okMsg) {
  var done = function (ok) { if (msgEl) msgEl.textContent = ok ? okMsg : "Copie impossible ici : sélectionne le texte dans la zone et copie-le à la main."; };
  try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
}

app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  if (act === "home") { S.view = "home"; render(); }
  else if (act === "theme") { S.theme = S.theme === "auto" ? "light" : S.theme === "light" ? "dark" : "auto"; save(); applyTheme(); }
  else if (act === "openinfo") {
    S.openInfo = !S.openInfo; save(); t.setAttribute("aria-pressed", String(S.openInfo));
    var dd = app.querySelector("details.more"); if (dd) dd.open = S.openInfo;
  }
  else if (act === "start") { S.mode = t.getAttribute("data-mode"); S.view = "quiz"; save(); render(); }
  else if (act === "goquiz") { S.view = "quiz"; render(); }
  else if (act === "goreport") { S.view = "report"; render(); }
  else if (act === "gocompare") { S.view = "compare"; render(); }
  else if (act === "answer") { setAnswer(Number(t.getAttribute("data-v"))); }
  else if (act === "next") { step(1); }
  else if (act === "prev") { step(-1); }
  else if (act === "switchmode") { S.mode = t.getAttribute("data-mode"); save(); render(); }
  else if (act === "copycode") { copyText(document.getElementById("mycode").value, document.getElementById("copymsg"), "Code copié. Envoie-le à tes proches."); }
  else if (act === "copycode2") { copyText(document.getElementById("yourcode").value, document.getElementById("copymsg"), "Code copié."); }
  else if (act === "copyreport") { copyText(reportText(), document.getElementById("copymsg"), "Rapport copié en texte."); }
  else if (act === "reset") {
    if (t.getAttribute("data-armed")) { S.answers = {}; S.comments = {}; S.pos = { short: 0, full: 0 }; save(); S.view = "home"; render(); }
    else { t.setAttribute("data-armed", "1"); t.textContent = "Confirmer l’effacement de toutes mes réponses"; }
  }
  else if (act === "addother") {
    var box = document.getElementById("othercode"), err = document.getElementById("adderr");
    try {
      var d = decodeCode(box.value);
      var code = box.value.trim().replace(/\s+/g, "");
      var at = -1;
      S.others.forEach(function (o, k) { try { if (decodeCode(o.code).name === d.name) at = k; } catch (x) {} });
      if (at >= 0) S.others[at] = { code: code }; else S.others.push({ code: code });
      save(); render();
    } catch (ex) { err.textContent = ex.message; }
  }
  else if (act === "removeother") { S.others.splice(Number(t.getAttribute("data-k")), 1); S.cmpWith = 0; save(); render(); }
});
app.addEventListener("input", function (e) {
  if (e.target.id === "name") { S.name = e.target.value.slice(0, 40); save(); }
  else if (e.target.id === "comment") {
    var ids = idsFor(S.mode), id = ids[S.pos[S.mode]], val = e.target.value.trim();
    if (val) S.comments[id] = e.target.value.slice(0, 500); else delete S.comments[id];
    save();
  }
});
app.addEventListener("change", function (e) {
  if (e.target.id === "cmpsel") { S.cmpWith = Number(e.target.value); render(); }
});
document.addEventListener("keydown", function (e) {
  if (S.view !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || tag === "select") return;
  if (e.key >= "1" && e.key <= "5") { setAnswer(RAIL[Number(e.key) - 1]); }
  else if (e.key === "0") { setAnswer(2); }
  else if (e.key === "ArrowRight") { step(1); }
  else if (e.key === "ArrowLeft") { step(-1); }
});

render();
</script>
</body>
</html>
