e les plastiques","Le traité sur la haute mer a été adopté en 2023, tandis que les négociations sur un traité contre la pollution plastique n’avaient pas abouti à la fin 2025. La France soutient un moratoire sur l’exploitation minière des grands fonds. Ses critiques s’inquiètent des coûts pour l’industrie."],["Approfondir le droit international de la biodiversité marine, notamment dans les grands fonds","L’Autorité internationale des fonds marins, installée en Jamaïque, gère les règles d’exploitation minière hors des eaux nationales. Ses partisans veulent un cadre protecteur ; ses critiques redoutent un frein à l’accès à des métaux critiques."],["Proposer d’accueillir la deuxième COP « Océans » en France en 2028","La conférence des Nations unies sur l’océan s’est tenue à Nice en 2025, et la suivante est prévue en 2028 dans d’autres pays. Ses partisans veulent maintenir l’élan ; ses critiques s’interrogent sur l’intérêt de multiplier les sommets."],["Renforcer l’OMI pour viser la neutralité carbone du transport maritime en 2050 et améliorer les conditions sociales des marins","L’Organisation maritime internationale a adopté en 2023 un objectif de neutralité carbone vers 2050. Ses partisans veulent des règles contraignantes ; ses critiques redoutent des surcoûts pour le commerce mondial."],["Poursuivre la cartographie de l’espace maritime français avec le SHOM et l’extension du plateau continental","La France a déjà obtenu des extensions de son plateau continental grâce à un programme scientifique dédié. Ses partisans veulent consolider ses droits ; ses critiques évoquent le coût et les différends possibles avec des voisins."],["Lutter contre la course à l’armement spatial tout en préservant la souveraineté française face aux nouvelles menaces","Les grandes puissances développent des moyens de défense dans l’espace, dont des armes antisatellites. Ses partisans veulent un cadre de limitation ; ses critiques soulignent le besoin de protéger les satellites français."],["Fermer le centre spatial de l’OTAN à Toulouse","L’OTAN a inauguré en 2023 un centre d’excellence spatial à Toulouse. Ses partisans veulent éviter la militarisation de l’espace ; ses critiques y voient un atout pour la coordination des alliés."],["Organiser des missions dans le système solaire et assurer la participation française à ces missions","La France participe à ces missions à travers le CNES et l’Agence spatiale européenne. Ses partisans veulent amplifier cet effort scientifique ; ses critiques s’interrogent sur les priorités budgétaires."],["Proposer un traité interdisant l’appropriation des ressources spatiales et démilitarisant l’espace, que la France ratifierait","Le traité de l’espace de 1967 interdit déjà l’appropriation nationale des corps célestes et le stationnement d’armes nucléaires en orbite. Ses partisans veulent aller plus loin ; ses critiques soulignent la difficulté d’obtenir un accord."],["Retirer la France des accords Artemis et inviter d’autres signataires à faire de même","La France a signé en 2022 les accords Artemis, dirigés par les États-Unis, sur l’exploration lunaire. Ses partisans y voient une alliance dominée par Washington ; ses défenseurs y voient une coopération utile."],["Promouvoir un programme international de dépollution de l’orbite basse, porté par les Nations unies","Les débris spatiaux menacent les satellites, et la France a adopté une loi sur les opérations spatiales en 2008. Ses partisans veulent une action collective ; ses critiques soulignent l’absence de technologies abouties."],["Encourager la coopération entre États pour développer des solutions numériques indépendantes des GAFAM","Plusieurs projets européens, comme Gaia-X, ont tenté de construire une offre souveraine. Ses partisans veulent réduire la dépendance ; ses critiques soulignent le retard sur les géants américains."],["Sortir la France de l’isolement occidental, rejeter le « choc des civilisations » et promouvoir une diplomatie non alignée et des droits humains universels","La France fait partie de l’OTAN et de l’Union européenne, avec une tradition de politique étrangère indépendante. Ses partisans veulent une voie non alignée ; ses critiques estiment que l’alliance occidentale est nécessaire à la sécurité."],["Renforcer le « Front du refus » face à la stratégie belliciste américaine, en devenant le premier membre permanent du Conseil de sécurité à le rejoindre","Cette formule désigne un ensemble de pays opposés à certaines politiques américaines. Ses partisans veulent un rapprochement diplomatique avec ces États ; ses critiques redoutent un alignement avec des régimes autoritaires."],["Lancer la formation d’une nouvelle entente altermondialiste","Il s’agit de bâtir une coalition d’États et de mouvements en faveur d’un autre ordre mondial. Ses partisans veulent peser autrement dans le monde ; ses critiques s’interrogent sur sa faisabilité."],["Rétablir le réseau diplomatique français et mettre fin à l’alignement de l’UE sur l’atlantisme","Le Quai d’Orsay a vu ses effectifs et son réseau réduits au fil des années. Ses partisans veulent restaurer ses moyens ; ses critiques s’interrogent sur le coût et la place de l’UE avec les États-Unis."],["Relancer le désarmement nucléaire et conventionnel à la Conférence du désarmement de l’ONU, et participer comme observateur au TIAN","Le traité d’interdiction des armes nucléaires est entré en vigueur en 2021 ; la France, puissance nucléaire, ne l’a pas signé. Ses partisans veulent réduire les arsenaux ; ses critiques défendent la dissuasion."],["Définir avec la communauté internationale une doctrine de protection des sites nucléaires en zones de guerre, avec l’ONU et l’AIEA","La centrale de Zaporijia, en Ukraine, a été occupée et touchée par des combats depuis 2022. Ses partisans veulent un cadre protecteur ; ses critiques soulignent la difficulté de le faire respecter."],["Porter à l’ONU des initiatives sur les nouveaux armements : démilitarisation de l’espace et encadrement des SALA","Les systèmes d’armes létaux autonomes, parfois appelés robots tueurs, font l’objet de discussions à l’ONU sans traité contraignant. Ses partisans veulent un encadrement strict ; ses critiques redoutent un désavantage militaire."],["Refuser toute intervention militaire sans mandat clair de l’ONU et rétablir l’autorité du Comité d’état-major des Nations unies","Le Comité d’état-major prévu par la Charte n’a jamais fonctionné comme prévu depuis la guerre froide. Ses partisans veulent un cadre multilatéral strict ; ses critiques soulignent la paralysie fréquente du Conseil de sécurité."],["Créer une organisation mondiale de l’environnement, défendre l’Unesco et faire en sorte que l’OMS s’affranchisse de l’industrie pharmaceutique","L’OMS est financée en grande partie par des contributions volontaires, y compris privées. Ses partisans veulent un financement public stable ; ses critiques s’interrogent sur les États prêts à payer."],["Réformer le Conseil de sécurité et l’Assemblée générale de l’ONU pour qu’ils représentent le monde actuel","La France soutient un élargissement du Conseil de sécurité, mais la réforme exige l’accord des membres permanents. Ses partisans veulent plus de représentativité ; ses critiques soulignent la difficulté de s’entendre."],["Soutenir l’action de l’ONU, dont l’UNRWA, et renforcer sa présence au Liban","L’UNRWA est l’agence de l’ONU pour les réfugiés palestiniens, et Israël en a interdit l’activité sur son territoire en 2025. La France participe à la force de l’ONU au Liban. Ses partisans veulent la soutenir ; ses critiques contestent ses liens présumés avec le Hamas."],["Construire, sous l’égide de l’ONU, des solutions politiques là où la paix n’est pas garantie, du Proche-Orient au Caucase","Plusieurs conflits restent en cours dans ces régions. Ses partisans veulent un rôle accru de l’ONU ; ses critiques soulignent les limites de son influence."],["Imposer en Palestine un cessez-le-feu durable, la fin du blocus de Gaza, et mettre fin à la colonisation et à l’annexion en Cisjordanie, à Jérusalem-Est et au Golan","Gaza a connu une guerre dévastatrice depuis octobre 2023, suivie de cessez-le-feu fragiles. Ses partisans invoquent le droit international ; ses critiques mettent en avant la sécurité d’Israël."],["S’opposer à la guerre d’Israël au Liban et à ses projets d’annexion","Israël a mené une offensive au Liban en 2024. Ses partisans veulent une pression diplomatique ; ses critiques soulignent la menace du Hezbollah."],["Défendre la souveraineté de l’État de Palestine sur les territoires palestiniens occupés depuis 1967","La France a reconnu l’État de Palestine en septembre 2025. Ses partisans voient une solution à deux États ; ses critiques estiment que les conditions ne sont pas réunies."],["Examiner d’autres voies pour les droits des Palestiniens, comme un État binational égalitaire, portées par la société civile palestinienne","L’idée d’un État commun est défendue par une minorité, face à la solution à deux États, soutenue par la communauté internationale. Ses partisans veulent ouvrir le débat ; ses critiques redoutent la remise en cause d’Israël comme État juif."],["Soutenir l’élection d’une assemblée et la formation d’un gouvernement palestinien unique pour tous les territoires palestiniens","Les territoires sont divisés entre l’Autorité palestinienne en Cisjordanie et le Hamas à Gaza. Ses partisans veulent des élections ; ses critiques soulignent les conditions de sécurité."],["Multiplier les efforts diplomatiques pour relancer le processus de paix sur la base des résolutions de l’ONU","Le processus d’Oslo, lancé en 1993, est au point mort depuis des années. Ses partisans veulent une relance multilatérale ; ses critiques doutent de la volonté des parties."],["Engager à l’ONU des négociations pour un nouvel accord sur le nucléaire iranien","L’accord de 2015 a été abandonné par les États-Unis en 2018, et les sanctions de l’ONU ont été rétablies en 2025 à l’initiative des Européens. Ses partisans veulent une voie diplomatique ; ses critiques redoutent un Iran proche de l’arme nucléaire."],["Cesser tout soutien aux paramilitaires au Soudan, apporter une aide humanitaire, obtenir un cessez-le-feu et juger les criminels de guerre","Une guerre oppose l’armée soudanaise aux Forces de soutien rapide depuis 2023, avec une crise humanitaire majeure. Ses partisans veulent une action internationale ; ses critiques soulignent l’influence limitée de la France."],["Créer un tribunal international de justice économique pour juger les crimes financiers transnationaux","Il n’existe pas de juridiction internationale pour les crimes financiers. Ses partisans veulent combler ce vide ; ses critiques soulignent la souveraineté des États."],["Soutenir les négociations d’un traité obligeant les multinationales à respecter les droits humains et l’environnement","Un traité contraignant est en discussion à l’ONU depuis 2014. Ses partisans veulent un cadre mondial ; ses critiques redoutent une charge pour les entreprises."],["Mener des politiques internationales depuis les Outre-mer, pour préserver l’Amazonie et aider les peuples autochtones menacés","La Guyane partage une frontière avec le Brésil et le Suriname. Ses partisans veulent s’appuyer sur ce lien régional ; ses critiques soulignent les compétences limitées des territoires."],["Faire des Outre-mer des pôles régionaux de codéveloppement, avec transferts de technologies, formations et coopération de maintien de la paix","Les territoires ultramarins sont proches de zones en développement. Ses partisans veulent en faire des relais ; ses critiques évoquent le coût."],["Rejoindre les coopérations régionales : CELAC pour les Antilles et la Guyane, Union africaine pour Mayotte, CDAA pour La Réunion, et participer à l’IORA","Certains territoires ont déjà un statut de membre associé ou d’observateur dans des organisations régionales. Ses partisans veulent une pleine intégration ; ses critiques soulignent les contraintes juridiques."],["Garantir la paix dans l’océan Indien par des accords de co-souveraineté avec Maurice autour de Tromelin et Madagascar autour des îles Éparses","Un accord de cogestion de Tromelin avec Maurice a été signé en 2010 sans être ratifié. Ses partisans veulent apaiser les différends ; ses critiques défendent la souveraineté française."],["Relancer le codéveloppement et la coopération, notamment dans la lutte contre le changement climatique","Le codéveloppement associe l’aide au développement et les migrations. Ses partisans veulent des partenariats équilibrés ; ses critiques s’interrogent sur les moyens."],["Appuyer la restructuration des dettes souveraines","Le cadre commun du G20 de 2020 a traité quelques cas avec lenteur. Ses partisans veulent des procédures plus rapides ; ses critiques redoutent un aléa moral."],["Réformer l’AFD pour qu’elle serve les sociétés civiles locales, et non les régimes oligarchiques ou les partenariats public-privé","L’Agence française de développement finance des projets dans de nombreux pays. Ses partisans veulent mieux contrôler ses bénéficiaires ; ses critiques soulignent l’intérêt de partenariats avec les États."],["Organiser des moyens d’intervention sous-marins à des fins de recherche","L’Ifremer dispose déjà de sous-marins et de robots d’exploration. Ses partisans veulent amplifier cette capacité ; ses critiques évoquent le coût."],["Renforcer l’aide au développement au Sahel en la conditionnant au respect des droits humains, démocratiques, sociaux et écologiques","Les forces françaises se sont retirées du Mali en 2022, du Burkina Faso et du Niger en 2023, puis du Tchad en 2025. Ses partisans veulent conditionner l’aide ; ses critiques redoutent un effet contre-productif."],["Réviser les accords de défense avec les pays africains pour qu’ils servent les peuples et excluent toute ingérence","La France maintient des bases militaires dans quelques pays africains, en réduction. Ses partisans veulent des relations plus égales ; ses critiques s’inquiètent du vide laissé à d’autres puissances."],["Mettre fin au franc CFA au profit d’une monnaie souveraine dont les pays africains seraient seuls maîtres","Le franc CFA est rattaché à l’euro avec une garantie du Trésor français ; la réforme annoncée en 2019 prévoit de rebaptiser la monnaie ouest-africaine « eco », sans être entrée en vigueur. Ses partisans parlent de tutelle ; ses défenseurs, de stabilité."],["Annuler les dettes « odieuses » contractées par des dictatures pour enrichir le clan au pouvoir","La doctrine de la dette odieuse date des années 1920. Ses partisans veulent l’appliquer ; ses critiques soulignent la difficulté juridique de la définir."],["Exiger que la BCE annule la dette des États qu’elle détient ou la transforme en dette perpétuelle à taux nul","Un appel d’économistes de 2021 a défendu cette idée. Le droit européen interdit le financement monétaire des États, et ce point est juridiquement contesté. Ses partisans veulent alléger les dettes ; ses critiques redoutent un risque pour la monnaie."],["Interdire à la BCE de revendre sur les marchés la dette des États qu’elle détient","La BCE a réduit son bilan depuis 2022, en laissant échoir une partie de ses titres. Ses partisans veulent éviter une pression sur les taux ; ses critiques soulignent la discipline de marché."],["Reprendre, sans modifier les traités, les rachats de dettes souveraines par la BCE, comme en 2015 et 2020","La BCE a lancé un programme d’achats de titres en 2015, puis un autre en 2020 lors de la pandémie. Ses partisans veulent les reprendre ; ses critiques redoutent l’inflation."],["Refuser les grands plans de dérégulation « omnibus », comme ceux touchant le devoir de vigilance ou les pesticides","La Commission européenne a lancé en 2025 des paquets de simplification des obligations des entreprises. Ses partisans y voient un recul social et écologique ; ses défenseurs, un allègement administratif."],["Faire voter par le Parlement la suspension de certaines règles européennes, le temps de leur révision, si elles font obstacle au programme","Cette suspension irait à l’encontre de la primauté du droit européen reconnue par la Cour de justice. Ses partisans veulent un moratoire démocratique ; ses critiques redoutent des sanctions."],["Inclure dans ce moratoire le semestre européen, qui impose une surveillance budgétaire et des politiques d’austérité","Le semestre européen, créé en 2011, coordonne les budgets des États. Ses partisans le jugent austéritaire ; ses défenseurs y voient un cadre de discipline commune."],["Appliquer immédiatement le programme au niveau national, assumer le conflit avec les institutions européennes, utiliser les leviers du Conseil européen et désobéir aux règles bloquantes si nécessaire","Cette stratégie de désobéissance vise à faire plier les institutions. Ses partisans parlent de souveraineté démocratique ; ses critiques redoutent des sanctions et une crise financière."],["Proposer de nouveaux traités garantissant la souveraineté budgétaire des parlements nationaux","Un changement de traité exige l’unanimité des vingt-sept États. Ses partisans veulent redonner la main aux parlements ; ses critiques soulignent le risque de blocage."],["Préciser et organiser la clause de défense mutuelle entre États membres","L’article 42.7 du traité sur l’Union européenne prévoit une assistance entre États membres en cas d’agression. Ses partisans veulent en préciser les modalités ; ses critiques estiment que l’OTAN reste le cadre principal."],["Mettre fin au resserrement monétaire de la BCE et reprendre ses rachats de dettes publiques, au service de l’intérêt général","La BCE a relevé fortement ses taux en 2022-2023 pour lutter contre l’inflation, avant de les baisser à partir de 2024. Ses partisans critiquent le coût pour l’économie ; ses défenseurs, la stabilité des prix."],["Instaurer une harmonisation fiscale et sociale par le haut, notamment en étendant la clause de la nation la plus favorisée à tous les domaines","Cette clause permettrait à chaque pays de s’aligner sur les meilleurs niveaux de protection existants. Ses partisans veulent éviter le dumping social ; ses critiques redoutent une hausse des coûts."],["Introduire des protections douanières et un impôt sur les multinationales dans le prochain budget européen","La Commission a proposé de nouvelles ressources propres pour le budget 2028-2034, dont le mécanisme carbone aux frontières. Ses partisans veulent renforcer le budget commun ; ses critiques s’opposent à de nouveaux prélèvements."],["Placer la BCE sous contrôle démocratique et la mobiliser pour financer la bifurcation écologique et sociale des États","La BCE est indépendante en vertu des traités, avec pour objectif principal la stabilité des prix. Ses partisans veulent élargir son mandat ; ses critiques défendent son indépendance."],["Mettre en place des règles d’harmonisation sociale, fiscale et écologique au sein de l’Union","L’Union a déjà adopté un impôt minimum mondial de 15 % sur les multinationales en 2022. Ses partisans veulent aller plus loin ; ses critiques défendent la concurrence fiscale."],["Organiser la sortie coordonnée du marché européen de l’énergie","Le prix de l’électricité en Europe suit la logique du marché, avec une réforme adoptée en 2023. Ses partisans veulent un prix lié aux coûts de production ; ses critiques soulignent les interconnexions et la sécurité d’approvisionnement."]],"san":[["Assurer la gratuité de l’accueil scolaire et des soins publics, et rebâtir les hôpitaux et structures soignantes","L’hôpital public manque de lits et de personnel dans de nombreuses régions. Ses partisans veulent un plan de reconstruction ; ses critiques s’interrogent sur son coût et sur la répartition entre public et privé."],["Combattre le cadmium dans les engrais et l’alimentation, réduire la pollution existante et suivre les personnes exposées","Le cadmium est un métal présent dans certains engrais phosphatés, dont la teneur est limitée de façon progressive par le droit européen. Ses partisans veulent une limite plus stricte ; ses critiques soulignent les contraintes pour les agriculteurs."],["Imposer une évaluation santé-environnement pour les projets d’infrastructure et les lois","Des études d’impact existent déjà pour de nombreux projets. Ses partisans veulent y intégrer la santé de façon systématique ; ses critiques redoutent la lourdeur et les délais."],["Éradiquer les maladies chroniques dues aux pollutions (pesticides, radioactivité, amiante, produits chimiques)","Certaines maladies sont reconnues comme professionnelles ou environnementales, mais le lien causal est souvent difficile à établir. Ses partisans veulent un objectif ambitieux ; ses critiques le jugent peu réaliste."],["Lancer un plan national contre les perturbateurs endocriniens visant une exposition nulle","Une stratégie nationale contre les perturbateurs endocriniens existe depuis 2019. Ses partisans veulent un objectif d’exposition nulle ; ses critiques parlent de difficulté technique et de coûts pour l’industrie."],["Appliquer le principe de précaution sanitaire en interdisant les substances dangereuses avérées, suspectées ou présumées","Le principe de précaution figure dans la Charte de l’environnement depuis 2005. Ses partisans veulent l’appliquer largement ; ses critiques craignent un frein à l’innovation."],["Doubler le budget du programme de recherche environnement-santé-travail et publier ses enquêtes","Un programme national de recherche, animé par l’Anses, finance ces travaux. Ses partisans veulent plus de moyens et de transparence ; ses critiques évoquent les priorités budgétaires."],["Renforcer l’Institut national du cancer et déployer réellement le registre national des cancers","Les registres des cancers ne couvrent aujourd’hui qu’une partie du territoire. Ses partisans veulent un registre complet ; ses critiques évoquent la protection des données et le coût."],["Former massivement les soignants au dépistage, à la prévention des maladies environnementales et au suivi des plus fragiles","La prévention occupe une place limitée dans la formation initiale des soignants. Ses partisans veulent la renforcer ; ses critiques soulignent la surcharge des cursus."],["Introduire un questionnaire allergique lors des visites de médecine scolaire et du travail","La médecine scolaire manque de personnel dans de nombreux territoires. Ses partisans y voient un moyen de repérer les allergies ; ses critiques évoquent la faisabilité."],["Classer les épidémies et pandémies parmi les catastrophes naturelles","Le régime des catastrophes naturelles, financé par une surprime d’assurance, ne couvre pas les épidémies. Ses partisans veulent une indemnisation systématique ; ses critiques redoutent un coût considérable."],["Élaborer un plan d’adaptation aux pandémies et zoonoses fondé sur la planification sanitaire","La pandémie de Covid-19 a mis en évidence des stocks insuffisants et une préparation inégale. Ses partisans veulent une planification durable ; ses critiques évoquent le coût d’une préparation permanente."],["Garantir l’approvisionnement d’une réserve stratégique de médicaments essentiels","Depuis 2023, des stocks de sécurité sont exigés pour certains médicaments d’intérêt thérapeutique majeur. Ses partisans veulent les étendre ; ses critiques soulignent le coût et la gestion des péremptions."],["Reconstruire la capacité de fabrication de médicaments dans les pharmacies hospitalières","Les pharmacies hospitalières produisent déjà des préparations, mais à petite échelle. Ses partisans veulent un filet de sécurité en cas de pénurie ; ses critiques s’interrogent sur la rentabilité."],["Contrôler les prix de tous les produits de santé et rendre publics leurs coûts réels","Les prix des médicaments remboursés sont fixés par un comité interministériel, avec des remises confidentielles. Ses partisans réclament la transparence ; ses critiques évoquent le secret industriel."],["Produire et diffuser largement les vaccins et traitements placés sous licence d’office","La licence d’office permet à l’État de produire un médicament sans l’accord du détenteur du brevet, en cas d’urgence. Ses partisans veulent y recourir ; ses critiques redoutent un effet sur la recherche."],["Financer la recherche publique sur les antibiotiques et l’antibiorésistance","L’antibiorésistance est une menace majeure selon l’OMS, alors que peu de nouveaux antibiotiques sont développés. Ses partisans veulent un financement public ; ses critiques soulignent les coûts de recherche."],["Développer une production publique de biomédicaments, notamment contre le cancer","Les biomédicaments sont produits à partir d’organismes vivants et coûtent cher. Ses partisans veulent une production publique pour réduire les prix ; ses critiques soulignent la complexité industrielle."],["Créer un ministère de la Production alimentaire","L’alimentation relève aujourd’hui de plusieurs ministères, dont l’Agriculture et la Santé. Ses partisans veulent une politique unifiée ; ses critiques redoutent une réorganisation inutile."],["Interdire en urgence les additifs dangereux, en se limitant à ceux autorisés en agriculture biologique","L’UE a interdit le dioxyde de titane (E171) dans l’alimentation en 2022, la France l’ayant fait dès 2020. Ses partisans veulent restreindre largement les additifs ; ses critiques soulignent les besoins de conservation."],["Plafonner sel, sucre et acides gras saturés dans les aliments transformés et faire respecter la loi outre-mer","La loi Lurel de 2013 impose que la teneur en sucre des produits en outre-mer ne dépasse pas celle de l’Hexagone. Ses partisans veulent des plafonds contraignants ; ses critiques défendent l’autorégulation de l’industrie."],["Passer la restauration collective et scolaire à 100 % bio et locale, avec plus de protéines végétales et un repas végétarien quotidien","La loi Egalim fixe un objectif de 20 % de produits bio en restauration collective. Ses partisans veulent aller plus loin ; ses critiques soulignent le coût pour les communes."],["Reconstruire le service public hospitalier et mobiliser tous les leviers contre les déserts médicaux","Plusieurs millions de personnes vivent dans des zones à accès réduit aux soins. Ses partisans veulent des mesures fortes ; ses critiques soulignent le manque de médecins, quelles que soient les mesures."],["Remplacer l’ONDAM par un objectif national fondé sur les besoins, l’ONBAM","L’Ondam est l’objectif de dépenses d’assurance maladie voté chaque année par le Parlement. Ses partisans le jugent trop contraignant ; ses défenseurs y voient un outil de maîtrise des dépenses."],["Rendre transparents le nombre de décès et de complications liés au manque de moyens hospitaliers","Aucun indicateur officiel ne mesure ces décès. Ses partisans veulent informer le public ; ses critiques soulignent la difficulté d’établir un lien de causalité."],["Rouvrir progressivement urgences, maternités et EHPAD publics, accessibles en moins de 30 minutes","Plusieurs maternités et services d’urgences ont fermé ou limité leur activité ces dernières années. Ses partisans parlent d’égalité d’accès ; ses critiques évoquent la sécurité des soins et le manque de personnel."],["Engager un plan pluriannuel de recrutement de soignants et de personnels du médico-social","Les hôpitaux et les établissements médico-sociaux peinent à recruter. Ses partisans veulent un plan ambitieux ; ses critiques notent que les candidats manquent aussi."],["Revaloriser les métiers et salaires du soin, ainsi que la tarification de certains actes infirmiers libéraux","Le Ségur de la santé de 2020 a accordé une hausse de 183 euros nets par mois à une partie des personnels. Ses partisans réclament davantage ; ses critiques évoquent le coût pour l’Assurance maladie."],["Mailler le territoire de centres de santé salariés et de maisons de santé pluriprofessionnelles","Les centres de santé emploient des médecins salariés, tandis que les maisons de santé regroupent des libéraux. Ses partisans veulent en créer davantage ; ses critiques soulignent le coût."],["Embaucher des médecins publics","Des postes de praticiens hospitaliers restent vacants. Ses partisans veulent attirer plus de médecins vers le public ; ses critiques évoquent les rémunérations."],["Réinstaurer l’obligation pour tous les médecins d’assurer la permanence des soins dans chaque département","Depuis 2002, la permanence des soins repose sur le volontariat des médecins libéraux. Ses partisans veulent rétablir l’obligation ; ses critiques redoutent un effet sur les vocations."],["Augmenter les places en faculté de médecine et créer des écoles normales de la santé et du social","Le numerus clausus a été remplacé en 2020 par un nombre de places fixé par les universités. Ses partisans veulent plus de formations ; ses critiques soulignent la capacité d’encadrement."],["Généraliser les contrats d’études dans les formations médicales et paramédicales","Les contrats d’engagement de service public existent déjà et offrent une allocation en échange d’une installation en zone sous-dotée. Ses partisans veulent les étendre ; ses critiques redoutent des contraintes."],["Combattre les déserts pharmaceutiques grâce à un réseau de pharmacies communautaires","Les pharmacies d’officine ferment dans certaines zones rurales. Ses partisans veulent un réseau public ; ses critiques défendent le modèle libéral des pharmaciens."],["Permettre l’exercice pérenne des médecins diplômés hors UE via la reconnaissance de leurs équivalences","De nombreux médecins étrangers exercent à l’hôpital dans des conditions précaires, en attendant une autorisation d’exercice. Ses partisans veulent simplifier la procédure ; ses critiques soulignent le contrôle des compétences."],["Protéger la santé de la financiarisation en interdisant aux fonds de capital-investissement de détenir des structures","Des fonds d’investissement ont pris des participations dans des cliniques, laboratoires ou centres d’imagerie. Ses partisans dénoncent une logique de rentabilité ; ses critiques mettent en avant les investissements apportés."],["Renforcer le maillage et les moyens des centres médico-psychologiques et médico-psycho-pédagogiques","Les centres médico-psychologiques accueillent gratuitement les patients, mais avec des délais d’attente importants. Ses partisans veulent plus de moyens ; ses critiques évoquent le manque de professionnels."],["Élargir le conventionnement des psychologues par la Sécu au-delà de 12 séances, remboursées à 100 %","Le dispositif MonSoutienPsy limite le nombre de séances remboursées chaque année. Ses partisans veulent un remboursement plus large ; ses critiques redoutent un coût élevé."],["Augmenter les places de médecine dans la filière psy et créer des formations délocalisées d’infirmiers spécialisés","La psychiatrie manque de médecins, notamment en pédopsychiatrie. Ses partisans veulent des formations dans les territoires ; ses critiques évoquent la difficulté à recruter."],["Donner aux soignants les moyens d’abolir la contention et l’isolement au profit de pratiques respectueuses","Le recours à l’isolement et à la contention est encadré par la loi depuis 2022, après une décision du Conseil constitutionnel. Ses partisans veulent y mettre fin ; ses critiques soulignent les situations de crise."],["Lancer un plan national de prévention des troubles des conduites alimentaires","Les troubles des conduites alimentaires touchent surtout les jeunes. Ses partisans veulent une prévention précoce ; ses critiques s’interrogent sur les moyens."],["Consacrer les recettes des taxes sur le cannabis à la prévention, à la réduction des risques et à la désintoxication","Cette mesure suppose la légalisation décrite plus haut. Ses partisans veulent affecter les recettes à la santé ; ses critiques contestent la légalisation elle-même."],["Confier le pilotage de la lutte contre les drogues au ministère de la Santé plutôt qu’à l’Intérieur","La Mission interministérielle de lutte contre les drogues relève du Premier ministre. Ses partisans veulent une approche de santé publique ; ses critiques défendent la dimension répressive."],["Viser une jeunesse « zéro tabac » grâce à la prévention précoce, la substitution et la lutte contre les multinationales du tabac","Le tabac provoque environ 75 000 décès par an en France. Ses partisans veulent un objectif ambitieux ; ses critiques soulignent la liberté individuelle et le commerce illicite."],["Intégrer la médecine du travail au service public et rétablir les visites obligatoires, y compris pendant le chômage","La médecine du travail est assurée par des services interentreprises financés par les employeurs. Ses partisans veulent un service public ; ses critiques évoquent le coût."],["Mettre fin à la répression des médecins qui prescrivent des arrêts de travail","L’Assurance maladie peut contrôler les médecins prescrivant beaucoup d’arrêts. Ses partisans dénoncent une pression ; ses critiques mettent en avant la lutte contre les abus."],["Supprimer franchises, participations forfaitaires et frais annexes, comme le stationnement payant à l’hôpital","Les franchises médicales ont été relevées en 2024 pour financer l’Assurance maladie. Ses partisans veulent un accès sans reste à charge ; ses critiques évoquent le coût."],["Expérimenter une Sécurité sociale de l’alimentation garantissant l’accès à des aliments choisis","Des expérimentations locales existent, avec une cotisation et une carte alimentaire. Ses partisans y voient un moyen de lutter contre la précarité alimentaire ; ses critiques s’interrogent sur le financement."],["Améliorer l’accès des femmes à la santé et à leur prise en charge","Les maladies des femmes sont parfois moins bien repérées, comme l’endométriose. Ses partisans veulent une meilleure prise en charge ; ses critiques demandent des mesures précises."],["Garantir le droit à la santé des enfants, y compris leur santé mentale","La pédopsychiatrie connaît de longs délais d’attente. Ses partisans veulent un investissement massif ; ses critiques évoquent le manque de professionnels."],["Développer un réseau public de maisons de retraite aux tarifs harmonisés et accessibles","Le coût d’un EHPAD dépasse souvent les pensions moyennes. Ses partisans veulent un réseau public à tarif accessible ; ses critiques évoquent le coût."],["Recruter et former assez de personnel pour garantir un ratio minimal d’encadrement auprès des résidents","Un ratio minimal a été réclamé après le scandale Orpea. Ses partisans veulent l’inscrire dans la loi ; ses critiques soulignent le manque de candidats."],["Humaniser la culture des EHPAD, centrée sur la personne et ses liens sociaux, avec des structures comme les « villages Alzheimer »","Le village Landais Alzheimer, ouvert à Dax en 2020, propose un cadre de vie plus ouvert. Ses partisans veulent s’en inspirer ; ses critiques soulignent leur coût."],["Collectiviser les EHPAD privés à but lucratif et les confier à des associations ou coopératives","Les groupes privés lucratifs gèrent une part importante des EHPAD. Ses partisans veulent supprimer le profit ; ses critiques évoquent le coût et le risque juridique."],["Créer des équipes soignantes à domicile pour mettre fin aux traitements inhumains des personnes âgées","Des services de soins à domicile existent, mais leurs moyens varient. Ses partisans veulent un meilleur suivi ; ses critiques évoquent le coût."],["Faire prendre en charge par la Sécu l’ensemble des dispositifs médicaux du quotidien","Certains dispositifs, comme les lunettes ou les prothèses, sont partiellement remboursés. Ses partisans veulent un remboursement total ; ses critiques évoquent le coût."],["Réformer le don de gamètes pour une gestion nationale fiable et des stocks équilibrés","Le don de gamètes est géré par des centres spécialisés, avec des délais d’attente. Depuis 2022, les enfants nés d’un don peuvent accéder à leurs origines à leur majorité. Ses partisans veulent une organisation nationale ; ses critiques évoquent les difficultés d’approvisionnement."],["Généraliser la prescription sociale orientant les personnes isolées vers des structures gratuites de lien social","La prescription sociale existe dans quelques territoires. Ses partisans veulent la généraliser ; ses critiques s’interrogent sur son efficacité et son financement."],["Relocaliser 80 principes actifs stratégiques en cinq ans, en priorisant antibiotiques et antidouleurs","Un plan de relocalisation de dizaines de médicaments essentiels est engagé depuis 2023. Ses partisans veulent l’accélérer ; ses critiques évoquent le surcoût."],["Élargir la licence d’office et lever les brevets sur les vaccins et moyens de lutte contre les pandémies","Le débat sur la levée des brevets des vaccins a eu lieu à l’OMC durant la pandémie. Ses partisans veulent un accès universel ; ses critiques redoutent un frein à la recherche."],["Garantir l’accès à l’AME et un soutien psychosocial effectif pour les demandeurs d’asile","Les demandeurs d’asile bénéficient de la protection maladie, mais leur santé mentale est peu suivie. Ses partisans veulent un soutien renforcé ; ses critiques évoquent le coût."]],"edu":[["Financer l’enseignement des langues et cultures d’outre-mer et inscrire l’histoire des outre-mer dans les programmes","Les langues régionales et d’outre-mer sont enseignées de façon inégale, avec un cadre légal renforcé par la loi Molac de 2021, en partie censurée. Ses partisans veulent mieux faire connaître ces cultures ; ses critiques évoquent la priorité à donner aux savoirs fondamentaux."],["Développer une formation professionnelle publique sur les écosystèmes et les essences locales","Des formations existent dans l’enseignement agricole et forestier. Ses partisans veulent mieux préparer aux métiers de la nature ; ses critiques s’interrogent sur les débouchés."],["Créer des structures d’alphabétisation et des cours de français pour les personnes non francophones","L’apprentissage du français pour les étrangers passe par des dispositifs de l’État, des communes et des associations. Ses partisans veulent un réseau suffisant ; ses critiques évoquent le coût."],["Instaurer un service public de lutte contre l’illettrisme et l’illectronisme, soutenant les associations","L’illectronisme désigne la difficulté d’utiliser les outils numériques, qui touche une part notable des adultes. Ses partisans veulent un service dédié ; ses critiques soulignent le rôle déjà joué par les associations."],["Proposer une formation gratuite aux personnes en situation d’illettrisme","Des formations de base existent, financées par l’État, les régions ou les entreprises, mais les adultes concernés y recourent peu. Ses partisans veulent lever les obstacles financiers ; ses critiques estiment que l’enjeu est surtout le repérage."],["Lancer chaque année des campagnes d’information sur l’illettrisme et former les agents publics à le détecter","L’Agence nationale de lutte contre l’illettrisme organise des journées de sensibilisation. Ses partisans veulent un repérage systématique ; ses critiques soulignent le coût et la difficulté de dépister."],["Distinguer les dispositifs pour l’illettrisme de ceux pour les allophones","L’illettrisme concerne des personnes scolarisées en français, tandis que les allophones apprennent le français comme langue nouvelle. Ses partisans veulent orienter chacun vers le bon parcours ; ses critiques redoutent la complexité administrative."],["Mener une véritable politique d’éducation prioritaire en redessinant la carte selon les besoins","La carte de l’éducation prioritaire a été revue en 2015 et peu actualisée depuis. Ses partisans réclament plus de moyens pour les écoles en difficulté ; ses critiques s’inquiètent des effets de seuil et de stigmatisation."],["Créer un service public national du périscolaire, gratuit, animé par des personnels titulaires formés","Le périscolaire est aujourd’hui géré par les communes, avec des qualités variables. Ses partisans veulent l’égalité entre territoires ; ses critiques évoquent le coût et l’autonomie des communes."],["Annuler le dispositif dit « choc des savoirs »","Le « choc des savoirs » a introduit en 2024 des groupes de niveau en français et en mathématiques au collège. Ses partisans y voient une ségrégation scolaire ; ses défenseurs, une aide ciblée aux élèves en difficulté."],["Mettre fin au « pacte enseignant »","Créé en 2023, le pacte offre une rémunération supplémentaire contre des missions, comme des remplacements de courte durée. Ses partisans le jugent contraire à la revalorisation générale ; ses défenseurs y voient une souplesse pour les volontaires."],["Rétablir le baccalauréat national et annuler les réformes du lycée, de la voie professionnelle et du collège","La réforme de 2019 a introduit des enseignements de spécialité et une part de contrôle continu. Ses partisans critiquent des inégalités entre lycées ; ses défenseurs soulignent la personnalisation des parcours."],["Instaurer une nouvelle carte scolaire pour réduire la ségrégation socio-scolaire","La carte scolaire attribue un établissement selon l’adresse, mais les stratégies d’évitement sont fréquentes. Ses partisans veulent plus de mixité sociale ; ses critiques défendent la liberté de choix des familles."],["Garantir un accès égal aux options et aux langues, de l’élémentaire au lycée","L’offre d’options varie fortement selon les établissements. Ses partisans veulent un accès équitable ; ses critiques soulignent le coût et la difficulté à maintenir des petites classes."],["Construire et entretenir des établissements publics à taille humaine, accessibles en moins de 15 minutes","L’entretien des bâtiments incombe aux communes, départements et régions. Ses partisans veulent des établissements de proximité ; ses critiques soulignent le coût et la dispersion des moyens."],["Renforcer, dans les programmes, l’éducation à l’égalité contre le sexisme et les discriminations","Le programme « ABCD de l’égalité » avait suscité une polémique en 2013-2014. Ses partisans veulent une prévention dès le plus jeune âge ; ses critiques redoutent des contenus controversés."],["Intégrer l’enjeu écologique de la maternelle au lycée et ajouter des enseignements pratiques","L’éducation au développement durable est prévue dans les programmes, avec des éco-délégués élus. Ses partisans veulent y consacrer plus de temps ; ses critiques évoquent la surcharge des programmes."],["Offrir gratuitement l’accès aux dispositifs « devoirs faits » à toutes les familles, de l’école au lycée","Le dispositif « Devoirs faits », lancé en 2017, propose de faire ses devoirs au collège avec des adultes. Ses partisans veulent l’étendre ; ses critiques soulignent le coût et la charge pour les personnels."],["Introduire un droit à la seconde chance en matière d’orientation","L’orientation après la troisième ou la seconde est parfois vécue comme définitive. Ses partisans veulent faciliter les changements de voie ; ses critiques redoutent des parcours moins lisibles."],["Renforcer le contrôle public des établissements privés sous contrat, sans intermédiaire avec l’État","Un rapport parlementaire de 2025 a pointé un contrôle insuffisant des établissements privés sous contrat. Ses partisans veulent des inspections renforcées ; ses défenseurs estiment que le cadre est suffisant."],["Pénaliser financièrement les établissements privés sous contrat qui contribuent à la ségrégation scolaire","Les établissements privés sous contrat accueillent en moyenne plus d’élèves favorisés que le public. Ses partisans veulent lier les fonds publics à la mixité ; ses critiques défendent la liberté d’enseignement."],["Renforcer partout la vie scolaire et les personnels sociaux et de santé, notamment contre le harcèlement","Le programme pHARe de lutte contre le harcèlement est déployé depuis 2021. Ses partisans veulent plus de personnels ; ses critiques évoquent le budget."],["Former tous les personnels scolaires et périscolaires à prévenir et détecter les violences et le harcèlement","La formation des personnels reste inégale. Ses partisans veulent un cadre obligatoire ; ses critiques soulignent le temps de formation nécessaire."],["Interdire l’intervention des fondations d’entreprises à l’école et rompre la convention avec le Medef","Des entreprises et fondations proposent des interventions dans les établissements, avec des partenariats encadrés par l’institution. Ses partisans craignent une influence privée ; ses défenseurs y voient une ouverture sur le monde professionnel."],["Adopter un plan pluriannuel de recrutement pour tous les concours, avec un pré-recrutement ouvert à tous les milieux","Les concours d’enseignant peinent à pourvoir tous les postes dans certaines disciplines. Ses partisans veulent attirer plus de candidats ; ses critiques s’interrogent sur le financement."],["Structurer une filière complète des métiers de l’éducation, du CAP à bac+5","Les métiers de l’éducation recouvrent enseignants, accompagnants, animateurs et personnels de vie scolaire, avec des parcours séparés. Ses partisans veulent des passerelles ; ses critiques soulignent la complexité."],["Mettre fin au nouveau management public et rétablir la liberté pédagogique des enseignants","Le « nouveau management public » désigne l’introduction d’objectifs chiffrés et d’évaluations dans l’administration. Ses partisans le critiquent ; ses défenseurs veulent plus de pilotage par les résultats."],["Rénover le bâti scolaire face au climat et aux risques sanitaires (amiante, sanitaires, végétalisation)","Le bâti scolaire relève en grande partie des collectivités, avec des budgets inégaux. Ses partisans veulent un plan national ; ses critiques évoquent le coût."],["Associer les élèves à la vie de l’établissement dès le primaire et étendre le droit de réunion des lycéens","Des conseils de vie collégienne et lycéenne existent déjà. Ses partisans veulent élargir la participation ; ses critiques redoutent des tensions dans la gestion des établissements."],["Créer un statut de parent d’élève délégué","Les parents élus aux conseils d’école et d’établissement exercent un rôle bénévole. Ses partisans veulent leur accorder du temps et des droits ; ses critiques évoquent la charge pour les employeurs."],["Augmenter le nombre de classes et de lycées professionnels et agricoles publics","La carte des formations professionnelles est décidée avec les régions. Ses partisans veulent plus de places publiques ; ses critiques soulignent l’adéquation aux besoins des entreprises."],["Créer des centres polytechniques professionnels pour la formation initiale et continue","Il s’agirait de lieux regroupant formation initiale et continue. Ses partisans veulent des parcours plus cohérents ; ses critiques s’interrogent sur l’organisation et le coût."],["Retirer la formation continue de la logique marchande","Le compte personnel de formation, monétisé depuis 2019, a favorisé un marché de la formation. Ses partisans veulent un service public ; ses critiques défendent la liberté de choix des salariés."],["Rétablir un encadrement public de la création des centres de formation d’apprentis (CFA)","Depuis la loi de 2018, de nombreux organismes peuvent ouvrir un CFA sans autorisation préalable. Ses partisans veulent mieux contrôler la qualité ; ses critiques soulignent le dynamisme de l’apprentissage."],["Rétablir le bac professionnel en quatre ans, annuler les réformes de la voie pro et privilégier les cours en atelier","Le bac professionnel est préparé en trois ans depuis 2009. La réforme de la voie professionnelle de 2023 a accru les périodes de stage. Ses partisans critiquent une baisse de la formation scolaire ; ses défenseurs, un meilleur lien avec l’emploi."],["Structurer les filières professionnelles liées à la transition écologique et agricole, à l’abri des lobbys agro-industriels","Les métiers de la transition (rénovation, énergie, agroécologie) manquent de main-d’œuvre. Ses partisans veulent créer des filières publiques ; ses critiques soulignent le besoin de partenariats avec les entreprises."],["Renforcer les moyens humains et financiers des lycées agricoles publics, en priorité dans les déserts d’enseignement public","L’enseignement agricole relève du ministère de l’Agriculture et accueille un public rural. Ses partisans veulent plus de moyens ; ses critiques évoquent la concurrence avec le privé."],["Rendre accessibles et gratuites les places d’internat pour les étudiants et apprentis mineurs éloignés","L’internat coûte aux familles, avec des aides sous conditions de ressources. Ses partisans veulent garantir l’accès à la formation sur tout le territoire ; ses critiques évoquent le coût."],["Recréer un service public national de l’orientation","Depuis 2018, les régions sont compétentes pour l’information sur les métiers, tandis que l’État garde l’orientation dans les établissements. Ses partisans veulent un service unifié ; ses critiques redoutent une centralisation."],["Réserver la taxe d’apprentissage aux établissements publics, à tous les niveaux","La taxe d’apprentissage finance en partie les formations, y compris privées. Ses partisans veulent privilégier le public ; ses critiques soulignent le rôle du privé dans l’apprentissage."],["Consolider la formation continue publique des adultes, notamment à travers les Greta","Les Greta sont des groupements d’établissements publics qui proposent des formations pour adultes. Ses partisans veulent renforcer ce réseau ; ses critiques mettent en avant la concurrence avec les organismes privés."],["Relever le niveau d’investissement public dans la recherche","L’objectif européen d’y consacrer 3 % du PIB en dépenses de recherche est fixé depuis 2000 ; la France se situe autour de 2,2 %. Ses partisans veulent atteindre cet objectif ; ses critiques s’interrogent sur le financement."],["Financer des plans généraux de recherche sur des secteurs d’avenir","France 2030 finance déjà des programmes prioritaires de recherche. Ses partisans veulent un pilotage public plus large ; ses critiques défendent la recherche libre."],["Rétablir le recrutement sur statut de chercheur ou d’enseignant-chercheur après le doctorat","La loi de 2020 a créé des chaires de professeur junior, avec une titularisation conditionnelle. Ses partisans veulent un accès direct à un poste stable ; ses critiques soulignent la sélection par l’évaluation."],["Ouvrir les universités à la société, avec des services reliant chercheurs et population","Les universités organisent déjà des événements de culture scientifique. Ses partisans veulent un lien plus fort avec les citoyens ; ses critiques évoquent la charge supplémentaire pour les chercheurs."],["Mettre fin aux partenariats universitaires avec des acteurs impliqués dans crimes de guerre, génocides ou écocides","Le débat s’est amplifié depuis 2024 à propos des liens avec des universités israéliennes. Ses partisans invoquent l’éthique ; ses critiques défendent la liberté académique."],["Favoriser l’accès libre aux revues scientifiques francophones","Des plateformes comme OpenEdition donnent accès à des revues en français. Ses partisans veulent consolider la science ouverte ; ses critiques soulignent le financement."],["Rétablir l’égalité d’accès aux aides au logement pour tous les étudiants, y compris étrangers","Les étudiants étrangers peuvent bénéficier de l’aide au logement sous conditions de séjour et de ressources. Ses partisans veulent supprimer les différences ; ses critiques évoquent le coût."],["Mettre fin à la précarité des contractuels et jeunes chercheurs par la titularisation et un recrutement pluriannuel","Une part importante des personnels de la recherche travaille en contrat à durée déterminée. Ses partisans veulent des postes stables ; ses critiques s’inquiètent de la rigidité."],["Assurer des financements pérennes aux universités et planifier emplois et constructions selon une cartographie des besoins","Les universités ont signalé des déficits budgétaires ces dernières années. Ses partisans veulent un financement stable ; ses critiques soulignent la nécessité de gérer les dépenses."],["Supprimer le Hcéres et confier le suivi de la recherche à des pairs élus","Le Hcéres évalue les établissements et les unités de recherche depuis 2014. Ses partisans critiquent une logique bureaucratique ; ses défenseurs y voient un contrôle indépendant."],["Réserver à l’État la délivrance des grades et diplômes, contrôler les formations privées et supprimer les subventions déguisées","Seuls certains diplômes privés sont reconnus par l’État sous forme de visa ou de grade. Ses partisans veulent un monopole public ; ses critiques défendent la diversité de l’offre."],["Interdire le caractère lucratif des écoles privées du supérieur, notamment l’actionnariat et la cotation en Bourse","Plusieurs groupes d’enseignement supérieur privé appartiennent à des fonds d’investissement. Ses partisans parlent de marchandisation ; ses critiques soulignent leur rôle dans l’absorption de la demande."],["Lancer un grand plan pour l’immobilier universitaire : construction, rénovation et accessibilité","Le parc immobilier universitaire est vieillissant, avec des besoins de rénovation énergétique. Ses partisans veulent un plan massif ; ses critiques évoquent le coût."],["Augmenter fortement le nombre de psychologues dans les universités et garantir des soins gratuits aux étudiants","Les services de santé universitaires manquent de psychologues. Ses partisans veulent un meilleur accès aux soins ; ses critiques évoquent le coût."],["Renforcer l’éducation physique, améliorer la formation des professeurs des écoles et garantir quatre heures d’EPS par semaine","L’EPS est de trois heures par semaine à l’école primaire, quatre au collège. Ses partisans veulent plus de sport pour la santé ; ses critiques évoquent l’emploi du temps."],["Financer durablement les STAPS pour des conditions d’études et de recherche dignes","Les filières STAPS ont connu une forte hausse d’effectifs. Ses partisans veulent plus de moyens ; ses critiques s’interrogent sur les débouchés."],["Donner aux écoles supérieures d’art les moyens de leur spécificité, rouvrir les établissements fermés et harmoniser les statuts","Les écoles d’art relèvent du ministère de la Culture, avec des statuts variés. Ses partisans veulent les sécuriser ; ses critiques évoquent le coût."],["Garantir aux étudiants des écoles d’art les mêmes droits que dans le reste du supérieur","Ces étudiants n’ont pas toujours accès aux mêmes aides que ceux des universités. Ses partisans veulent une égalité ; ses critiques soulignent la diversité des statuts."],["Accroître les moyens de la recherche polaire, reconstruire les stations antarctiques et construire un brise-glace","La recherche polaire française est portée par l’Institut polaire. Ses partisans veulent un investissement accru ; ses critiques évoquent le coût d’équipements spécialisés."],["Créer en France un institut Océan de l’université des Nations unies, doté d’un navire-université","Cette proposition s’inscrit dans l’agenda international de l’Océan, relancé par la conférence de l’ONU à Nice en 2025. Ses partisans parlent de leadership scientifique ; ses critiques, de coût."],["Faire de la France le leader mondial de la recherche et de l’éducation maritimes","L’Ifremer est l’un des principaux organismes de recherche marine du pays. Ses partisans veulent un effort massif ; ses critiques demandent des priorités claires."],["Lancer un « Erasmus de la mer » d’échanges entre enseignants et étudiants français, européens et francophones","Le programme Erasmus+ existe déjà, avec une dimension maritime limitée. Ses partisans veulent un dispositif dédié ; ses critiques estiment qu’il faut passer par l’existant."],["Développer une culture maritime, avec une « classe de mer » pour chaque enfant au cours de sa scolarité","Des classes de découverte existent déjà, de façon inégale. Ses partisans veulent une culture de l’océan pour tous ; ses critiques parlent de coût et de logistique."],["Développer la formation aux pêches, à l’aquaculture et à l’algoculture durables, et renforcer la formation des marins","Les formations maritimes dépendent de lycées et d’écoles spécialisées. Ses partisans veulent soutenir ces métiers ; ses critiques s’interrogent sur les débouchés."],["Proposer la construction d’une première station sous-marine permanente et dérivante, sur le modèle de l’ISS","Des projets de stations sous-marines existent à l’étranger mais aucune n’est permanente. Ses partisans parlent d’exploration scientifique ; ses critiques, de coût et d’utilité."],["Intensifier la recherche en météorologie de l’espace, notamment la prévision des tempêtes solaires","Une forte tempête solaire a perturbé des systèmes en mai 2024. Ses partisans veulent mieux anticiper les risques pour les satellites et les réseaux ; ses critiques évoquent la priorité budgétaire."],["Initier la création d’une université francophone des métiers de l’espace en Guyane","Le Centre spatial guyanais de Kourou accueille les lancements européens. Ses partisans veulent ancrer la formation sur place ; ses critiques s’interrogent sur le modèle et les débouchés."],["Faire de la France une puissance quantique mondiale en finançant la recherche fondamentale, bourses et laboratoires","Un plan national quantique de 1,8 milliard d’euros a été lancé en 2021. Ses partisans veulent amplifier cet effort ; ses critiques soulignent la concurrence mondiale."],["Inscrire dans les emplois du temps des séances adaptées à l’âge sur la maltraitance et les violences intrafamiliales","La prévention de la maltraitance est prévue par la loi, mais sa mise en œuvre reste inégale. Ses partisans veulent un cadre obligatoire ; ses critiques redoutent l’impact sur les élèves et les familles."],["Étendre à toutes les personnes travaillant en établissement scolaire le contrôle d’honorabilité","L’affaire de violences dans l’établissement de Bétharram, relancée en 2025, a mis en avant le contrôle d’honorabilité. Ses partisans veulent l’étendre ; ses critiques soulignent la charge administrative."],["Offrir aux jeunes, lors du service citoyen obligatoire, un bilan de santé, une remise à niveau si besoin et un permis gratuit","Cette mesure est liée au service citoyen proposé par LFI. Ses partisans y voient un moyen d’égalité des chances ; ses critiques s’interrogent sur le coût."],["Développer en nombre suffisant des supports adaptés aux élèves handicapés (LSF bilingue, braille, communication augmentée)","Les supports adaptés manquent selon les associations. Ses partisans veulent un accès effectif à l’école ; ses critiques évoquent le coût."],["Renforcer l’accompagnement des étudiants handicapés dans le supérieur, y compris pour la mobilité internationale","Les universités ont des services dédiés, aux moyens inégaux. Ses partisans veulent lever les obstacles ; ses critiques évoquent les budgets."],["Créer un réseau d’universités méditerranéennes et un réseau méditerranéen d’enseignement professionnel","Des coopérations existent déjà autour de la Méditerranée, comme dans le cadre de l’Union pour la Méditerranée. Ses partisans veulent les renforcer ; ses critiques s’interrogent sur les moyens."],["Créer un Erasmus francophone","L’Agence universitaire de la Francophonie soutient déjà des échanges. Ses partisans veulent un programme dédié ; ses critiques évoquent le coût."],["Élaborer des contenus éducatifs et des diplômes communs entre pays francophones","Des diplômes conjoints existent entre universités. Ses partisans veulent élargir cette coopération ; ses critiques soulignent la diversité des systèmes."],["Participer à la création d’une revue scientifique francophone de premier plan mondial","La science se publie majoritairement en anglais. Ses partisans veulent valoriser le français ; ses critiques soulignent l’importance de la visibilité internationale."],["Créer une université francophone de l’espace offrant un cursus commun vers les métiers aérospatiaux","Cette proposition prolonge celle d’une université de l’espace en Guyane. Ses partisans veulent une filière francophone ; ses critiques s’interrogent sur sa viabilité."],["Donner les moyens d’assurer les trois séances annuelles d’éducation à la vie affective et sexuelle, incluant consentement et lutte contre les LGBTIphobies","Trois séances par an sont prévues par la loi de 2001, mais elles sont rarement toutes assurées. Un nouveau programme a été publié en 2025. Ses partisans veulent leur mise en œuvre effective ; ses critiques s’inquiètent de contenus perçus comme idéologiques."],["Créer des écoles universitaires des métiers de l’éducation et renforcer la formation initiale et continue des personnels","Les instituts de formation des enseignants (Inspé) ont été créés en 2019, et la formation a de nouveau été réformée récemment. Ses partisans veulent une formation de qualité ; ses critiques soulignent les changements incessants."],["Protéger les cursus courts (BTS, BUT) et encourager la poursuite d’études après le bac professionnel ou technologique","Les bacheliers professionnels sont orientés en BTS, souvent en concurrence avec les bacheliers généraux. Ses partisans veulent favoriser leur accès ; ses critiques évoquent la sélection."]],"sec":[["Tarir le financement du terrorisme en renforçant les moyens d’enquête contre les structures illicites","Le service Tracfin et le parquet national financier suivent déjà les flux suspects, avec des moyens limités face à des circuits très variés. Ses partisans veulent cibler l’argent plutôt que seulement les individus ; ses critiques soulignent la difficulté de tracer des petits montants ou des circuits informels."],["Accroître les effectifs de la plateforme PHAROS contre les appels en ligne à la violence","Pharos, créée en 2009, reçoit les signalements de contenus illicites sur internet. Ses partisans veulent plus de personnel pour traiter les signalements ; ses critiques s’inquiètent du risque de censure et de l’ampleur des contenus à surveiller."],["Reconstruire le service public de la police pour garantir le droit à la sûreté","La sûreté figure parmi les droits de l’article 2 de la Déclaration de 1789. Les effectifs de la police ont baissé à la fin des années 2000 puis ont augmenté. Ses partisans veulent un service public plus présent ; ses critiques demandent des priorités claires et des résultats mesurables."],["Rétablir les principes du Code de déontologie de 1986 pour policiers et gendarmes","Le code de 1986 a été intégré au code de la sécurité intérieure et remplacé par un texte commun à la police et à la gendarmerie en 2013. Ses partisans veulent un retour à une déontologie plus exigeante ; ses critiques estiment que le cadre actuel suffit s’il est appliqué."],["Porter à deux ans la formation des gardiens de la paix et rouvrir des écoles nationales de police","La formation initiale a été raccourcie et réorganisée à plusieurs reprises ces dernières années. Ses partisans y voient un moyen d’améliorer la qualité du travail de terrain ; ses critiques soulignent le coût et le besoin de postes sur le terrain."],["Interdire la nasse en manifestation et rendre effectif le port du RIO par les agents","Le Conseil d’État a suspendu en 2021 l’usage de la nasse dans le schéma du maintien de l’ordre, sans l’exclure totalement. Le RIO est le numéro d’identification porté par les agents. Ses partisans veulent mieux protéger les manifestants ; ses critiques défendent un outil d’encadrement des foules."],["Abroger la loi sur le refus d’obtempérer et écarter la présomption de légitime défense des policiers","La loi de 2017 a élargi les cas d’usage des armes par les forces de l’ordre. La mort de Nahel en juin 2023 lors d’un refus d’obtempérer a relancé le débat. Ses partisans veulent restreindre l’usage des armes ; ses critiques mettent en avant la protection des agents."],["Abroger les lois sécuritaires jugées inefficaces et renforcer la prévention par des éducateurs et médiateurs","Plusieurs lois sécuritaires ont été votées depuis vingt ans, avec une évaluation inégale de leur effet. Ses partisans privilégient la prévention sociale ; ses critiques soulignent le besoin de réponses pénales rapides."],["Réformer le dialogue social dans la police et la gendarmerie pour plus de transparence","Les syndicats sont très présents dans la police, alors que les gendarmes, militaires, ont des instances de concertation spécifiques. Ses partisans veulent plus de transparence dans les discussions ; ses critiques redoutent une perte d’efficacité de la hiérarchie."],["Rapatrier dans le service public certaines fonctions de sécurité privées, comme le gardiennage","Les Jeux olympiques de 2024 ont mis en évidence le recours massif à la sécurité privée et la difficulté de recruter. Ses partisans veulent un service public de la sécurité ; ses critiques mettent en avant le coût et la souplesse du privé."],["Mettre fin à la politique du chiffre et aux primes au résultat pour les agents","Dans les années 2000, des objectifs chiffrés d’interpellations ont fait polémique. Ses partisans dénoncent des effets pervers sur les pratiques ; ses critiques estiment qu’il faut pouvoir mesurer l’activité des services."],["Renforcer les moyens de recueil des plaintes et d’accompagnement des victimes","Le dépôt de plainte est parfois difficile ou dissuasif, notamment pour les violences sexuelles et conjugales, malgré des dispositifs en ligne. Ses partisans veulent un accueil mieux formé ; ses critiques parlent de moyens limités."],["Faire de la criminalité organisée et de la corruption une priorité, avec des effectifs spécialisés","Une loi de 2025 contre le narcotrafic a renforcé les outils judiciaires. Ses partisans veulent des moyens dédiés ; ses critiques demandent de ne pas négliger la délinquance du quotidien."],["Doubler la police scientifique et recréer une police judiciaire indépendante, sous l’autorité des magistrats","La police technique et scientifique permet d’élucider de nombreuses affaires mais connaît des délais d’analyse. Ses partisans veulent un doublement des moyens ; ses critiques s’interrogent sur le coût et l’organisation."],["Combattre la délinquance financière : plus d’effectifs, levée du « verrou de Bercy », plus de juges d’instruction","Le « verrou de Bercy » réserve au ministère du Budget le droit de saisir la justice pour fraude fiscale, avec un assouplissement en 2018. Ses partisans veulent des poursuites plus libres ; ses critiques défendent un traitement administratif des litiges fiscaux."],["Combattre l’impunité des agresseurs sexuels et la correctionnalisation des viols","La correctionnalisation consiste à poursuivre un viol comme agression sexuelle, plus rapide mais moins sévère. Le procès des viols de Mazan en 2024 a relancé l’attention sur les violences sexuelles. Ses partisans veulent des procès aux assises ; ses critiques soulignent leur lenteur."],["Renforcer durablement les moyens de la sécurité civile et des secours selon les risques locaux","La sécurité civile repose largement sur des sapeurs-pompiers volontaires et sur des services départementaux. Ses partisans veulent de nouveaux moyens face aux risques climatiques ; ses critiques évoquent le coût pour l’État et les départements."],["Proposer aux volontaires qualifiés des services de défense, sans envoi à l’étranger ni casernement","Il s’agit d’un volontariat sans mission hors du territoire et sans vie en caserne. Des dispositifs de réserve existent déjà. Ses partisans y voient une défense plus civique ; ses critiques s’interrogent sur son utilité militaire."],["Supprimer le service militaire volontaire","Le service militaire volontaire, créé en 2015, accueille des jeunes éloignés de l’emploi dans un cadre encadré par l’armée. Ses partisans veulent l’arrêter au profit d’un autre dispositif ; ses critiques soulignent son rôle d’insertion."],["Accroître les moyens de police et de douane contre les filières du crime organisé","Les saisies de cocaïne dans les ports comme Le Havre ou Dunkerque ont augmenté ces dernières années. Ses partisans veulent plus d’agents et de scanners ; ses critiques demandent aussi d’agir sur la demande."],["Développer la coopération judiciaire internationale, notamment avec les pays producteurs de drogue","La lutte contre le narcotrafic suppose des échanges entre polices et magistrats, notamment avec l’Amérique latine. Ses partisans veulent renforcer cette coopération ; ses critiques soulignent les difficultés avec des États fragiles."],["Mettre la Marine nationale au service du droit international de la mer et du traité sur la haute mer","Le traité sur la haute mer a été adopté en 2023 sous l’égide de l’ONU. Ses partisans veulent que la Marine contribue à son respect ; ses critiques s’interrogent sur ses moyens face à ses autres missions."],["Renforcer la surveillance et la protection du domaine maritime français","La France possède l’un des plus grands espaces maritimes au monde grâce à ses territoires d’outre-mer. Ses partisans veulent mieux surveiller la pêche illégale et les pollutions ; ses critiques évoquent le coût."],["Doter la France d’un avion spatial souverain","Le projet Hermès d’avion spatial européen a été abandonné en 1992. Ses partisans parlent de souveraineté ; ses critiques, d’un projet très coûteux et incertain."],["Donner à la France les moyens de neutraliser les actions hostiles menées contre elle","Le service Viginum, créé en 2021, lutte contre les ingérences numériques étrangères. Ses partisans veulent une capacité de riposte ; ses critiques demandent des garde-fous."],["Garantir l’usage de Galileo pour le grand public et les forces armées","Galileo est le système de positionnement par satellites de l’Union européenne, avec un service réservé aux usages sensibles. Ses partisans veulent réduire la dépendance au GPS américain ; ses critiques soulignent les coûts et les délais."],["Lancer un programme d’urgence de cryptographie post-quantique","Les ordinateurs quantiques pourraient casser une partie du chiffrement actuel. Des normes de cryptographie post-quantique ont été publiées aux États-Unis en 2024. Ses partisans veulent anticiper ; ses critiques soulignent que la menace reste incertaine."],["Allonger le délai de prescription du délit de non-dénonciation de violences sexuelles sur mineurs","Le délit de non-dénonciation sanctionne le fait de ne pas alerter les autorités. Ses partisans veulent protéger les victimes mineures ; ses critiques s’interrogent sur l’effet réel d’un allongement."],["Protéger les lieux cultuels et culturels, en renforçant si besoin la protection policière des mosquées et synagogues","Les lieux de culte sont déjà protégés dans le cadre du plan Vigipirate et de l’opération Sentinelle. Ses partisans veulent un renfort face aux actes antimusulmans et antisémites ; ses critiques évoquent les effectifs disponibles."],["Rendre obligatoire un brevet de formation à la lutte contre les discriminations pour les policiers","La formation initiale comporte déjà des modules sur la déontologie. Ses partisans veulent une certification obligatoire ; ses critiques estiment que la formation existante suffit."],["Établir un plan de lutte contre les dérives racistes dans la police et la gendarmerie","Le Défenseur des droits a documenté des contrôles d’identité perçus comme discriminatoires. Ses partisans veulent un plan national ; ses critiques défendent la police contre une accusation générale."],["Prioriser l’investissement dans les « encapacitants » stratégiques, compatible avec la bifurcation écologique","Les capacités stratégiques désignent le renseignement, le spatial, le cyber et la dissuasion. Ses partisans veulent un effort ciblé ; ses critiques s’interrogent sur les arbitrages avec d’autres programmes."],["Bâtir un modèle d’armée fondé sur les technologies de rupture et réduire les dépendances par des programmes souverains","La loi de programmation militaire 2024-2030 prévoit environ 413 milliards d’euros. Ses partisans veulent privilégier l’innovation ; ses critiques soulignent le besoin de masse en plus de la technologie."],["Engager une stratégie de maîtrise des fonds marins, avec protection des infrastructures","La France a adopté en 2022 une stratégie des fonds marins, notamment pour protéger les câbles sous-marins. Ses partisans veulent renforcer cet effort ; ses critiques soulignent les coûts."],["Instaurer un contrôle parlementaire effectif des exportations d’armes","Les autorisations d’exportation sont données par l’exécutif après avis d’une commission interministérielle, et le Parlement reçoit un rapport annuel. Ses partisans veulent un vote ou un avis préalable ; ses critiques défendent la souplesse de l’exécutif."],["Organiser une capacité de projection des forces, déployable uniquement sous mandat de l’ONU","Aujourd’hui, la France peut décider seule ou avec ses alliés d’opérations extérieures, avec information du Parlement. Ses partisans veulent un cadre strictement multilatéral ; ses critiques estiment que cela limiterait la capacité d’action."],["Faire de la lutte contre les violences sexuelles et sexistes dans les armées une exigence immédiate","Une cellule d’écoute, Thémis, existe depuis 2014 au sein du ministère des Armées. Ses partisans veulent des sanctions plus fermes ; ses critiques soulignent la difficulté de parler dans un cadre hiérarchique."],["Adapter le matériel militaire et l’équipement des soldats à la nouvelle donne climatique","Le ministère des Armées a adopté une stratégie climat en 2022. Ses partisans parlent d’adaptation aux canicules et aux zones extrêmes ; ses critiques demandent de ne pas déplacer les priorités opérationnelles."],["Renforcer la condition militaire, le service de santé des armées et l’indemnisation des blessures","Le service de santé des armées a vu ses effectifs réduits au fil des réformes. Ses partisans veulent mieux soutenir les militaires et leurs familles ; ses critiques évoquent le coût budgétaire."]],"imm":[]};
