<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boussole des mesures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan : feuille de papier bleutée, encre marine, une seule audace = le rail de réponse en dégradé orange → bleu.
   Mise en page : colonne unique de 760 px, cartes plates, chiffres tabulaires. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --ink: #14202E;
  --muted: #5B6878;
  --line: #D3D9E2;
  --soft: #F5F7FA;
  --s0: #C2410C;
  --s1: #E0834A;
  --s3: #7C8797;
  --s4: #4F86D9;
  --s5: #1E4FD8;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1620; --surface: #18212D; --ink: #E8EDF3; --muted: #9AA7B8; --line: #2A3544; --soft: #131B26;
    --s0: #F0753A; --s1: #F0A877; --s3: #8B97A8; --s4: #6FA2F0; --s5: #4C84F2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1620; --surface: #18212D; --ink: #E8EDF3; --muted: #9AA7B8; --line: #2A3544; --soft: #131B26;
  --s0: #F0753A; --s1: #F0A877; --s3: #8B97A8; --s4: #6FA2F0; --s5: #4C84F2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; min-height: 100%; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--s5); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; }
.brand svg { width: 22px; height: 22px; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .9rem; }
.chip[aria-current="page"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 10px; padding: 11px 18px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tnum { font-variant-numeric: tabular-nums; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .9rem; }
input[type="text"], textarea, select { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea { resize: vertical; min-height: 84px; }

/* Accueil */
.hero { display: flex; flex-direction: column; gap: 12px; padding: 12px 0 4px; }
.hero p { font-size: 1.1rem; max-width: 56ch; color: var(--muted); }
.modes { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .modes { grid-template-columns: 1fr 1fr; } }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.mode:hover { border-color: var(--ink); }
.mode .big { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; line-height: 1; }
.mode .go { margin-top: 6px; font-weight: 600; }

/* Questionnaire */
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ink); }
.theme-tag { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.phare { display: inline-block; font-size: .75rem; font-weight: 700; border: 1px solid var(--ink); border-radius: 99px; padding: 1px 9px; margin-left: 8px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); }
.measure { font-family: var(--font-display); font-size: clamp(1.4rem, 4.2vw, 1.9rem); line-height: 1.2; font-weight: 600; text-wrap: balance; }
.rail { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 640px) { .rail { grid-template-columns: repeat(5, 1fr); } }
.opt { --c: var(--s3); position: relative; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 12px 12px 18px; min-height: 56px; display: flex; align-items: center; gap: 8px; font-weight: 600; line-height: 1.2; overflow: hidden; }
.opt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
@media (min-width: 640px) { .opt { flex-direction: column; justify-content: flex-end; align-items: flex-start; min-height: 92px; padding: 16px 10px 10px; } .opt::before { width: auto; height: 7px; right: 0; bottom: auto; } }
.opt .key { font-size: .75rem; color: var(--muted); font-weight: 500; }
.opt[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.opt[aria-pressed="true"] .key { color: rgba(255,255,255,.8); }
.opt[aria-pressed="true"]::before { background: rgba(255,255,255,.55); }
.opt:hover { border-color: var(--c); }
.opt[data-v="0"] { --c: var(--s0); } .opt[data-v="1"] { --c: var(--s1); } .opt[data-v="3"] { --c: var(--s3); } .opt[data-v="4"] { --c: var(--s4); } .opt[data-v="5"] { --c: var(--s5); }
.opt[data-v="1"][aria-pressed="true"] { color: #1a1208; } .opt[data-v="1"][aria-pressed="true"] .key { color: rgba(0,0,0,.6); }
.noopinion { align-self: flex-start; background: none; border: 1.5px dashed var(--muted); border-radius: 10px; padding: 9px 14px; font-weight: 600; color: var(--muted); }
.noopinion[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-style: solid; border-color: var(--ink); }

/* Rapport */
.gauge { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 4px; }
.gauge svg { width: min(340px, 100%); height: auto; }
.gauge .num { font-family: var(--font-display); font-weight: 700; font-size: clamp(3.2rem, 14vw, 4.6rem); line-height: 1; margin-top: -58px; }
.gauge .cap { text-align: center; max-width: 44ch; color: var(--muted); }
.stack { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--line); }
.stack > span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .875rem; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.barrow { display: grid; grid-template-columns: minmax(0,1fr) 54px; gap: 4px 10px; align-items: center; }
.barrow .name { grid-column: 1 / -1; font-size: .95rem; }
.track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--s5); border-radius: 99px; }
.barrow .val { text-align: right; font-weight: 700; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.list li { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.list li:first-child { border-top: 0; padding-top: 0; }
.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; color: #fff; background: var(--c, var(--s3)); white-space: nowrap; }
.pill[data-v="0"] { --c: var(--s0); } .pill[data-v="1"] { --c: var(--s1); color: #1a1208; } .pill[data-v="3"] { --c: var(--s3); } .pill[data-v="4"] { --c: var(--s4); } .pill[data-v="5"] { --c: var(--s5); }
.pill[data-v="2"] { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
.pill[data-v="x"] { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.quote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); font-style: italic; }
.codebox { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .78rem; min-height: 72px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 650; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.error { color: var(--s0); font-weight: 600; }
.foot { font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.simbig { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; }
@media (prefers-reduced-motion: no-preference) { .progress > i, .track > i { transition: width .25s ease; } }
.more { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 14px; }
.more summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: .95rem; list-style: none; display: flex; align-items: center; gap: 8px; }
.more summary::-webkit-details-marker { display: none; }
.more summary::before { content: ""; flex: none; width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%;
  background: linear-gradient(var(--ink), var(--ink)) center / 10px 2px no-repeat, linear-gradient(var(--ink), var(--ink)) center / 2px 10px no-repeat; }
.more[open] summary::before { background: linear-gradient(var(--ink), var(--ink)) center / 10px 2px no-repeat; }
.pc { width: 100%; border-collapse: separate; border-spacing: 0; margin: 0 0 10px; table-layout: fixed; }
.pc th { border-bottom: 0; text-align: left; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 0 12px 6px; font-weight: 600; width: 50%; }
.pc th, .pc td { white-space: normal; }
.pc td { width: 50%; vertical-align: top; border: 1px solid var(--line); background: var(--soft); padding: 10px 12px; font-size: .92rem; line-height: 1.45; overflow-wrap: anywhere; word-break: normal; hyphens: auto; border-bottom: 1px solid var(--line); }
.pc td:first-child { border-radius: 10px 0 0 10px; border-right: 0; box-shadow: inset 3px 0 0 var(--s5); }
.pc td:last-child { border-radius: 0 10px 10px 0; box-shadow: inset 3px 0 0 var(--s0); }
@media (max-width: 560px) {
  .pc, .pc tbody, .pc tr, .pc td { display: block; width: 100%; }
  .pc thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .pc td:first-child { border-radius: 10px 10px 0 0; border-right: 1px solid var(--line); border-bottom: 0; }
  .pc td:last-child { border-radius: 0 0 10px 10px; }
  .pc td::before { content: attr(data-label); display: block; font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
}
.infobar { display: flex; justify-content: flex-end; }
.tog { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .82rem; color: var(--muted); }
.tog[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.tog[aria-pressed="true"]::before { content: "✓ "; }
.numtag { font-variant-numeric: tabular-nums; font-weight: 700; margin-left: 8px; }
.more p { margin: 0 0 10px; line-height: 1.5; overflow-wrap: anywhere; }
.more { overflow: hidden; }
</style>
</head>

isans veulent une fiscalité plus juste ; ses critiques redoutent la complexité."],["Remplacer l’ANRU par un office national du logement et de l’amélioration du cadre de vie","L’Agence nationale pour la rénovation urbaine finance depuis 2003 la transformation des quartiers prioritaires. Ses partisans veulent un outil plus large ; ses critiques s’interrogent sur son efficacité."],["Étendre la prime de vie chère aux minima sociaux, à l’allocation de solidarité aux personnes âgées et aux revenus sous le seuil de pauvreté","Les prix des produits sont nettement plus élevés en outre-mer, comme l’ont montré les manifestations contre la vie chère en 2024. Ses partisans veulent soutenir les plus modestes ; ses critiques évoquent le coût."],["Garantir la continuité territoriale et rattraper le retard routier et ferroviaire, notamment à La Réunion et en Guyane","La continuité territoriale vise à faciliter les liens entre l’outre-mer et l’Hexagone. Ses partisans veulent un rattrapage des infrastructures ; ses critiques évoquent le coût."],["Contrôler le prix des billets d’avion entre les Outre-mer et l’Hexagone et auditer l’oligopole aérien","Les liaisons avec l’outre-mer sont assurées par un nombre réduit de compagnies. Ses partisans veulent encadrer les prix ; ses critiques redoutent une baisse de l’offre."],["Améliorer les conditions de travail en forêt : interdire le travail détaché, reconnaître la pénibilité, hausser les salaires et préserver la retraite anticipée","Le travail forestier est parmi les plus accidentogènes. Ses partisans veulent mieux protéger ces salariés ; ses critiques évoquent le coût pour la filière."],["Relocaliser la transformation du bois en encadrant son achat et sa vente à l’étranger","Une partie des chênes est exportée brute, notamment vers l’Asie. Ses partisans veulent relocaliser la valeur ajoutée ; ses critiques défendent la liberté commerciale."],["Réquisitionner en cas de pandémie les entreprises indispensables au matériel sanitaire","Pendant la pandémie, l’État a réquisitionné des stocks de masques. Ses partisans veulent un dispositif permanent ; ses critiques évoquent l’atteinte à la liberté d’entreprendre."],["Nationaliser certaines filiales critiques, par exemple celle qui produit le principe actif du Doliprane","Sanofi a cédé en 2025 le contrôle d’Opella, qui fabrique le Doliprane, à un fonds d’investissement, avec des engagements obtenus de l’État. Ses partisans veulent une maîtrise publique ; ses critiques redoutent un coût élevé."],["Renforcer la maîtrise publique de l’éolien maritime, y compris par nationalisation, comme pour GE Vernova (ex-Alstom)","La branche énergie d’Alstom a été cédée à General Electric en 2015. Ses partisans veulent la reprendre ; ses critiques s’interrogent sur le coût et la stratégie industrielle."],["Défendre les emplois de marins contre le dumping social, la concurrence déloyale et la Commission européenne","Le pavillon français est concurrencé par des pavillons à bas coût. Ses partisans veulent protéger les marins ; ses critiques évoquent la compétitivité."],["Réformer la taxation des armateurs, y compris la taxe au tonnage, et privilégier le pavillon français","La taxe au tonnage est un régime fiscal avantageux pour les armateurs. Ses partisans veulent le réformer ; ses critiques redoutent un départ des compagnies."],["Relancer les ports dans une logique multimodale mer-rail-fluvial et favoriser Marseille et Le Havre pour le transit européen","Les grands ports français sont concurrencés par ceux du nord de l’Europe. Ses partisans veulent les renforcer ; ses critiques évoquent le coût."],["Soutenir la construction de navires publics dans les chantiers navals français","Les chantiers de Saint-Nazaire ont été repris en 2018 avec des participations publiques. Ses partisans veulent une commande publique stable ; ses critiques évoquent le coût."],["Nationaliser ArianeGroup et créer un pôle public du satellite","ArianeGroup est détenue à parts égales par Airbus et Safran. Ses partisans veulent un contrôle public ; ses critiques soulignent le rôle de l’industrie privée."],["Concentrer les financements publics sur MaiaSpace, filiale d’ArianeGroup, en complément d’Ariane 6","MaiaSpace développe un lanceur partiellement réutilisable. Ses partisans veulent soutenir la souveraineté ; ses critiques demandent de ne pas multiplier les programmes."],["Conditionner les aides aux start-ups quantiques à des garanties de souveraineté","Le plan quantique français finance plusieurs jeunes entreprises. Ses partisans veulent conserver la technologie ; ses critiques redoutent une fuite des talents."],["Replacer sous contrôle public et relocaliser les infrastructures du numérique et des télécommunications","La vente éventuelle de SFR a été débattue en 2025. Ses partisans veulent un contrôle public ; ses critiques évoquent la concurrence et le coût."],["Nationaliser toute entreprise numérique au savoir-faire essentiel menacée de faillite, de délocalisation ou de rachat prédateur","Un contrôle des investissements étrangers existe déjà pour les technologies sensibles. Ses partisans veulent aller jusqu’à la nationalisation ; ses critiques redoutent un effet dissuasif."],["Étendre à l’IA et au numérique le droit de l’État de siéger aux conseils et de bloquer la vente d’actifs à des fonds étrangers","Le contrôle des investissements étrangers a été étendu à plusieurs secteurs sensibles. Ses partisans veulent le renforcer ; ses critiques évoquent l’attractivité du pays."],["Atteindre « zéro sans-abri » par une hausse significative des places d’accueil, selon la logique « logement d’abord »","Le plan « Logement d’abord » existe depuis 2018 et vise l’accès direct au logement. Ses partisans veulent plus de moyens ; ses critiques soulignent la pénurie de logements."],["Encadrer le prix des produits alimentaires de première nécessité et interdire la « réduflation »","La réduflation consiste à réduire la quantité vendue sans baisser le prix. Depuis 2024, les magasins doivent l’afficher. Ses partisans veulent l’interdire ; ses critiques redoutent des pénuries."],["Restructurer les emprunts des ménages surendettés et garantir l’accès aux services bancaires de base","Les commissions de surendettement de la Banque de France existent déjà. Ses partisans veulent aller plus loin ; ses critiques évoquent le risque pour les banques."],["Transposer la directive sur la présomption de salariat pour empêcher les plateformes comme Uber ou Deliveroo de recourir aux faux indépendants","Une directive européenne de 2024 sur le travail de plateforme doit être transposée d’ici 2026. Ses partisans veulent requalifier les travailleurs ; ses critiques défendent la flexibilité."],["Titulariser les agents précaires des trois fonctions publiques","La loi de 2019 a facilité le recours aux contractuels. Ses partisans veulent des emplois stables ; ses critiques évoquent le coût et la rigidité."],["Supprimer le caractère lucratif de l’intérim et confier les besoins temporaires au service public de l’emploi et à des associations","L’intérim concerne plus de deux millions de contrats par an. Ses partisans dénoncent une précarité organisée ; ses critiques soulignent la souplesse pour les entreprises."],["Organiser une conférence nationale sur le partage du temps de travail et l’impact du progrès technologique","L’intelligence artificielle et l’automatisation relancent le débat sur le temps de travail. Ses partisans veulent un débat public ; ses critiques parlent d’une mesure sans effet direct."],["Remettre en cause les autorisations de travail le dimanche","Les lois de 2015 ont étendu les possibilités d’ouverture le dimanche. Ses partisans veulent protéger le repos ; ses critiques mettent en avant le pouvoir d’achat et l’emploi."],["Mettre fin à la flexibilisation, à l’annualisation forcée, à l’intensification du travail et aux horaires fractionnés","Ces pratiques sont très présentes dans le commerce et les services. Ses partisans veulent mieux protéger les salariés ; ses critiques évoquent la compétitivité."],["Rétablir le 1er mai comme jour férié chômé et payé pour tous","Le 1er mai est le seul jour férié obligatoirement chômé, avec des exceptions pour certains secteurs. Ses partisans veulent l’étendre à tous ; ses critiques évoquent la continuité de services."],["Instaurer un délégué au travail réel, qui réunit mensuellement les salariés et oblige l’employeur à répondre de façon motivée","Le droit d’expression des salariés existe depuis 1982. Ses partisans veulent une obligation de réponse ; ses critiques redoutent une lourdeur."],["Annuler les réformes Macron de l’assurance chômage et indemniser selon les derniers salaires, dès le premier jour travaillé","Les réformes de 2019 à 2023 ont durci les conditions d’accès et modifié le calcul. Ses partisans parlent de baisse des droits ; ses défenseurs, d’un encouragement à reprendre un emploi."],["Abroger la loi « France Travail » et l’obligation de 15 heures d’activité hebdomadaire pour les allocataires","La loi pour le plein emploi de 2023 a créé France Travail et l’inscription automatique des allocataires du RSA. Ses partisans critiquent l’obligation d’activité ; ses défenseurs y voient un accompagnement vers l’emploi."],["Étendre la médecine du travail aux chômeurs, avec une visite obligatoire au-delà de six mois de chômage","Les chômeurs ne bénéficient pas de suivi de santé au travail. Ses partisans veulent combler ce vide ; ses critiques évoquent le coût."],["Indemniser les chômeurs dès le premier jour suivant la fin du contrat","Un délai de carence d’au moins sept jours s’applique avant l’indemnisation. Ses partisans veulent le supprimer ; ses critiques évoquent le coût."],["Supprimer l’obligation d’accepter une « offre raisonnable d’emploi »","Les chômeurs peuvent être sanctionnés s’ils refusent plus de deux offres raisonnables. Ses partisans veulent supprimer cette contrainte ; ses critiques défendent l’incitation à reprendre un emploi."],["Cesser de radier les chômeurs à la première absence à un rendez-vous et mettre fin à la logique de radiation facile","La loi de 2023 a remplacé la radiation par un dispositif de suspension et de remobilisation. Ses partisans critiquent les sanctions ; ses défenseurs soulignent la nécessité de contrôles."],["Rétablir un régime d’assurance chômage spécifique pour les intermittents de l’emploi et les intérimaires","Les annexes spécifiques de l’assurance chômage ont été supprimées pour certains publics. Ses partisans veulent des règles adaptées ; ses critiques évoquent la complexité."],["Abroger la présomption de démission en cas d’abandon de poste et la fin des allocations pour intérimaires et CDD refusant un CDI","Depuis 2023, un salarié qui abandonne son poste est présumé démissionnaire. Ses partisans y voient une perte de droits ; ses défenseurs, une limite aux abus."],["Empêcher l’État de prélever dans les caisses de l’Unédic","L’Unédic finance France Travail à hauteur de plusieurs milliards d’euros par an. Ses partisans veulent y mettre fin ; ses critiques soulignent la logique de financement du service public de l’emploi."],["Doubler les effectifs de l’inspection du travail et l’autoriser à interrompre un chantier pour raison climatique","L’inspection du travail compte moins d’agents par salarié qu’à d’autres époques. Ses partisans veulent doubler ses moyens ; ses critiques évoquent le coût."],["Établir des seuils thermiques minimaux et maximaux dans les locaux de travail, avec des pauses obligatoires en cas de chaleur ou de froid extrêmes","Un décret de 2025 impose des obligations aux employeurs lors des vagues de chaleur. Ses partisans veulent des seuils chiffrés ; ses critiques redoutent la rigidité."],["Restaurer les CHSCT, augmenter leurs moyens, rendre leurs avis contraignants et élargir leurs missions à l’environnement","Les CHSCT ont été fusionnés dans le comité social et économique en 2017. Ses partisans veulent les rétablir ; ses critiques défendent la simplification."],["Inscrire parmi les maladies professionnelles l’exposition à tous les cancérogènes classés par le CIRC, dont les pesticides","Le Centre international de recherche sur le cancer classe des substances selon leur cancérogénicité. Ses partisans veulent une reconnaissance automatique ; ses critiques évoquent le coût."],["Faire du nombre d’accidents du travail un critère d’attribution des marchés publics et exclure les employeurs récidivistes","Des critères de sécurité peuvent déjà figurer dans certains marchés. Ses partisans veulent les systématiser ; ses critiques redoutent des effets sur les petites entreprises."],["Créer un décompte national unifié et complet des accidents et morts du travail, tous statuts inclus","Les chiffres des accidents du travail diffèrent selon les régimes et excluent certains statuts. Ses partisans veulent un décompte unique ; ses critiques évoquent la complexité."],["Instaurer une pénalité financière pour les donneurs d’ordres selon le niveau d’accidents et de maladies professionnelles","La cotisation accident du travail varie déjà selon les entreprises. Ses partisans veulent responsabiliser les donneurs d’ordre ; ses critiques évoquent un coût supplémentaire."],["Rendre effectif le droit à la déconnexion et encadrer le télétravail","Le droit à la déconnexion existe dans la loi depuis 2017, mais son application est inégale. Ses partisans veulent des règles plus contraignantes ; ses critiques défendent la souplesse."],["Imposer qu’un humain contrôle chaque décision algorithmique au travail, avec un droit de veto des travailleurs","Le RGPD limite déjà les décisions entièrement automatisées. Ses partisans veulent un droit de veto ; ses critiques évoquent la lourdeur."],["Comptabiliser le RSA pour valider des trimestres de retraite","Les périodes de chômage indemnisé comptent pour la retraite, mais pas toutes les périodes de RSA. Ses partisans veulent corriger ce point ; ses critiques évoquent le coût."],["Revenir sur la non-compensation des exonérations de cotisations, qui fragilise le financement des retraites","La loi de 1994 impose à l’État de compenser les exonérations de cotisations, un principe moins appliqué ces dernières années. Ses partisans veulent le rétablir ; ses critiques évoquent les finances publiques."],["Interdire au Fonds de réserve pour les retraites d’investir dans des secteurs polluants","Le Fonds de réserve pour les retraites gère des actifs financiers. Ses partisans veulent des critères écologiques stricts ; ses critiques défendent le rendement."],["Créer une cotisation sociale universelle fusionnant les cotisations actuelles et la CSG, avec une part progressive selon les revenus","La CSG a été créée en 1990 pour élargir les ressources de la Sécurité sociale. Ses partisans veulent un prélèvement unique et progressif ; ses critiques redoutent un alourdissement pour certains."],["Garantir la continuité des droits personnels (formation, congés, ancienneté) hors du contrat de travail","Le compte personnel de formation est déjà rattaché à la personne et non au contrat. Ses partisans veulent étendre ce principe ; ses critiques évoquent la complexité."],["Garantir le maintien du revenu pendant une reconversion ou une formation","Des dispositifs comme le projet de transition professionnelle existent, avec un maintien partiel de rémunération. Ses partisans veulent un maintien intégral ; ses critiques évoquent le coût."],["Donner à chaque salarié 36 heures de formation par an, utilisables librement","Le compte personnel de formation est crédité en euros depuis 2019. Ses partisans veulent un droit en heures ; ses critiques s’interrogent sur le financement."],["Intégrer les stages et l’apprentissage dans la Sécurité sociale professionnelle","Les stagiaires et apprentis ont des statuts distincts, avec des droits différents. Ses partisans veulent une couverture unique ; ses critiques évoquent le coût."],["Revaloriser les métiers majoritairement féminins et réinstaurer les facteurs de pénibilité supprimés en 2017","Quatre critères de pénibilité ont été retirés du compte professionnel de prévention en 2017. Ses partisans veulent les rétablir ; ses critiques évoquent la complexité pour les entreprises."],["Alourdir les sanctions financières et pénales contre les entreprises qui ne respectent pas l’égalité salariale","Depuis 2019, les entreprises calculent un index d’égalité professionnelle, avec des pénalités possibles. Ses partisans veulent des sanctions plus lourdes ; ses critiques parlent de charge administrative."],["Relancer la construction de logements sociaux pour étudiants et jeunes travailleurs","Les résidences étudiantes publiques manquent dans de nombreuses villes. Ses partisans veulent un plan ; ses critiques évoquent le coût et le foncier."],["Mettre fin à la précarité étudiante en relevant les indemnités de stage et en limitant les CDD déguisés","La gratification minimale d’un stage est d’environ 4,35 euros de l’heure. Ses partisans veulent la relever ; ses critiques redoutent une baisse du nombre de stages."],["Revaloriser les métiers et revenus des professionnelles du grand âge, à domicile comme en établissement","Les aides à domicile et les aides-soignantes sont parmi les professions les moins bien rémunérées du soin. Ses partisans veulent une revalorisation ; ses critiques évoquent le financement."],["Créer des logements publics intergénérationnels à loyer réduit contre l’isolement des personnes âgées","Des projets d’habitat intergénérationnel existent déjà. Ses partisans veulent les généraliser ; ses critiques évoquent le coût."],["Créer un véritable statut d’aidant familial, rémunéré, avec formation et temps de répit","Un congé de proche aidant et une allocation journalière existent depuis 2020. Ses partisans veulent un vrai statut rémunéré ; ses critiques évoquent le coût."],["Revaloriser l’AAH au niveau du SMIC","L’allocation aux adultes handicapés est d’environ 1 000 euros par mois, inférieure au Smic. Depuis 2023, elle n’est plus soumise aux revenus du conjoint. Ses partisans veulent la relever ; ses critiques évoquent le coût."],["Favoriser l’insertion professionnelle des personnes handicapées, avec un financement pérenne et la formation des inspecteurs du travail","Les entreprises de 20 salariés et plus doivent employer 6 % de travailleurs handicapés. Ses partisans veulent un meilleur contrôle ; ses critiques évoquent les difficultés de recrutement."],["Accorder le statut de salarié aux travailleurs en ESAT","Les travailleurs en ESAT ne sont pas des salariés au sens du code du travail, même si leurs droits ont progressé. Ses partisans veulent leur reconnaître ce statut ; ses critiques redoutent un coût pour les structures."],["Garantir aux mères isolées le droit de partir : déconjugaliser l’ASF, défiscaliser les pensions alimentaires, raccourcir les délais de la justice familiale","Les familles monoparentales sont plus exposées à la pauvreté. Ses partisans veulent mieux les protéger ; ses critiques évoquent le coût."],["Ouvrir un congé de sept jours consécutifs en cas de décès d’un proche","La durée du congé varie aujourd’hui selon le lien familial. Ses partisans veulent l’harmoniser ; ses critiques évoquent le coût pour les employeurs."],["Renforcer la lutte contre les discriminations dans l’emploi par la formation et des moyens de contrôle accrus","Des testings ont montré des discriminations à l’embauche. Ses partisans veulent des contrôles plus larges ; ses critiques évoquent la charge pour les entreprises."],["Alourdir les sanctions financières et pénales contre les entreprises discriminatoires, jusqu’à l’exclusion des marchés publics","Les sanctions pour discrimination existent, mais sont rarement prononcées. Ses partisans veulent les durcir ; ses critiques évoquent l’insécurité juridique."],["Appliquer une préférence commerciale aux produits ultramarins vers l’Hexagone","Les produits des outre-mer sont concurrencés sur le marché hexagonal. Ses partisans veulent les soutenir ; ses critiques évoquent le droit de la concurrence."],["Développer les formations locales aux métiers de la bifurcation écologique","Les outre-mer manquent de formations locales dans l’énergie et la rénovation. Ses partisans veulent les développer ; ses critiques évoquent les débouchés."],["Relocaliser les productions essentielles à la vie du pays","La crise sanitaire a mis en évidence les dépendances de la France pour des produits essentiels. Ses partisans veulent relocaliser ; ses critiques évoquent le surcoût."],["Lancer un plan de reconstruction industrielle pour réduire la dépendance française dans les secteurs stratégiques","Le plan France 2030 finance déjà des projets industriels. Ses partisans veulent un effort plus planifié ; ses critiques défendent le marché."],["Réformer les comités stratégiques de filières pour en faire de véritables lieux de planification écologique industrielle","Ces comités réunissent l’État et les entreprises de chaque filière dans le cadre du Conseil national de l’industrie. Ses partisans veulent une planification plus contraignante ; ses critiques parlent de dirigisme."],["Créer des pactes de commande publique avec les filières industrielles, en échange de critères écologiques et sociaux","La commande publique représente une part importante de l’économie. Ses partisans veulent en faire un levier ; ses critiques redoutent des contraintes avec le droit européen."],["Instaurer un contrat de bifurcation écologique protégeant droits sociaux, formation et rémunération des salariés","Cette mesure vise à protéger les salariés des secteurs en transition. Ses partisans veulent des garanties ; ses critiques évoquent le coût."],["Lancer un grand plan d’investissements utiles sur les plans écologique et social","Des milliards d’euros sont déjà investis dans la transition. Ses partisans veulent un plan plus massif ; ses critiques s’interrogent sur son financement."],["Conditionner les aides publiques aux entreprises aux objectifs écologiques et sociaux du Plan, avec remboursement en cas de non-respect","Les aides publiques aux entreprises se chiffrent en plusieurs dizaines de milliards d’euros par an. Ses partisans veulent des conditions strictes ; ses critiques redoutent une complexité qui décourage l’investissement."],["Reprendre les sites en difficulté ou en cours de vente à l’étranger dans des secteurs comme la chimie, l’automobile et le numérique","Plusieurs sites industriels ont fermé ou été cédés ces dernières années. Ses partisans veulent les reprendre ; ses critiques évoquent le coût et le risque."],["Constituer une réserve stratégique nationale d’acier et de minerai","Des stocks stratégiques existent pour certains produits comme le pétrole. Ses partisans veulent étendre ce principe ; ses critiques évoquent le coût de stockage."],["Rattraper l’Allemagne en robotisation industrielle, avec 400 robots pour 10 000 salariés","L’industrie française compte plus de deux fois moins de robots que l’industrie allemande pour 10 000 salariés. Ses partisans veulent moderniser l’appareil productif ; ses critiques redoutent un effet sur l’emploi."],["Faire émerger des industries robotiques dédiées à la santé, à la mer et au spatial","Ces secteurs mobilisent des savoir-faire français, mais l’offre industrielle reste limitée. Ses partisans veulent soutenir des filières d’avenir ; ses critiques évoquent le coût."],["Bâtir une filière textile fondée sur le lin, avec des vêtements français accessibles et un réemploi massif","La France est le premier producteur mondial de lin, mais l’essentiel est transformé à l’étranger. Ses partisans veulent relocaliser la filière ; ses critiques soulignent les coûts de production."],["Instaurer en urgence des droits antidumping pour protéger la sidérurgie, l’automobile et le pharmaceutique","Les droits antidumping relèvent de la compétence de l’Union européenne, qui en applique déjà sur certains produits. Ses partisans veulent les étendre ; ses critiques redoutent des représailles."],["Modifier le Code des marchés publics pour privilégier les entreprises solidaires, écologiques et locales","Les règles de la commande publique sont encadrées par le droit européen, qui limite la préférence locale. Ses partisans veulent y intégrer des critères sociaux et écologiques ; ses critiques redoutent un risque juridique."],["Évaluer les accords de libre-échange existants et exiger des produits importés le respect des normes sociales et environnementales","Les accords commerciaux sont négociés au niveau européen. Ses partisans veulent des clauses miroirs ; ses critiques redoutent des tensions commerciales."],["Supprimer les niches fiscales sur le kérosène pour freiner la concurrence déloyale du commerce en ligne venu de l’étranger","Le kérosène est exonéré de taxe dans l’aviation commerciale. Ses partisans veulent mettre fin à cette exonération ; ses critiques soulignent les règles internationales."],["Imposer un dépôt de garantie auprès de la Banque de France pour tout investissement étranger","L’investissement étranger est libre en principe, avec un contrôle pour les secteurs sensibles. Ses partisans veulent un filtre plus strict ; ses critiques craignent de décourager les investisseurs."],["Retirer les avantages fiscaux accordés à l’épargne française placée à l’étranger, notamment via l’assurance-vie","Une partie de l’épargne française est investie dans des fonds étrangers. Ses partisans veulent la réorienter vers l’économie nationale ; ses critiques défendent la liberté de placement."],["Définir des critères de localisation de l’activité pour attribuer la commande publique et les aides aux entreprises","Le droit européen interdit de discriminer selon la nationalité d’une entreprise. Ses partisans veulent privilégier la production locale ; ses critiques évoquent le risque de sanctions."],["Appliquer réellement les peines de réquisition d’intérêt général contre les délocalisations et fermetures d’activité","Le droit prévoit déjà des sanctions pour certaines fermetures, rarement appliquées. Ses partisans veulent les rendre effectives ; ses critiques évoquent l’attractivité."],["Annuler la dette citoyenne issue des anciens opérateurs et impayés pour service non rendu, et stopper son recouvrement forcé","Le texte vise des dettes contestées par des usagers, sans préciser ici leur nature exacte. Ses partisans parlent de justice envers les usagers ; ses critiques évoquent la sécurité des contrats."],["Empêcher que la dette et les investissements des opérateurs de l’eau soient répercutés sur les factures des usagers","Les factures d’eau couvrent en partie les investissements des réseaux. Ses partisans veulent les financer autrement ; ses critiques soulignent que quelqu’un doit les payer."],["Renationaliser les autoroutes et les aéroports stratégiques, en annulant les hausses de prix passées","Les sociétés d’autoroutes ont été privatisées en 2006, avec des concessions qui s’achèvent entre 2031 et 2036. Ses partisans parlent de rente ; ses critiques évoquent le coût de rachat."],["Créer une convention collective unique pour le nucléaire, limiter la sous-traitance et garantir la reconversion des salariés","Les salariés du nucléaire relèvent de statuts différents selon les entreprises, avec une forte sous-traitance. Ses partisans veulent un cadre commun ; ses critiques évoquent la complexité."],["Réformer la protection sociale agricole pour garantir aux agriculteurs une retraite digne","Une loi de 2020 a fixé un minimum de 85 % du Smic pour les retraites agricoles. Ses partisans veulent aller plus loin ; ses critiques évoquent le financement."],["Garantir les moyens de l’INAO pour protéger les appellations d’origine et les indications géographiques face à la concurrence","L’INAO gère les labels comme les AOC. Ses partisans veulent renforcer sa protection ; ses critiques évoquent le coût."],["Intégrer les règles fondamentales de l’OIT dans les accords commerciaux","L’OIT fixe des normes comme l’interdiction du travail forcé ou des enfants. Ses partisans veulent les rendre contraignantes dans les accords ; ses critiques soulignent les différences de développement."],["Pousser à l’ONU un texte contraignant imposant aux multinationales le respect des normes sociales et environnementales","Un traité de ce type est en négociation à l’ONU depuis 2014. Ses partisans veulent le faire aboutir ; ses critiques redoutent des charges pour les entreprises."],["Œuvrer à un règlement collectif des dettes publiques, hors logique de marché, selon la résolution de l’ONU de 2015","L’Assemblée générale de l’ONU a adopté en 2015 des principes pour la restructuration des dettes souveraines. Ses partisans veulent les appliquer ; ses critiques soulignent leur portée non contraignante."],["Revenir sur les privatisations, notamment celles des aéroports, des autoroutes et de la Française des jeux","La Française des jeux a été privatisée en 2019, après plusieurs autres cessions d’actifs. Ses partisans veulent les reprendre ; ses critiques évoquent le coût."],["Rendre effectif le droit de réquisition des usines et entreprises d’intérêt général par l’État","Le droit prévoit la réquisition en cas de crise, rarement utilisée. Ses partisans veulent l’appliquer ; ses critiques défendent la liberté d’entreprendre."],["Décréter un moratoire sur les partenariats public-privé, les auditer et abroger les textes qui les permettent","Les partenariats public-privé existent depuis 2004 et ont été critiqués par la Cour des comptes pour leur coût. Ses partisans veulent les arrêter ; ses critiques soulignent leur rapidité de réalisation."],["Poursuivre les atteintes au patrimoine industriel touchant aux intérêts fondamentaux de la Nation, selon le Code pénal","Le Code pénal protège déjà les intérêts fondamentaux de la Nation, dont l’économie. Ses partisans veulent l’appliquer aux délocalisations ; ses critiques évoquent l’insécurité juridique."],["Accorder aux comités d’entreprise un veto suspensif sur les licenciements et les cessions, ainsi qu’un contrôle renforcé des finances","Les représentants des salariés sont informés et consultés mais n’ont pas de droit de veto. Ses partisans veulent leur donner du poids ; ses critiques redoutent une paralysie des décisions."],["Renforcer le pouvoir des salariés en cas de redressement ou de liquidation, et instaurer un vote de défiance envers les dirigeants","Les salariés ont aujourd’hui un rôle limité dans les procédures collectives. Ses partisans veulent plus de droits ; ses critiques évoquent l’impact sur les créanciers."],["Faire siéger au moins un tiers de salariés dans les instances des grandes entreprises, aux côtés d’autres parties prenantes","La loi Pacte de 2019 a étendu la présence d’administrateurs salariés. L’Allemagne pratique une cogestion plus forte. Ses partisans veulent aller plus loin ; ses critiques redoutent une complexité de gouvernance."],["Protéger les représentants du personnel et les délégués syndicaux contre les licenciements abusifs","Les représentants du personnel sont déjà protégés, avec une autorisation de l’inspection du travail. Ses partisans veulent renforcer cette protection ; ses critiques évoquent la rigidité."],["Créer des comités sociaux et économiques à l’échelle de sites comme les centres commerciaux et les zones industrielles","Les salariés de petites structures partageant un même lieu ont peu d’instances de représentation. Ses partisans veulent une représentation de site ; ses critiques évoquent la complexité."],["Permettre aux salariés des très petites entreprises de bénéficier d’une représentation syndicale extérieure","Des commissions paritaires régionales existent depuis 2021 pour les très petites entreprises. Ses partisans veulent renforcer leurs droits ; ses critiques évoquent la charge pour les employeurs."],["Réformer les tribunaux de commerce pour mieux y représenter les salariés","Les tribunaux de commerce sont composés de juges élus par les commerçants. Ses partisans veulent y faire entrer les salariés ; ses critiques défendent l’expertise des chefs d’entreprise."],["Étendre l’économie sociale et solidaire et protéger le secteur associatif","L’économie sociale et solidaire représente environ un emploi sur dix en France. Ses partisans veulent la soutenir ; ses critiques évoquent la dépendance aux financements publics."],["Garantir à l’ESS un accès au financement et aux marchés publics","Les structures de l’ESS peinent parfois à obtenir des crédits. Ses partisans veulent leur réserver des aides ; ses critiques redoutent des distorsions de concurrence."],["Donner la priorité aux structures non lucratives de l’ESS pour la petite enfance, l’aide aux aînés et la restauration collective","Le secteur privé lucratif s’est développé dans les crèches et les EHPAD. Ses partisans veulent privilégier le non-lucratif ; ses critiques défendent la liberté d’entreprendre."],["Développer les SCIC et les Scop, ainsi que des services à gouvernance partagée entre usagers, salariés et partenaires","Les Scop sont des coopératives détenues par leurs salariés, et les SCIC associent plusieurs types de membres. Ses partisans veulent les multiplier ; ses critiques soulignent leur difficulté à lever des fonds."],["Multiplier les coopératives d’activité et d’emploi pour combattre l’autoentreprenariat subi et favoriser le travail en commun","Les coopératives d’activité et d’emploi permettent à des entrepreneurs d’être salariés d’une structure commune. Ses partisans veulent les développer ; ses critiques évoquent la liberté d’entreprendre."],["Bloquer et plafonner les prix de l’alimentation, de l’énergie et des carburants, et interdire la réduflation","Le blocage des prix a été utilisé ponctuellement dans le passé. Ses partisans protègent le pouvoir d’achat ; ses critiques redoutent des pénuries."],["Renforcer le bouclier qualité-prix dans les Outre-mer","Ce dispositif, créé en 2012, plafonne le prix d’un panier de produits de consommation courante. Ses partisans veulent l’étendre ; ses critiques évoquent des effets limités."],["Augmenter de 10 % la valeur du point d’indice, inscrire son dégel dans la loi et compenser intégralement les collectivités","Le point d’indice a augmenté de 3,5 % en 2022 et de 1,5 % en 2023. Ses partisans veulent un rattrapage ; ses critiques évoquent le coût pour l’État et les collectivités."],["Relever de 10 % les aides au logement (APL)","Les APL ont été réformées en 2018 et 2021, avec des économies à la clé. Ses partisans veulent les revaloriser ; ses critiques évoquent le coût et le risque de hausse des loyers."],["Constituer des stocks tampons de matières premières alimentaires pour lisser les prix et garantir l’offre en temps de crise","L’Union européenne a eu des stocks agricoles par le passé. Ses partisans veulent en reconstituer ; ses critiques évoquent le coût et les risques de gaspillage."],["Refonder l’impôt sur les sociétés avec un barème progressif, modulé pour favoriser le réinvestissement plutôt que la distribution de dividendes","Le taux normal est de 25 % depuis 2022, avec 15 % pour les petites entreprises. Ses partisans veulent un barème plus progressif ; ses critiques redoutent un effet sur la compétitivité."],["Exonérer de droits de succession les héritages inférieurs à 150 000 euros","Un abattement de 100 000 euros par enfant existe en ligne directe. Ses partisans veulent le relever ; ses critiques évoquent le coût pour l’État."],["Passer les niches fiscales au crible, supprimer les injustes et convertir les réductions d’impôt en crédits accessibles à tous","Les niches fiscales coûtent plusieurs dizaines de milliards d’euros par an. Ses partisans veulent les évaluer ; ses critiques soulignent leur rôle d’incitation."],["Instaurer un impôt universel sur les entreprises, assis sur leur activité réelle en France, ainsi que sur les revenus des particuliers","Un impôt mondial minimal de 15 % sur les multinationales a été adopté en 2022 au niveau de l’Union. Ses partisans veulent un dispositif plus ambitieux ; ses critiques évoquent la complexité."],["Accorder à toutes les familles un crédit d’impôt par enfant","Le quotient familial réduit l’impôt davantage pour les foyers aisés. Ses partisans veulent un crédit uniforme ; ses critiques redoutent des pertes pour certaines familles."],["Faire de la lutte contre la fraude fiscale une priorité, avec davantage de moyens humains et financiers pour le contrôle fiscal","Les estimations de la fraude fiscale varient fortement selon les sources. Ses partisans veulent plus d’agents de contrôle ; ses critiques évoquent l’efficacité réelle des contrôles."],["Supprimer la convention judiciaire d’intérêt public, qui permet de négocier les sanctions pour fraude fiscale","Cette convention, créée en 2016, permet à une entreprise d’éviter un procès en payant une amende. Ses partisans y voient une justice négociée trop clémente ; ses défenseurs, un moyen d’obtenir des sanctions rapides."],["Intensifier les poursuites et alourdir les peines contre les délinquants en col blanc condamnés pour fraude fiscale","Les peines maximales pour fraude fiscale sont de cinq à sept ans de prison. Ses partisans veulent des sanctions plus fermes ; ses critiques évoquent l’effet dissuasif réel."],["Mettre fin aux pratiques frauduleuses d’arbitrage de dividendes","Les affaires « CumEx » et « CumCum » ont révélé des montages d’optimisation des dividendes. Ses partisans veulent y mettre fin ; ses critiques soulignent la complexité."],["Rendre publics les montants des aides perçues par les grandes entreprises et les conditionner à des objectifs du Plan","Une commission d’enquête du Sénat a chiffré à plus de 200 milliards d’euros les aides publiques aux entreprises en 2023. Ses partisans veulent plus de transparence ; ses critiques redoutent la lourdeur."],["Créer une mission d’évaluation des faveurs fiscales et des cessions depuis trente ans, avec possibilité de poursuites contre les responsables","Plusieurs privatisations et niches fiscales ont été décidées depuis trente ans. Ses partisans veulent un bilan ; ses critiques y voient une démarche politique."],["Remplacer la CVAE par un impôt progressif fondé sur le chiffre d’affaires et l’empreinte écologique, au profit des éco-régions","La cotisation sur la valeur ajoutée des entreprises est supprimée progressivement depuis 2023. Ses partisans veulent un impôt de remplacement ; ses critiques veulent alléger la fiscalité de production."],["Revaloriser la rémunération des apprentis et des alternants","Les apprentis sont payés en pourcentage du Smic selon leur âge. Ses partisans veulent les revaloriser ; ses critiques redoutent un coût pour les entreprises."],["Revaloriser salaires, conditions de travail et parcours des métiers à prédominance féminine du soin, du lien et du contact","Ces métiers sont parmi les plus féminisés et les moins bien rémunérés. Ses partisans veulent un rattrapage ; ses critiques évoquent le coût."],["Plafonner les salaires pour que l’écart entre le plus bas et le plus haut ne dépasse pas 1 à 20 dans une entreprise","Les rémunérations des dirigeants des grandes entreprises dépassent très largement ce rapport. Ses partisans veulent un plafonnement ; ses critiques défendent la compétitivité internationale."],["Créer une commission salariale de contrôle de l’égalité femmes-hommes et sanctionner sévèrement les inégalités de rémunération","L’index d’égalité professionnelle existe depuis 2019. Ses partisans veulent un contrôle externe ; ses critiques évoquent la lourdeur."],["Majorer les rémunérations des horaires décalés, en début de journée, en soirée et le week-end","Le travail de nuit et du dimanche donne droit à des contreparties, mais pas les autres horaires atypiques. Ses partisans veulent étendre les majorations ; ses critiques évoquent le coût."],["Interdire les parachutes dorés et les retraites chapeaux","Ces avantages sont encadrés par le code Afep-Medef et par la loi. Ses partisans veulent les interdire ; ses critiques défendent la liberté contractuelle."],["Supprimer les stock-options et les actions gratuites accordées aux dirigeants","Ces dispositifs associent les dirigeants à la valeur de l’entreprise. Ses partisans y voient une rémunération excessive ; ses critiques, un outil d’alignement des intérêts."],["Mettre en place un contrôle des mouvements de capitaux","La libre circulation des capitaux est un principe des traités européens. Ses partisans veulent pouvoir la restreindre ; ses critiques redoutent une fuite des capitaux."],["Proscrire les produits dérivés toxiques, limiter l’effet de levier et taxer les rachats d’actions","Les États-Unis taxent les rachats d’actions à 1 % depuis 2023. Ses partisans veulent réduire les risques financiers ; ses critiques défendent la liquidité des marchés."],["Encadrer la finance non bancaire aussi strictement que les banques, et interdire aux banques de prêter aux acteurs les plus risqués","Les fonds et acteurs de la finance non bancaire échappent en partie à la régulation bancaire. Ses partisans veulent combler cet écart ; ses critiques redoutent un effet sur le financement."],["Soumettre les grands LBO à une autorisation préalable de l’État et supprimer leurs avantages fiscaux","Les rachats d’entreprise par endettement (LBO) reposent sur la dette de l’entreprise rachetée. Ses partisans dénoncent des montages risqués ; ses critiques soulignent leur rôle dans la transmission."],["Empêcher les manipulations comptables dans les groupes en limitant les remontées vers les holdings et les frais intragroupe","Les transferts de prix à l’intérieur des groupes peuvent réduire le bénéfice imposable. Ses partisans veulent les encadrer ; ses critiques évoquent la complexité."],["Renforcer le contrôle des investissements étrangers stratégiques, avec notification obligatoire au ministère de l’Économie","Un contrôle des investissements étrangers existe depuis 2019 et a été étendu. Ses partisans veulent le renforcer ; ses critiques défendent l’attractivité."],["Nationaliser certaines banques de détail et les intégrer au pôle public pour financer les TPE selon des critères sociaux et écologiques","Les banques ont été nationalisées en 1982 puis privatisées à la fin des années 1980. Ses partisans veulent orienter le crédit ; ses critiques redoutent un coût élevé."],["Auditer le coût économique, social et écologique des banques et de la finance","Un audit de ce type chiffrerait les externalités de la finance. Ses partisans veulent la transparence ; ses critiques s’interrogent sur sa méthode."],["Appliquer rigoureusement la réglementation des crypto-actifs pour limiter leur impact environnemental et spéculatif","Le règlement européen MiCA encadre les crypto-actifs depuis fin 2024. Ses partisans veulent une application stricte ; ses critiques évoquent l’innovation."],["Rendre gratuit le socle bancaire essentiel pour tout titulaire d’un compte courant","Une offre à 3 euros par mois est déjà prévue pour les clients en situation de fragilité financière. Ses partisans veulent la gratuité ; ses critiques évoquent le coût pour les banques."],["Établir de nouveaux indicateurs de progrès humain pour placer l’économie au service du bien-vivre","Une loi de 2015 a créé dix indicateurs de richesse complémentaires du PIB. Ses partisans veulent leur donner un rôle central ; ses critiques soulignent la difficulté de les utiliser."],["Supprimer la cotation continue en Bourse et moduler les droits de vote selon la durée d’engagement des actionnaires","La loi de 2014 a généralisé le droit de vote double pour les actionnaires de longue durée. Ses partisans veulent aller plus loin ; ses critiques défendent la liquidité."],["Interdire les licenciements boursiers ou économiques aux entreprises qui versent des dividendes ou reçoivent des aides publiques","Les licenciements économiques sont encadrés par la loi. Ses partisans veulent les interdire dans certains cas ; ses critiques redoutent un frein à l’embauche."],["Rétablir un circuit du Trésor pour soustraire la dette publique aux marchés financiers","Le circuit du Trésor permettait à l’État de se financer auprès de banques publiques, avant les réformes des années 1980. Ses partisans veulent le rétablir ; ses critiques soulignent les contraintes européennes."],["Arrêter l’émission d’obligations indexées sur l’inflation (OATi), jugées coûteuses pour les comptes publics","Ces obligations protègent leurs détenteurs de l’inflation mais augmentent la charge de la dette quand les prix montent. Ses partisans critiquent leur coût ; ses défenseurs, la diversification de la dette."],["Réformer la Cades, dont le fonctionnement priverait la Sécurité sociale de 19 milliards d’euros par an","La Caisse d’amortissement de la dette sociale a été créée en 1996 pour rembourser les déficits sociaux. Ses partisans veulent affecter ses ressources à la Sécurité sociale ; ses critiques évoquent la dette."],["Durcir les sanctions contre les retards de paiement des grands groupes envers les TPE-PME","Les délais de paiement sont plafonnés à 60 jours, avec des amendes de l’administration. Ses partisans veulent des sanctions plus lourdes ; ses critiques évoquent le coût."],["Créer une caisse de péréquation interentreprises, financée par un barème progressif, pour soutenir la trésorerie des TPE-PME","Les petites entreprises sont souvent exposées aux problèmes de trésorerie. Ses partisans veulent une mutualisation ; ses critiques redoutent un nouveau prélèvement."],["Modifier les règles de représentativité des instances patronales en faveur des TPE-PME et de l’ESS","Le Medef, la CPME et l’U2P sont les organisations patronales représentatives. Ses partisans veulent mieux représenter les petites entreprises ; ses critiques défendent le dialogue existant."],["Développer le statut d’employeur-salarié pour protéger socialement les petits entrepreneurs","Les indépendants ont une protection sociale plus faible que les salariés. Ses partisans veulent un statut intermédiaire ; ses critiques évoquent la complexité."],["Faire bénéficier les PME et l’ESS des aides et des commandes publiques à hauteur de leur poids économique","Les grandes entreprises captent une part importante des marchés publics. Ses partisans veulent une répartition proportionnelle ; ses critiques redoutent des quotas contraires au droit européen."],["Créer des aides spécifiques pour favoriser l’installation d’entreprises, d’artisans et de commerçants","Des aides à l’installation existent déjà, comme les exonérations en zones de revitalisation. Ses partisans veulent les amplifier ; ses critiques évoquent le coût."],["Interdire de refacturer la taxe foncière aux locataires de baux commerciaux et encadrer ces loyers","La loi Pinel de 2014 encadre déjà les charges refacturables aux locataires commerciaux. Ses partisans veulent aller plus loin ; ses critiques défendent la liberté des baux."],["Rétablir des prix de l’énergie encadrés pour les entreprises","Les tarifs réglementés ne sont plus accessibles à la plupart des entreprises. Ses partisans veulent les rétablir ; ses critiques soulignent les règles européennes."],["Offrir aux TPE-PME l’accès à un escompte à taux zéro via le pôle public bancaire","L’escompte est une avance sur factures. Ses partisans veulent un financement gratuit ; ses critiques évoquent le coût pour l’État."],["Plafonner les frais bancaires, en particulier ceux liés au paiement par carte","Les commissions d’interchange sont déjà plafonnées par l’Union européenne depuis 2015. Ses partisans veulent encadrer aussi les frais facturés aux commerçants ; ses critiques soulignent le modèle économique des banques."],["Instaurer un service d’affacturage garanti par l’État","L’affacturage permet de recevoir un paiement immédiat en cédant ses factures. Ses partisans veulent une garantie publique ; ses critiques évoquent le risque pour l’État."],["Mettre à disposition des TPE-PME un outil public et gratuit de gestion des factures électroniques","La facturation électronique sera obligatoire progressivement à partir de septembre 2026. Ses partisans veulent un outil public gratuit ; ses critiques soulignent le rôle des opérateurs privés."],["Améliorer le régime des intermittents selon l’accord de 2023, et l’étendre aux professions discontinues comme les extras ou les guides-conférenciers","Le régime des intermittents du spectacle repose sur des annexes spécifiques de l’assurance chômage. Ses partisans veulent l’étendre ; ses critiques évoquent son coût pour l’assurance chômage."],["Lancer dès les premiers jours un plan d’urgence pour éradiquer la grande pauvreté","Plus de neuf millions de personnes vivent sous le seuil de pauvreté en France. Ses partisans veulent un plan massif ; ses critiques évoquent le financement."],["Instaurer un « état d’urgence sociale » pour éviter que les crises ne plongent des millions de personnes dans l’exclusion","Cette mesure permettrait de déclencher des aides de manière automatique en cas de crise. Ses partisans veulent une protection renforcée ; ses critiques redoutent un coût difficile à maîtriser."]],"ins":[["Interdire de confier la propagande électorale à des entreprises privées","La distribution des professions de foi a été confiée à des prestataires privés, dont les défaillances ont perturbé l’élection présidentielle de 2022. Ses partisans veulent un opérateur public ; ses critiques évoquent le coût."],["Présenter systématiquement au bureau de l’Assemblée les propositions issues des conventions citoyennes","La Convention citoyenne pour le climat (2019-2020) et celle sur la fin de vie (2022-2023) ont rendu des propositions sans suite automatique. Ses partisans veulent leur donner un poids ; ses critiques défendent la primauté des élus."],["Affirmer trois échelons décentralisés : communes, départements et éco-régions","L’organisation territoriale française compte plusieurs niveaux, dont les intercommunalités et les régions. Ses partisans veulent la simplifier ; ses critiques redoutent un nouveau découpage."],["Organiser une conférence sur l’avenir institutionnel des territoires insulaires et éloignés","Les outre-mer ont des statuts très variés. Ses partisans veulent un débat sur leur évolution ; ses critiques demandent des mesures concrètes."],["Garantir aux élus un droit à la formation professionnelle à la sortie de leur mandat","Un droit individuel à la formation des élus existe déjà. Ses partisans veulent faciliter leur reconversion ; ses critiques évoquent le coût."],["Voter une loi d’amnistie pour les militants et syndicalistes condamnés pour leur engagement","Des lois d’amnistie ont suivi les élections présidentielles jusqu’en 2002, avec des exclusions. Ses partisans veulent une amnistie sociale ; ses critiques défendent l’autorité des décisions de justice."],["Instaurer un moratoire sur les radiations électorales et inscrire automatiquement les électeurs","L’inscription est automatique à 18 ans depuis 2016, et un répertoire électoral unique existe depuis 2019. Ses partisans veulent une inscription généralisée ; ses critiques redoutent des erreurs de listes."],["Convoquer un référendum au titre de l’article 11 pour lancer le processus constituant","L’article 11 permet au président de soumettre certains projets de loi au référendum. Ses partisans y voient une voie directe ; ses critiques contestent sa conformité à la procédure de révision."],["Soumettre à référendum le projet de Constitution élaboré par la Constituante","Un référendum final validerait le texte rédigé par l’assemblée constituante. Ses partisans veulent un vote populaire ; ses critiques redoutent un clivage."],["Instaurer une 6e République parlementaire stable et ouverte à l’intervention citoyenne","La Ve République donne un rôle important au président. Ses partisans veulent un régime plus parlementaire ; ses critiques craignent l’instabilité gouvernementale de la IVe République."],["Contraindre le gouvernement à rendre réellement des comptes devant le Parlement","Les questions au gouvernement et les commissions d’enquête existent déjà. Ses partisans veulent un contrôle plus fort ; ses critiques défendent l’efficacité de l’exécutif."],["Mettre en place un plan de séparation de l’argent et de l’État","Le financement des partis et des campagnes est déjà encadré depuis les années 1990. Ses partisans veulent limiter l’influence de l’argent ; ses critiques évoquent la liberté d’expression politique."],["Appliquer l’inéligibilité des personnes condamnées pour corruption et lancer un plan national anticorruption","Une peine d’inéligibilité est obligatoire pour certaines infractions depuis la loi de 2016. Ses partisans veulent un plan plus large ; ses critiques soulignent la présomption d’innocence."],["Durcir les règles sur les conflits d’intérêts et interdire le pantouflage, avec remboursement de la formation en cas de départ précoce","Les anciens hauts fonctionnaires sont contrôlés par la Haute Autorité pour la transparence de la vie publique, et doivent rembourser une partie de leur formation en cas de départ rapide. Ses partisans veulent un cadre plus strict ; ses critiques redoutent un frein aux carrières."],["Garantir des concours de la fonction publique reflétant la diversité sociale","Les classes préparatoires « Égalité des chances » aident des candidats modestes. Ses partisans veulent élargir ces dispositifs ; ses critiques défendent la neutralité du concours."],["Supprimer le monopole de l’administration fiscale sur le déclenchement des poursuites pour fraude","Le « verrou de Bercy » réserve au fisc la saisine de la justice pour fraude fiscale, avec un assouplissement en 2018. Ses partisans veulent le supprimer ; ses critiques défendent les procédures administratives."],["Réformer le financement de la vie politique et abaisser le plafond des dons individuels aux partis","Un particulier peut verser jusqu’à 7 500 euros par an à un parti politique. Ses partisans veulent réduire l’influence des gros donateurs ; ses critiques évoquent le financement des partis."],["Interdire la sous-traitance de politiques publiques à des cabinets de conseil et leur surfacturation","Une commission d’enquête du Sénat a révélé en 2022 l’ampleur du recours à des cabinets de conseil comme McKinsey. Ses partisans veulent y mettre fin ; ses critiques défendent l’expertise extérieure."],["Abolir la réforme Macron du corps préfectoral et diplomatique","La réforme de la haute fonction publique de 2022 a supprimé certains grands corps et l’ENA. Ses partisans veulent revenir en arrière ; ses critiques défendent la réforme."],["Garantir la liberté de conscience et une laïcité stricte","La laïcité repose sur la loi de 1905 et sur plusieurs lois ultérieures. Ses partisans veulent une application stricte ; ses critiques redoutent des atteintes à la liberté religieuse."],["Rétablir l’Observatoire de la laïcité","L’Observatoire de la laïcité a été supprimé en 2021. Ses partisans veulent le rétablir ; ses critiques estiment que ses missions sont assurées ailleurs."],["Combattre les communautarismes et l’usage politique des religions","La notion de communautarisme est débattue et son périmètre varie selon les acteurs. Ses partisans veulent protéger le pacte républicain ; ses critiques craignent la stigmatisation de certains groupes."],["Refuser les financements publics pour les édifices religieux, les établissements confessionnels et les cultes","La loi de 1905 interdit de subventionner les cultes, avec des exceptions comme l’entretien des édifices anciens et le financement des écoles privées sous contrat. Ses partisans veulent supprimer ces exceptions ; ses critiques défendent le patrimoine."],["Garantir à toutes les familles l’accès à une école publique laïque de proximité","Les fermetures d’écoles rurales sont un sujet récurrent. Ses partisans veulent un maillage complet ; ses critiques soulignent les contraintes budgétaires."],["Rétablir la Miviludes et renforcer ses moyens et son autonomie","La Mission interministérielle de vigilance et de lutte contre les dérives sectaires surveille les emprises sectaires. Ses partisans veulent plus de moyens ; ses critiques évoquent le risque d’ingérence."],["Adopter une loi contre la concentration des médias","La loi de 1986 limite la concentration, avec des seuils par support. Ses partisans veulent une loi plus ambitieuse ; ses critiques défendent la liberté d’entreprendre."],["Établir des règles contre la concentration horizontale des médias et leurs regroupements avec d’autres industries culturelles","Certains groupes réunissent presse, radio, télévision, édition et publicité. Ses partisans veulent les limiter ; ses critiques évoquent la taille nécessaire face aux géants du numérique."],["Empêcher un même groupe de contrôler à la fois les infrastructures et la production de contenus","Cette règle viserait les groupes réunissant opérateurs de réseau et producteurs. Ses partisans veulent préserver le pluralisme ; ses critiques évoquent les synergies."],["Transformer le Conseil de déontologie des médias en véritable contre-pouvoir citoyen","Le Conseil de déontologie journalistique et de médiation, créé en 2019, traite des plaintes du public. Ses partisans veulent lui donner un pouvoir de sanction ; ses critiques défendent l’autorégulation."],["Doter les rédactions d’un statut juridique leur ouvrant des droits collectifs, comme le droit d’opposition ou la motion de défiance","La loi de 2016 a renforcé l’indépendance des rédactions face aux actionnaires. Ses partisans veulent aller plus loin ; ses critiques défendent le droit de propriété."],["Réguler les plateformes pour garantir une information de qualité et lutter contre la désinformation et les ingérences","Le règlement européen sur les services numériques de 2022 impose des obligations aux grandes plateformes. Ses partisans veulent un encadrement plus ferme ; ses critiques redoutent des atteintes à la liberté d’expression."],["Donner aux abonnés et aux usagers des droits sur la gouvernance des médias","Quelques médias, comme certaines coopératives de presse, associent leurs lecteurs à la gouvernance. Ses partisans veulent généraliser ce modèle ; ses critiques évoquent la gestion."],["Refonder les aides publiques à la presse pour mieux refléter sa diversité","L’État verse chaque année des aides à la presse, dont une partie va aux grands titres. Ses partisans veulent privilégier la diversité ; ses critiques redoutent une dépendance à l’État."],["Revoir les missions de l’Arcom et garantir l’attribution des fréquences aux médias locaux, associatifs et publics","L’Arcom, créée en 2022 par la fusion du CSA et de l’Hadopi, attribue les fréquences. Ses partisans veulent en faire un levier du pluralisme ; ses critiques défendent son indépendance."],["Donner aux médias locaux, notamment d’Outre-mer, les moyens d’informer et de combattre les déserts informationnels","De nombreux territoires n’ont plus de média local. Ses partisans veulent des aides ciblées ; ses critiques évoquent l’équilibre économique."],["Lutter contre les procédures-bâillons et retirer les affaires de presse aux tribunaux de commerce","Une directive européenne de 2024 protège contre les procédures-bâillons. Ses partisans veulent un cadre plus protecteur ; ses critiques défendent la réparation des atteintes à la réputation."],["Protéger les journalistes couvrant les manifestations","Le schéma du maintien de l’ordre de 2020 a suscité des polémiques sur les journalistes. Ses partisans veulent des garanties ; ses critiques évoquent la sécurité des opérations."],["Confier au Parlement l’orientation de la politique pénale, via un débat annuel suivi d’un vote","La politique pénale est aujourd’hui définie par le garde des Sceaux et les parquets. Ses partisans veulent un débat démocratique ; ses critiques redoutent l’influence politique sur la justice."],["Renforcer l’indépendance de la justice face à l’exécutif en limitant les remontées d’informations individuelles","Depuis 2013, le ministre de la Justice ne peut plus donner d’instruction dans les affaires individuelles. Ses partisans veulent limiter aussi les remontées d’information ; ses critiques soulignent le besoin d’information du pouvoir."],["Sécuriser le secret de l’instruction et de l’enquête","Le secret de l’instruction est prévu par le Code de procédure pénale mais souvent violé. Ses partisans veulent mieux le protéger ; ses critiques mettent en avant la liberté de la presse."],["Créer un service public d’accueil et d’accompagnement des victimes","Des associations et des dispositifs publics aident déjà les victimes. Ses partisans veulent un service unifié ; ses critiques évoquent le coût."],["Reconnaître le statut de victime indépendamment de l’issue d’une procédure pénale","Le statut de victime est lié aujourd’hui à la procédure. Ses partisans veulent un accès aux droits sans attendre le jugement ; ses critiques évoquent la présomption d’innocence."],["Assurer aux victimes de violences sexistes et sexuelles un accompagnement individualisé et des soins pris en charge à 100 % par la Sécurité sociale","Certains soins liés aux violences sont déjà remboursés. Ses partisans veulent une prise en charge complète ; ses critiques évoquent le coût."],["Améliorer l’accès à la justice, notamment par l’aide juridictionnelle et le retour des tribunaux de proximité","La réforme de la carte judiciaire de 2008-2010 a supprimé plus de 170 tribunaux. Ses partisans veulent les rouvrir ; ses critiques évoquent le coût."],["Planifier des moyens pour la justice et recruter magistrats, greffiers et agents de la protection judiciaire de la jeunesse","La loi de programmation de 2023 prévoit le recrutement de 1 500 magistrats et 1 800 greffiers d’ici 2027. Ses partisans veulent aller plus loin ; ses critiques demandent des résultats."],["Renforcer les droits de la défense, l’inscrire dans la Constitution et limiter la visioconférence","La visioconférence est utilisée dans certaines audiences. Ses partisans veulent préserver le contact direct ; ses critiques évoquent la rapidité."],["Former les magistrats exerçant outre-mer sans en être originaires","Beaucoup de magistrats en outre-mer viennent de l’Hexagone. Ses partisans veulent une meilleure connaissance des réalités locales ; ses critiques évoquent le coût."],["Redonner aux communes leur rôle de cellule de base de la démocratie locale, avec une libre association","La France compte environ 35 000 communes, souvent regroupées en intercommunalités obligatoires. Ses partisans veulent plus d’autonomie communale ; ses critiques défendent l’efficacité intercommunale."],["Supprimer les métropoles technocratiques et rendre aux communes le choix libre de leurs associations","Les métropoles ont été créées en 2014 pour gérer de grandes agglomérations. Ses partisans veulent les supprimer ; ses critiques défendent leur capacité d’action."],["Rééquilibrer la dotation globale de fonctionnement des communes et l’indexer sur l’inflation","La DGF s’élève à environ 27 milliards d’euros et a baissé entre 2014 et 2017. Ses partisans veulent l’indexer sur les prix ; ses critiques évoquent le coût."],["Créer un fonds de soutien pour augmenter le budget des communes rurales","Les communes rurales disposent de moins de ressources par habitant. Ses partisans veulent une péréquation plus forte ; ses critiques évoquent les finances de l’État."],["Revaloriser et rééquilibrer les indemnités des élus selon leur temps de travail et leurs responsabilités","Les indemnités des élus locaux ont été revalorisées en 2019 dans les petites communes. Ses partisans veulent une meilleure reconnaissance ; ses critiques évoquent le coût."],["Valoriser le métier de secrétaire de mairie par des postes à temps complet et des formations adaptées","Beaucoup de secrétaires de mairie travaillent à temps partiel dans de petites communes. Ses partisans veulent professionnaliser la fonction ; ses critiques évoquent le coût."],["Imposer la parité dans les exécutifs municipaux et communautaires","La parité est obligatoire sur les listes municipales dans les communes de plus de 1 000 habitants, mais les maires sont encore minoritairement des femmes. Ses partisans veulent l’étendre aux exécutifs ; ses critiques évoquent le choix des élus."],["Réformer la désignation des conseils communautaires pour renforcer la parité de leur exécutif","Les intercommunalités comptent peu de présidentes. Ses partisans veulent corriger ce déséquilibre ; ses critiques défendent la souplesse."],["Associer pleinement les communes aux décisions et aux investissements de la planification écologique","La planification est portée au niveau national, avec des déclinaisons locales. Ses partisans veulent plus de décentralisation ; ses critiques défendent la cohérence nationale."],["Supprimer les eurorégions","Les eurorégions sont des structures de coopération transfrontalière. Ses partisans veulent supprimer certaines structures ; ses critiques soulignent leur rôle de coopération entre voisins."],["Réserver le statut de collectivité unique aux territoires insulaires et aux Outre-mer","La Corse, la Guyane et la Martinique ont une collectivité unique, tout comme l’Alsace depuis 2021 sous une forme proche. Ses partisans veulent limiter ce modèle ; ses critiques défendent la souplesse."],["Reconstruire un maillage dense de transports et de services publics, avec un accès en 15 à 30 minutes maximum","Des zones rurales sont éloignées des services d’urgence ou des gares. Ses partisans veulent un objectif de proximité ; ses critiques évoquent le coût."],["Réaffirmer le département comme échelle pertinente pour organiser les services publics essentiels","Les départements gèrent l’action sociale et les collèges. Ses partisans veulent consolider leur rôle ; ses critiques défendent les régions."],["Organiser des états généraux des quartiers populaires et des espaces ruraux","Ces territoires cumulent souvent des difficultés d’accès aux services. Ses partisans veulent une consultation large ; ses critiques demandent des mesures concrètes."],["Renforcer et rouvrir des accueils physi
