# Prod : docker compose --profile prod up -d --build -> http://localhost:8080
# Dev  : flutter run -d chrome (hot reload, hors Docker) — voir le Makefile
services:
  prod:
    profiles: ["prod"]
    build: { context: ., target: prod }
    image: boussole-des-mesures:latest
    ports: ["8080:8080"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
